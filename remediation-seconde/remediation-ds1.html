<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remédiation DS1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Playwrite+FR+Moderne:wght@300&display=swap">
<style>
/* Mise en page : une colonne de lecture (accueil = sommaire par domaine ; thème = rappel, exemple pas à pas, exercices).
   Thème clair fixe, choisi pour rester lisible en classe comme les autres pages de projection. */
:root {
  color-scheme: light;
  --bg: #F5F7FA;          /* fond, gris bleuté très clair */
  --paper: #FFFFFF;       /* cartes */
  --ink: #1D2733;         /* texte */
  --muted: #5B6878;       /* texte secondaire */
  --line: #DCE3EB;        /* filets */
  --calc: #1C7ED6;        /* bleu « Rappel » des feuilles LaTeX */
  --calc-soft: #EAF3FC;
  --sky: #339AF0;         /* pastille d'exercice */
  --green: #2F9E44;       /* correction, réussite */
  --green-soft: #EBF7EE;
  --star-green: #40C057;
  --star-blue: #228BE6;
  --red: #E03131;         /* attention, erreur */
  --red-soft: #FDEEEE;
  --amber: #B35C00;
  --amber-soft: #FFF4E5;
  --f-body: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
  --f-cursive: "Playwrite FR Moderne", "Segoe Script", "Apple Chancery", cursive;
  --f-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.5; font-weight: 400; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
b, strong { font-weight: 500; }
h1, h2, h3 { font-weight: 500; text-wrap: balance; margin: 0; }
button { font: inherit; }
a { color: var(--calc); }
:focus-visible { outline: 2px solid var(--calc); outline-offset: 2px; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-size: 15px; color: var(--muted); letter-spacing: .02em; }
.brand b { font-weight: 500; color: var(--ink); }
.top .back { margin-left: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 14px; cursor: pointer; color: var(--ink); font-size: 15px; }
.top .back:hover { border-color: var(--calc); }

/* Accueil */
.hero { padding-block: 34px 10px; display: grid; gap: 10px; }
.hero .eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--calc); }
.hero h1 { font-size: clamp(28px, 4.5vw, 40px); line-height: 1.15; }
.hero p { margin: 0; max-width: 62ch; color: var(--muted); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-block: 18px 8px; padding: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; }
.howto li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 13px; }
.domain { margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.domain:first-of-type { margin-top: 26px; }
.domain summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; flex-wrap: wrap; }
.domain summary::-webkit-details-marker { display: none; }
.domain summary::before { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--calc); border-bottom: 2px solid var(--calc); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.domain[open] summary::before { transform: rotate(45deg); }
.domain summary:hover .dn { color: var(--calc); }
.domain .dn { font-size: 19px; font-weight: 500; }
.domain .dm { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.domain .cards { padding: 0 12px 12px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 16px; color: var(--ink); min-width: 0; width: 100%; }
.card:hover { border-color: var(--calc); }
.card .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.card .p { flex: none; width: 150px; }
.card .go { flex: none; color: var(--calc); font-size: 18px; }
@media (max-width: 560px) { .card { flex-wrap: wrap; gap: 6px 12px; } .card .p { width: auto; flex: 1 1 100%; } .card .go { display: none; } }
.card .t { font-size: 17px; font-weight: 500; }
.card .d { font-size: 14px; color: var(--muted); }
.card .p { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

/* Page thème */
.theme-head { padding-block: 26px 6px; display: grid; gap: 6px; }
.theme-head .eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--calc); }
.theme-head h1 { font-size: clamp(25px, 4vw, 34px); line-height: 1.2; }
.theme-head p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tab { border: 1px solid var(--calc); background: var(--paper); color: var(--calc); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 16px; font-weight: 500; }
.tab:hover { background: var(--calc-soft); }
.tab.on { background: var(--calc); color: #fff; }
#view .toc { margin-top: 18px; }
.toc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.toc a { font-size: 14px; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; background: var(--paper); }
section.block { margin-top: 26px; scroll-margin-top: 70px; }
section.block > h2 { font-size: 21px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; }
section.block > h2 small { font-size: 14px; color: var(--muted); font-weight: 400; }

.rappel { background: var(--calc-soft); border-left: 3px solid var(--calc); padding: 14px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.rappel > div { min-width: 0; }
.rappel h3 { font-size: 16px; color: var(--calc); margin-bottom: 4px; }
.rappel p { margin: 0 0 6px; }
.rappel .att h3 { color: var(--red); }
.aide { margin-top: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 15px; overflow-x: auto; }
.aide table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.aide td, .aide th { border: 1px solid var(--line); padding: 2px 8px; text-align: center; font-weight: 400; }
.aide th { background: var(--bg); }

.exemple { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.exemple h3 { font-size: 17px; color: var(--calc); margin-bottom: 6px; }
.exemple .intro { margin: 0 0 8px; }
.steps { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line); }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--calc); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.step .m { overflow-x: auto; min-width: 0; }
.step .x { color: var(--muted); font-style: italic; font-size: 15px; }
.step .fig { overflow-x: auto; }
.step-ctrl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { border: 1px solid var(--calc); background: var(--paper); color: var(--calc); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 15px; font-weight: 500; }
.btn:hover { background: var(--calc-soft); }
.btn.solid { background: var(--calc); color: #fff; }
.btn.solid:hover { background: #1971C2; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.green { border-color: var(--green); color: var(--green); }
.btn.green:hover { background: var(--green-soft); }
.concl { margin-top: 10px; }
.piege { margin-top: 10px; background: var(--red-soft); border-left: 3px solid var(--red); padding: 8px 12px; font-size: 15px; }
.piege b { color: var(--red); font-weight: 500; }
.rep { display: inline-block; border: 1px solid var(--green); background: var(--green-soft); border-radius: 4px; padding: 0 6px; }

.exo { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
.exo-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pill { background: var(--sky); color: #fff; border-radius: 4px; padding: 1px 9px; font-weight: 500; font-size: 15px; }
.stars { letter-spacing: 1px; font-size: 16px; }
.regen { margin-left: auto; font-size: 14px; padding: 3px 12px; font-weight: 500; }
.regen + .comp { margin-left: 12px; }
.comp { margin-left: auto; font-family: var(--f-cursive); color: var(--sky); font-size: 14px; }
.exo-b { padding: 10px 14px 14px; display: grid; gap: 12px; }
.consigne { margin: 0; }
.qgroup { display: grid; gap: 8px; }
.qgroup > .qc { display: flex; gap: 8px; align-items: baseline; }
.num { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--ink); display: inline-grid; place-items: center; font-size: 13px; }
.item { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.item.ok { border-color: var(--green); }
.item .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.item .lab { color: var(--muted); flex: none; }
.item .q { min-width: 0; overflow-x: auto; }
.item .ans { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item input[type=text], .item input[type=number], .item select { font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--paper); color: var(--ink); }
.item input[type=text] { width: min(240px, 100%); }
.item input[type=number] { width: 70px; }
.keys { display: inline-flex; gap: 4px; }
.keys button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; min-width: 30px; padding: 2px 6px; cursor: pointer; font-size: 15px; color: var(--ink); }
.vf button.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
.fb { font-size: 15px; padding: 6px 10px; border-radius: 4px; }
.fb.good { background: var(--green-soft); color: var(--green); }
.fb.part { background: var(--amber-soft); color: var(--amber); }
.fb.bad { background: var(--red-soft); color: var(--red); }
.cor { background: var(--green-soft); border-left: 3px solid var(--green); padding: 8px 12px; font-size: 16px; overflow-x: auto; }
.cor .h { color: var(--green); font-weight: 500; margin-right: 4px; }
.hint { font-size: 14px; color: var(--muted); }
.dep { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gridfig { overflow-x: auto; }
.gridfig svg { display: block; max-width: none; touch-action: manipulation; }
.gridfig.click svg { cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
pre.code { background: #282923; color: #DEE3EB; font-family: var(--f-code); font-size: 15px; line-height: 1.45; padding: 10px 12px; border-radius: 6px; margin: 4px 0; overflow-x: auto; }
pre.code .k { color: #E06C75; }
pre.code .o { color: #C678DD; }
code.inl { font-family: var(--f-code); font-size: .88em; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
table.suivi { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 4px 0; }
table.suivi td, table.suivi th { border: 1px solid var(--line); padding: 3px 10px; text-align: center; font-weight: 400; }
table.suivi th { background: var(--bg); }
table.distrib { border-collapse: collapse; margin: 4px 0; }
table.distrib td { border: 1px solid #9AA6B2; min-width: 64px; padding: 4px 8px; text-align: center; }
table.distrib td.h { background: #E9EDF1; }
table.distrib td.x { background: #F7B5B5; }
.mult { margin: 4px 0 8px; overflow-x: auto; }
.mult table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.mult th { text-align: left; font-weight: 400; color: var(--muted); padding: 4px 12px 4px 0; white-space: nowrap; }
.mult td { padding: 4px 8px; text-align: center; min-width: 30px; }
.mult p { margin: 4px 0 0; font-size: 15px; }
.circ { display: inline-block; border: 2px solid var(--red); border-radius: 50%; padding: 2px 6px; color: var(--red); font-weight: 500; }
.divline { margin: 6px 0 0; color: var(--muted); }
.vecin { position: relative; display: inline-block; padding-top: 12px; }
.vecin input { width: 96px !important; text-align: center; letter-spacing: .12em; font-style: italic; text-transform: uppercase; }
.vecin::before, .vecin::after { content: ""; position: absolute; opacity: 0; transition: opacity .15s; }
.vecin::before { left: 14px; right: 16px; top: 6px; height: 1.6px; background: var(--ink); }
.vecin::after { right: 14px; top: 2px; width: 7px; height: 7px; border-top: 1.6px solid var(--ink); border-right: 1.6px solid var(--ink); transform: rotate(45deg); }
.vecin.filled::before, .vecin.filled::after { opacity: 1; }
.vecprev { min-width: 48px; font-size: 18px; }
.gridfig.finmode svg { outline: 2px dashed var(--green); outline-offset: 2px; }
.namebox { display: grid; gap: 8px; padding: 10px 12px; border: 1px dashed var(--calc); border-radius: 6px; background: var(--calc-soft); }
.expr { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; min-height: 54px; padding: 6px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.vecslot { position: relative; display: inline-block; padding-top: 14px; }
.item .vecslot input[type=text] { width: 40px; min-width: 0; height: 38px; font: inherit; font-size: 22px; font-style: italic; text-align: center; border: 1.5px solid var(--calc); border-radius: 5px; background: var(--paper); color: var(--ink); padding: 0; }
.vecslot::before, .vecslot::after { opacity: 0; transition: opacity .12s; }
.vecslot.on::before, .vecslot.on::after { opacity: 1; }
.vecslot::before { content: ""; position: absolute; left: 4px; right: 6px; top: 6px; height: 2px; background: var(--ink); }
.vecslot::after { content: ""; position: absolute; right: 4px; top: 2px; width: 8px; height: 8px; border-top: 2px solid var(--ink); border-right: 2px solid var(--ink); transform: rotate(45deg); }
.item .vecslot.wide input[type=text] { width: 56px; letter-spacing: .08em; font-style: italic; }
.vecslot.nul .zero { display: inline-grid; place-items: center; width: 40px; height: 40px; font-size: 22px; font-style: italic; border: 1.5px solid var(--calc); border-radius: 5px; background: var(--calc-soft); }
.vecexpr { width: fit-content; min-width: 120px; }
.powexpr { display: inline-flex; align-items: flex-start; padding: 12px 10px 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; width: fit-content; }
.item .pbase input[type=text] { width: 64px; height: 42px; font-size: 22px; text-align: center; border: 1.5px solid var(--calc); border-radius: 5px; padding: 0; }
.item .pexp input[type=text] { width: 44px; height: 28px; font-size: 16px; text-align: center; border: 1.5px solid var(--calc); border-radius: 4px; padding: 0; margin: -8px 0 0 3px; }
[data-expo] sup { font-size: .7em; }
.namebox .expr .op { font-size: 26px; line-height: 40px; color: var(--ink); padding: 0 2px; font-weight: 400; }
.item > button { justify-self: start; }
.sqbox { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.carres { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px 10px; font-variant-numeric: tabular-nums; font-size: 15px; }
.carres b { font-weight: 500; color: var(--calc); }
.illbox { background: #FFFDF2; border-left: 3px solid #FAB005; padding: 8px 12px; overflow-x: auto; }
.illbox p { margin: 4px 0; }
.illbox .fig { overflow-x: auto; margin: 4px 0 8px; }
.racill { margin-top: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.racill h3 { font-size: 17px; color: var(--calc); margin-bottom: 8px; }
.racfigs { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; }
.racfigs figure { margin: 0; max-width: 260px; min-width: 0; }
.racfigs figure.wide { max-width: 380px; }
.racfigs > figure > svg { display: block; max-width: 100%; height: auto; }
.racfigs figcaption { font-size: 15px; margin-top: 4px; }
.cor .calc { overflow-x: auto; margin: 2px 0; }
.cor .calc mjx-container[display="true"] { text-align: left !important; margin: 6px 0 6px 12px !important; }
.cons { font-family: var(--f-code); white-space: pre; background: #282923; color: #DEE3EB; padding: 1px 8px; border-radius: 4px; font-size: .92em; }
.navtheme { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
mjx-container[display="true"] { margin: 4px 0 !important; text-align: left !important; }
@media (prefers-reduced-motion: no-preference) { .step { animation: fade .25s ease-out; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }
@media (max-width: 520px) { body { font-size: 16px; } .comp { margin-left: 0; } }
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <span class="brand"><b>Remédiation DS1</b> · Seconde</span>
  <button class="back" id="back" hidden>← Tous les thèmes</button>
</div></header>
<main class="wrap" id="app"></main>

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: { '[+]': ['cancel', 'color'] } },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.min.js"></script>
<script>
'use strict';
/* Contenu repris des modules LaTeX des plans d'action (Feuilles de remédiation/Plans d'action DS1 - 2B/modules). */
const R = String.raw;
const THEMES = [];
const CXS = g => `{\\color{red}\\cancel{\\color{black}{${g}}}}`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function highlight(code) {
  return esc(code)
    .replace(/\b(def|return|print)\b/g, '<span class="k">$1</span>')
    .replace(/(\*\*|[+\-*/=])(?![^<]*>)/g, '<span class="o">$1</span>');
}
function codeBlock(code) { return `<pre class="code">${highlight(code)}</pre>`; }
// Liste des multiples de chaque dénominateur, le plus petit multiple commun entouré.
function multiplesTable(d1, d2) {
  const g = (a, b) => { while (b) { [a, b] = [b, a % b]; } return a; }, L = d1 / g(d1, d2) * d2;
  const row = d => { const out = []; for (let k = d; k <= L + 3 * d; k += d) out.push(k === L ? `<span class="circ">${k}</span>` : String(k)); out.push('…'); return `<tr><th>Multiples de ${d}</th><td>${out.join('</td><td>')}</td></tr>`; };
  return `<div class="mult"><table>${row(d1)}${row(d2)}</table><p>Le plus petit multiple commun, entouré, est ${L} : c’est le dénominateur commun.</p></div>`;
}


/* ===================== CALCULS NUMÉRIQUES ===================== */
THEMES.push({
  id: 'frac-simpl', dom: 'Calculs numériques', titre: 'Simplifier une fraction',
  resume: 'Obtenir une fraction irréductible, et ne pas oublier de simplifier à la fin d’un calcul.',
  rappel: [
    { t: 'Simplifier une fraction', h: R`<p>On divise le numérateur <em>et</em> le dénominateur par un même nombre : la valeur de la fraction ne change pas.</p><p>\(\dfrac{18}{24}=\dfrac{3\times6}{4\times6}=\dfrac{3}{4}\)</p>` },
    { t: 'Fraction irréductible', h: R`<p>Une fraction est irréductible lorsque le numérateur et le dénominateur n’ont plus de diviseur commun autre que \(1\).</p><p>Un résultat se donne toujours sous forme irréductible : on simplifie à la fin du calcul.</p>` }
  ],
  attention: R`<p>On ne simplifie que des <em>facteurs</em> (des multiplications), jamais des termes d’une somme : \(\dfrac{4+9}{4}\neq9\).</p><p>On divise, on ne soustrait pas : \(\dfrac{14}{21}\neq\dfrac{4}{11}\).</p>`,
  aide: R`Critères de divisibilité. Un nombre est divisible par <b>2</b> s’il est pair ; par <b>3</b> si la somme de ses chiffres est dans la table de 3 ; par <b>5</b> s’il se termine par 0 ou 5 ; par <b>9</b> si la somme de ses chiffres est dans la table de 9 ; par <b>10</b> s’il se termine par 0.`,
  exemples: [
    { titre: R`Rendre irréductible \(\dfrac{84}{126}\)`, steps: [
      { m: R`\dfrac{84}{126}=\dfrac{42\times2}{63\times2}=\dfrac{42}{63}`, x: R`84 et 126 sont pairs : on divise par 2.` },
      { m: R`\dfrac{42}{63}=\dfrac{14\times3}{21\times3}=\dfrac{14}{21}`, x: R`4 + 2 = 6 et 6 + 3 = 9 : les deux nombres sont divisibles par 3.` },

/* ===================== CALCUL LITTÉRAL ===================== */
const TABD = (a, b, c, d, ac, bc, ad, bd) => R`<table class="distrib"><tr><td class="x">×</td><td class="h">\(${a}\)</td><td class="h">\(${b}\)</td></tr><tr><td class="h">\(${c}\)</td><td>\(${ac}\)</td><td>\(${bc}\)</td></tr><tr><td class="h">\(${d}\)</td><td>\(${ad}\)</td><td>\(${bd}\)</td></tr></table>`;
// Tableau de simple distributivité : k en ligne, les deux termes de la parenthèse en colonnes
const TABS = (k, a, b, ka, kb) => R`<table class="distrib"><tr><td class="x">×</td><td class="h">\(${a}\)</td><td class="h">\(${b}\)</td></tr><tr><td class="h">\(${k}\)</td><td>\(${ka}\)</td><td>\(${kb}\)</td></tr></table>`;
const pz = t => String(t).startsWith('-') ? `(${t})` : t;
// « k multiplie a et b », puis le tableau, puis le résultat
const corrS = (k, a, b, ka, kb, res) => R`<p>\(${k}\) multiplie \(${a}\) et \(${b}\), qu’on peut écrire : \(${k}\) multiplie \(${a}\) et \(${k}\) multiplie \(${b}\).</p>${TABS(k, a, b, ka, kb)}<p>\(${pz(k)}\times ${pz(a)}+${pz(k)}\times ${pz(b)}=${res}\)</p>`;
const POLYHINT = 'Tape par exemple 3x^2+5x-2 (touche ² possible).';

/* Objets du calcul littéral, dans l'esprit de la balance de la remédiation « Équations » :
   cercle vert = 1, carré jaune = x, grand carré bleu = x² (la « génération des carrés »). */
const TL = { x2: { s: 46, fill: '#A5D8FF', txt: 'x²' }, x: { s: 28, fill: '#FFE066', txt: 'x' }, n: { s: 24, fill: '#8CE99A', txt: '1' } };
function tileSVG(fam, x, y, neg, crossed) {
  const t = TL[fam], stroke = neg ? '#E03131' : '#1D2733', sw = neg ? 2.2 : 1.2;
  const shape = fam === 'n' ? `<circle cx="${x + t.s / 2}" cy="${y + t.s / 2}" r="${t.s / 2}" fill="${t.fill}" stroke="${stroke}" stroke-width="${sw}"/>`
    : `<rect x="${x}" y="${y}" width="${t.s}" height="${t.s}" rx="2" fill="${t.fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  const label = `<text x="${x + t.s / 2}" y="${y + t.s / 2 + 5}" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-style="${fam === 'n' ? 'normal' : 'italic'}" font-size="${fam === 'x2' ? 17 : 14}" fill="#1D2733">${t.txt}</text>`;
  const cross = crossed ? `<path d="M${x - 2} ${y - 2}L${x + t.s + 2} ${y + t.s + 2}M${x - 2} ${y + t.s + 2}L${x + t.s + 2} ${y - 2}" stroke="#E03131" stroke-width="2.4"/>` : '';
  return shape + label + cross;
}
// Une expression écrite avec des objets : groups = [{ f, n, neg }]
function tilesRow(groups) {
  let x = 6, out = ''; const H = 56;
  groups.forEach((g, i) => {
    const minus = xx => `<text x="${xx}" y="${H / 2 + 11}" text-anchor="middle" font-size="36" font-weight="600" fill="#E03131" font-family="Source Sans 3, sans-serif">−</text>`;
    if (i > 0) { out += g.neg ? minus(x + 11) : `<text x="${x + 8}" y="${H / 2 + 7}" text-anchor="middle" font-size="22" fill="#1D2733" font-family="Source Sans 3, sans-serif">+</text>`; x += g.neg ? 26 : 22; }
    else if (g.neg) { out += minus(x + 9); x += 22; }
    for (let k = 0; k < g.n; k++) { const t = TL[g.f]; out += tileSVG(g.f, x, (H - t.s) / 2, g.neg); x += t.s + 4; }
    x += 4;
  });
  return `<svg style="vertical-align:middle" width="${x + 6}" height="${H}" viewBox="0 0 ${x + 6} ${H}" role="img" aria-label="expression représentée par des objets">${out}</svg>`;
}
// Boîtes de rangement par famille : objets « en plus » sur une ligne, objets rouges juste en dessous,
// alignés colonne par colonne ; cancel = nombre de paires (plus, moins) barrées.
function binsSVG(bins) {
  const gap = 12, top = 34; let out = '', x0 = 6, H = 0;
  const lay = bins.map(b => {
    const t = TL[b.f], step = t.s + 6, per = Math.max(4, Math.min(10, Math.max(b.pos, b.neg)));
    const rows = Math.ceil(b.pos / per) + Math.ceil(b.neg / per);
    return { b, t, step, per, W: 16 + per * step, Hc: top + rows * step + 30 };
  });
  H = Math.max(...lay.map(l => l.Hc));
  lay.forEach(({ b, t, step, per, W }) => {
    out += `<rect x="${x0}" y="6" width="${W}" height="${H}" rx="8" fill="#F5F7FA" stroke="#9AA6B2" stroke-dasharray="5 4"/>`;
    out += `<text x="${x0 + W / 2}" y="26" text-anchor="middle" font-size="14" fill="#5B6878" font-family="Source Sans 3, sans-serif">${b.title}</text>`;
    const posRows = Math.ceil(b.pos / per), X = k => x0 + 10 + (k % per) * step, Yp = k => top + 4 + Math.floor(k / per) * step, Yn = k => top + 4 + (posRows + Math.floor(k / per)) * step;
    for (let k = 0; k < b.pos; k++) out += tileSVG(b.f, X(k), Yp(k), false, false);
    for (let k = 0; k < b.neg; k++) out += tileSVG(b.f, X(k), Yn(k), true, false);
    // un seul trait par paire : il relie l'objet « en plus » et l'objet « en moins » qui s'annulent
    for (let k = 0; k < (b.cancel || 0); k++) out += `<path d="M${X(k) - 3} ${Yp(k) - 3}L${X(k) + t.s + 3} ${Yn(k) + t.s + 3}" stroke="#E03131" stroke-width="2.6" stroke-linecap="round"/>`;
    if (b.res !== undefined) out += `<text x="${x0 + W / 2}" y="${H - 2}" text-anchor="middle" font-size="16" fill="#2F9E44" font-family="Source Sans 3, sans-serif">${b.res}</text>`;
    x0 += W + gap;
  });
  const Wt = x0 - gap + 6;
  return `<svg width="${Wt}" height="${H + 12}" viewBox="0 0 ${Wt} ${H + 12}" role="img" aria-label="objets rangés par famille">${out}</svg>`;
}
// Figure d'aire : un rectangle de r × c carrés x² (côtés r·x et c·x)
function areaSVG(r, c, opt = {}) {
  const S = 46, L = 34, T = 26; let out = '';
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) out += tileSVG('x2', L + j * S, T + i * S, false);
  for (let j = 0; j < c; j++) out += `<text x="${L + j * S + S / 2}" y="${T - 8}" text-anchor="middle" font-style="italic" font-size="15" fill="#B35C00" font-family="Source Sans 3, sans-serif">x</text>`;
  for (let i = 0; i < r; i++) out += `<text x="${L - 12}" y="${T + i * S + S / 2 + 5}" text-anchor="middle" font-style="italic" font-size="15" fill="#B35C00" font-family="Source Sans 3, sans-serif">x</text>`;
  out += `<path d="M${L} ${T - 3}H${L + c * S}M${L - 3} ${T}V${T + r * S}" stroke="#B35C00" stroke-width="1.5"/>`;
  const W = L + c * S + 10, H = T + r * S + 8;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="rectangle découpé en carrés de côté x">${out}</svg>`;
}

  const gridlines = (x0, y0, n, m) => { let d = ''; for (let i = 0; i <= n; i++) d += `M${x0 + i * u} ${y0}V${y0 + m * u}`; for (let j = 0; j <= m; j++) d += `M${x0} ${y0 + j * u}H${x0 + n * u}`; return `<path d="${d}" stroke="${grid}" stroke-width="1"/>`; };
  const sq = (x0, y0, n, fill, lab) => `<rect x="${x0}" y="${y0}" width="${n * u}" height="${n * u}" fill="${fill}" stroke="${ink}" stroke-width="2"/>` + gridlines(x0, y0, n, n).replace(grid, '#A5B4C3') + T(x0 + n * u / 2, y0 + n * u / 2 + 5, lab, { s: 15 });
  // 1. carré d'aire 49
  const f1 = `<svg width="${7 * u + 50}" height="${7 * u + 46}" role="img" aria-label="carré d'aire 49 et de côté 7">${sq(30, 10, 7, fillA, 'aire 49')}
    ${T(30 + 3.5 * u, 7 * u + 32, 'côté 7', { c: blue })}${T(18, 10 + 3.5 * u + 5, '7', { c: blue })}</svg>`;
  // 2. carré d'aire 2, posé en biais sur les diagonales
  const o = 20, f2 = `<svg width="${4 * u + 2 * o}" height="${4 * u + 2 * o + 6}" role="img" aria-label="carré d'aire 2 et de côté racine de 2">${gridlines(o, o, 4, 4)}
    <polygon points="${o + 2 * u},${o + u} ${o + 3 * u},${o + 2 * u} ${o + 2 * u},${o + 3 * u} ${o + u},${o + 2 * u}" fill="${fillB}" stroke="${ink}" stroke-width="2"/>
    ${T(o + 2 * u, o + 2 * u + 5, 'aire 2', { s: 13 })}${T(o + 2.75 * u + 10, o + 2.75 * u + 14, '√2', { c: blue })}
    <rect x="${o}" y="${o}" width="${u}" height="${u}" fill="none" stroke="${blue}" stroke-dasharray="3 2"/>${T(o + u / 2, o - 4, '1 carreau', { s: 11, c: blue })}</svg>`;
  // 3. 9 + 16 = 25 : les côtés ne s'additionnent pas
  const f3 = `<svg width="${12 * u + 70}" height="${5 * u + 46}" role="img" aria-label="deux carrés d'aires 9 et 16, et le carré d'aire 25">${sq(10, 10 + 2 * u, 3, fillA, '9')}${sq(10 + 3 * u + 4, 10 + u, 4, fillB, '16')}
    ${T(10 + 1.5 * u, 5 * u + 30, '3', { c: blue })}${T(14 + 5 * u, 5 * u + 30, '4', { c: blue })}
    ${T(7 * u + 34, 10 + 2.5 * u + 6, '→', { s: 22 })}${sq(7 * u + 52, 10, 5, fillC, '25')}${T(7 * u + 52 + 2.5 * u, 5 * u + 30, 'côté 5', { c: blue })}</svg>`;
  // 4. carré de côté √5 (côté = diagonale d'un rectangle 2 × 1) : son aire vaut (√5)² = 5
  const p = 16, f4 = `<svg width="${4 * u + 2 * p}" height="${4 * u + 2 * p + 4}" role="img" aria-label="carré de côté racine de 5, d'aire 5">${gridlines(p, p, 4, 4)}
    <polygon points="${p + u},${p + 4 * u} ${p + 3 * u},${p + 3 * u} ${p + 4 * u},${p + u} ${p + 2 * u},${p + 2 * u}" fill="none"/>
    <polygon points="${p + u},${p + 3 * u} ${p + 3 * u},${p + 4 * u} ${p + 4 * u},${p + 2 * u} ${p + 2 * u},${p + u}" fill="${fillC}" stroke="${ink}" stroke-width="2"/>
    ${T(p + 2.5 * u, p + 2.5 * u + 5, 'aire 5', { s: 13 })}${T(p + 1.5 * u - 6, p + 3.6 * u + 12, '√5', { c: blue })}</svg>`;
  return `<div class="racill"><h3>Ce qu’est une racine carrée</h3>
    <div class="racfigs">
      <figure>${f1}<figcaption>\\(\\sqrt{49}=7\\) : c’est la longueur du côté d’un carré dont l’aire vaut 49.</figcaption></figure>
      <figure>${f2}<figcaption>Un carré d’aire 2 a pour côté \\(\\sqrt{2}\\approx1{,}41\\) : ce n’est pas un nombre entier.</figcaption></figure>
      <figure>${f4}<figcaption>Un carré de côté \\(\\sqrt{5}\\) a pour aire \\(\\left(\\sqrt{5}\\right)^{2}=5\\) : mettre une racine au carré, c’est retrouver l’aire.</figcaption></figure>
      <figure class="wide">${f3}<figcaption>Les aires 9 et 16 font 25, et le carré d’aire 25 a pour côté 5, pas \\(3+4=7\\). Donc \\(\\sqrt{9+16}\\neq\\sqrt{9}+\\sqrt{16}\\).</figcaption></figure>
    </div></div>`;
}

const CARRES_HTML = `<div class="carres">${[...Array(25)].map((_, i) => `<span><b>${i + 1}²</b> = ${(i + 1) ** 2}</span>`).join('')}</div>`;

// ---------- Illustration des réductions (objets du calcul littéral) ----------
const FAM = { x2: 'Famille des x²', x: 'Famille des x', n: 'Famille des nombres' };
const UNIT = { x2: 'x²', x: 'x', n: '' };
function illustrate(ill) {
  if (ill.type === 'sum') {
    const bins = ['x2', 'x', 'n'].map(f => {
      const pos = ill.terms.filter(t => t.f === f && !t.neg).reduce((s, t) => s + t.n, 0), neg = ill.terms.filter(t => t.f === f && t.neg).reduce((s, t) => s + t.n, 0);
      if (!pos && !neg) return null;
      const net = pos - neg, u = UNIT[f];
      const res = net === 0 ? 'tout s’annule : 0' : net > 0 ? `reste ${net}${u ? ' ' + u : ''}` : `${-net} en moins : −${-net}${u}`;
      return { f, title: FAM[f], pos, neg, cancel: Math.min(pos, neg), res };
    }).filter(Boolean);
    return `<div class="ill"><p>On traduit chaque terme en objets (en rouge : les objets « en moins ») :</p><div class="fig">${tilesRow(ill.terms)}</div>
      <p>On range par famille ; un objet rouge annule un objet de la même famille (un trait par paire) :</p><div class="fig">${binsSVG(bins)}</div></div>`;
  }
  if (ill.type === 'pack') {
    const groups = [...Array(ill.k)].map(() => ({ f: 'x', n: ill.m }));
    return `<div class="ill"><p>\\(${ill.m === 1 ? '' : ill.m}x\\times${ill.k}\\) : ${ill.k} paquets de ${ill.m} carré${ill.m > 1 ? 's' : ''} jaune${ill.m > 1 ? 's' : ''}.</p><div class="fig">${tilesRow(groups)}</div>
      <p>On compte : ${ill.k * ill.m} carrés jaunes, soit \\(${ill.k * ill.m}x\\). On reste dans la famille des \\(x\\).</p></div>`;
  }
  if (ill.type === 'area') {
    return `<div class="ill"><p>Un rectangle de côtés \\(${ill.c === 1 ? '' : ill.c}x\\) et \\(${ill.r === 1 ? '' : ill.r}x\\), découpé en carrés de côté \\(x\\) :</p><div class="fig">${areaSVG(ill.r, ill.c)}</div>
      <p>On compte ${ill.r * ill.c} carrés \\(x^{2}\\) : la multiplication fait changer de génération.${ill.sign ? ` ${ill.sign}` : ''}</p></div>`;
  }
  return '';
}

function wireItem(el, it, id) {
  const fb = $('.fb', el);
  const show = r => {
    fb.hidden = false; fb.className = 'fb ' + r.s; fb.textContent = r.m;
    if (r.s === 'good') { el.classList.add('ok'); done[id] = 1; saveDone(); }
  };
  const input = $('input[type=text]', el);
  el.querySelectorAll('[data-key]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key, s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    input.value = input.value.slice(0, s) + k + input.value.slice(e); input.focus(); input.setSelectionRange(s + k.length, s + k.length);
  }));
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('[data-check]', el).click(); } });
  el.querySelectorAll('[data-vf]').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('[data-vf]').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    show((b.dataset.vf === '1') === it.a ? { s: 'good', m: 'Bravo, c’est juste. Vérifie aussi ta justification dans la correction.' } : { s: 'bad', m: 'Ce n’est pas ça. Regarde la correction détaillée pour comprendre pourquoi.' });
  }));
  // Puissance : grande case pour la base, petite case surélevée pour l'exposant (bouton « Exposant »)
  let powexpr = null;
  if (it.t === 'pow') {
    powexpr = $('.powexpr', el);
    const base = $('.pbase input', el), go = ev => { if (ev.key === 'Enter') { ev.preventDefault(); $('[data-check]', el).click(); } };
    base.addEventListener('input', () => { base.value = base.value.replace(/[^0-9-]/g, ''); });
    base.addEventListener('keydown', go);
    const btn = $('[data-expo]', el);
    btn.addEventListener('mousedown', ev => ev.preventDefault());
    btn.addEventListener('click', () => {
      const ex = $('.pexp', powexpr);
      if (ex) { ex.remove(); base.focus(); return; }
      const sp = document.createElement('span'); sp.className = 'pexp';
      sp.innerHTML = '<input type="text" inputmode="numeric" maxlength="4" autocomplete="off" spellcheck="false" aria-label="exposant">';
      const inp = sp.firstChild;
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9−-]/g, '').replace('−', '-'); });
      inp.addEventListener('keydown', go);
      powexpr.appendChild(sp); inp.focus();
    });
  }
  // Cases de saisie pour écrire un vecteur : la flèche n'est pas dessinée d'avance,
  // l'élève la pose lui-même avec le bouton « Flèche » sur la case active.
  let vecexpr = null;
  const makeSlot = (box, max, onEnter, focus) => {
    const sl = document.createElement('span'); sl.className = 'vecslot' + (max > 1 ? ' wide' : '');
    sl.innerHTML = `<input type="text" maxlength="${max}" autocomplete="off" spellcheck="false" aria-label="${max > 1 ? 'lettres du vecteur' : 'lettre du vecteur'}">`;
    const inp = sl.firstChild;
    inp.addEventListener('input', () => {
      let v = inp.value.replace(/[^a-zA-Z0]/g, '');
      v = max > 1 ? v.slice(0, max).toUpperCase() : v.slice(-1).toLowerCase();
      inp.value = v;
    });
    inp.addEventListener('focus', () => { box._active = sl; });
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); onEnter(); } });
    box.appendChild(sl); box._active = sl; if (focus) inp.focus();
    return sl;
  };
  const wireArrow = (btn, box) => {
    btn.addEventListener('mousedown', ev => ev.preventDefault());
    btn.addEventListener('click', () => {
      const sl = box._active && box.contains(box._active) ? box._active : [...box.querySelectorAll('.vecslot')].pop();
      if (sl) { sl.classList.toggle('on'); const i = sl.querySelector('input'); if (i) i.focus(); }
    });
  };
  if (it.t === 'vec') {
    vecexpr = $('.vecexpr', el);
    makeSlot(vecexpr, 2, () => $('[data-check]', el).click(), false);
    wireArrow($('[data-arrow]', el), vecexpr);
  }
  // Tracé au clic : une chaîne de flèches mises bout à bout (orange), puis la flèche finale (verte)
  // que l'élève trace lui-même : bouton, puis clic sur l'origine et clic sur l'extrémité.
  let chain = [], fin = null, mode = 'chain', finStart = null;
  const gwrap = $('[data-grid]', el);
  if (gwrap) {
    const svg = $('svg', gwrap), fig = FIGS[it.g.fig];
    const pad = +svg.dataset.pad, u = +svg.dataset.u, h = +svg.dataset.h;
    const X = x => pad + x * u, Y = y => pad + (h - y) * u;
    const mko = svg.querySelector('marker[id$="o"]').id, mkg = svg.querySelector('marker[id$="g"]').id, layer = $('.student', svg);
    const seg = (o, p, col, mk, w) => `<line x1="${X(o[0])}" y1="${Y(o[1])}" x2="${X(p[0])}" y2="${Y(p[1])}" stroke="${col}" stroke-width="${w}" marker-end="url(#${mk})"/>`;
    const btnFin = $('[data-final]', el);
    const draw = () => {
      let s = chain.length ? `<circle cx="${X(chain[0][0])}" cy="${Y(chain[0][1])}" r="4.5" fill="#E8590C"/>` : '';
      for (let i = 1; i < chain.length; i++) s += seg(chain[i - 1], chain[i], '#E8590C', mko, 2.6);
      if (finStart && !fin) s += `<circle cx="${X(finStart[0])}" cy="${Y(finStart[1])}" r="5" fill="#2F9E44"/>`;
      if (fin) s += seg(fin[0], fin[1], '#2F9E44', mkg, 3.2);
      layer.innerHTML = s;
    };
    const setMode = m => {
      mode = m;
      if (btnFin) btnFin.textContent = m === 'fin1' ? 'Clique sur l’origine de la flèche finale' : m === 'fin2' ? 'Clique sur son extrémité' : 'Tracer la flèche finale';
      gwrap.classList.toggle('finmode', m !== 'chain');
    };
    const reset = () => { chain = []; fin = null; finStart = null; setMode('chain'); };
    reset();
    // point du quadrillage le plus proche du clic, quelle que soit la mise à l'échelle de la page
    const gridPoint = e => {
      const r = svg.getBoundingClientRect();
      const sx = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width), sy = (e.clientY - r.top) * (svg.viewBox.baseVal.height / r.height);
      const gx = Math.min(fig.w, Math.max(0, Math.round((sx - pad) / u))), gy = Math.min(h, Math.max(0, Math.round(h - (sy - pad) / u)));
      return [gx, gy];
    };
    svg.addEventListener('pointerup', e => {
      if (e.button > 0) return;
      e.preventDefault();
      const p = gridPoint(e);
      if (mode === 'fin1') { finStart = p; fin = null; setMode('fin2'); draw(); return; }
      if (mode === 'fin2') { if (p[0] === finStart[0] && p[1] === finStart[1]) return; fin = [finStart, p]; finStart = null; setMode('chain'); draw(); return; }
      const last = chain[chain.length - 1];
      if (last && last[0] === p[0] && last[1] === p[1]) return;
      chain.push(p); draw();
    });
    if (btnFin) btnFin.addEventListener('click', () => {
      if (mode !== 'chain') { finStart = null; setMode('chain'); draw(); return; }
      fin = null; finStart = null; setMode('fin1'); draw(); fb.hidden = true;
    });
    const clr = $('[data-clear]', el);
    if (clr) clr.addEventListener('click', () => { reset(); draw(); fb.hidden = true; });
  }
  // Nom du représentant : cases (une lettre chacune) et signes + ou −, flèches posées par l'élève
  const nameBtn = $('[data-name]', el);
  if (nameBtn) {
    const box = $('.namebox', el), expr = $('.expr', el), nfb = $('.namefb', el);
    const say = (s, m) => { nfb.hidden = false; nfb.className = 'namefb fb ' + s; nfb.textContent = m; };
    const mkOp = sign => { const op = document.createElement('span'); op.className = 'op'; op.dataset.sign = sign; op.textContent = sign === '-' ? '−' : '+'; return op; };
    const addVec = (focus = true) => { const sl = makeSlot(expr, 1, () => $('[data-namecheck]', el).click(), focus);
      sl.firstChild.addEventListener('keydown', ev => { if (ev.key === '+' || ev.key === '-') { ev.preventDefault(); addOp(ev.key); } }); nfb.hidden = true; };
    const addOp = sign => {
      const kids = [...expr.children];
      // « − » devant une première case encore vide : on écrit −v
      if (sign === '-' && kids.length === 1 && !kids[0].classList.contains('op') && !kids[0].firstChild.value) { expr.insertBefore(mkOp('-'), kids[0]); kids[0].firstChild.focus(); return; }
      expr.appendChild(mkOp(sign)); addVec();
    };
    nameBtn.addEventListener('click', () => { box.hidden = !box.hidden; if (!box.hidden && !expr.children.length) addVec(); });
    wireArrow($('[data-arrow]', box), expr);
    $('[data-addplus]', el).addEventListener('click', () => addOp('+'));
    $('[data-addminus]', el).addEventListener('click', () => addOp('-'));
    $('[data-back]', el).addEventListener('click', () => { if (expr.lastChild) expr.removeChild(expr.lastChild); if (expr.lastChild && expr.lastChild.classList.contains('op')) expr.removeChild(expr.lastChild); nfb.hidden = true; });
    $('[data-namecheck]', el).addEventListener('click', () => {
      const nodes = [...expr.children];
      if (!nodes.length) return say('part', 'Écris dans la case.');
      // lecture : [−] V (op V)*
      const terms = []; let sign = '+', expectV = true, okSyntax = true;
      nodes.forEach((n, i) => {
        if (n.classList.contains('op')) {
          if (!expectV) { sign = n.dataset.sign; expectV = true; }
          else if (i === 0 && n.dataset.sign === '-') sign = '-';
          else okSyntax = false;
        } else {
          if (!expectV) okSyntax = false;
          terms.push({ s: sign, l: n.firstChild.value || '', on: n.classList.contains('on') }); sign = '+'; expectV = false;
        }
      });
      if (expectV) okSyntax = false;
      if (terms.some(t => !t.l)) return say('part', 'Écris une lettre dans chaque case.');
      if (!okSyntax) return say('part', 'Il faut un signe entre deux vecteurs, et pas de signe à la fin.');
      const want = it.g.name.map(x => x.startsWith('-') ? '-' + x.slice(1) : '+' + x).sort();
      const got = terms.map(t => t.s + t.l).sort();
      const diff = want.some(x => x.startsWith('-'));
      if (got.join() !== want.join()) return say('bad', diff ? 'Ce n’est pas ce vecteur. Regarde les vecteurs que tu as mis bout à bout, et celui que tu as inversé (le signe −).' : `Ce n’est pas ce vecteur. Regarde quels vecteurs tu as mis bout à bout : il y en a ${want.length}.`);
      if (terms.some(t => !t.on)) return say('part', 'Les bonnes lettres, mais il manque des flèches : chaque vecteur s’écrit avec une flèche. Clique dans une case, puis sur « Flèche ».');
      say('good', `Bravo : c’est bien un représentant de ${diff ? 'ce vecteur' : want.length === 2 ? 'cette somme' : 'la somme des trois vecteurs'}.`);
    });
  }
  const chk = $('[data-check]', el);
  if (chk) chk.addEventListener('click', () => {
    if (it.t === 'free' || it.t === 'grid') {
      const on = it.g.on || 'ton point de départ';
      const same = (p, q) => p[0] === q[0] && p[1] === q[1];
      let a, b;
      if (fin) { [a, b] = fin; }
      else if (chain.length === 2) { [a, b] = chain; }
      else if (chain.length > 2) return show({ s: 'part', m: 'Il manque la flèche finale : clique sur « Tracer la flèche finale », puis sur son origine et sur son extrémité.' });
      else return show({ s: 'part', m: it.t === 'grid' ? `Clique d’abord sur l’origine ${on}, puis sur les points suivants.` : 'Clique d’abord sur un point de départ, puis sur les points suivants.' });
      if (it.t === 'grid' && !same(a, it.g.o)) return show({ s: 'bad', m: `La flèche finale doit partir de ${on}.` });
      const ok = it.t === 'grid' ? same(b, it.g.tgt) : b[0] - a[0] === it.g.tgt[0] && b[1] - a[1] === it.g.tgt[1];
      if (ok) return show({ s: 'good', m: 'Bravo, c’est juste : ta flèche finale représente bien le vecteur demandé.' });
      return show({ s: 'bad', m: it.g.hint || 'Ce n’est pas le bon vecteur. Enchaîne les déplacements un par un, puis trace la flèche finale du premier au dernier point.' });
    }
    if (it.t === 'dep') {
      const nx = $(`#${CSS.escape(id)}-x`, el).value, ny = $(`#${CSS.escape(id)}-y`, el).value;
      if (nx === '' || ny === '') return show({ s: 'part', m: 'Complète les deux nombres (écris 0 s’il n’y a pas de déplacement dans un sens).' });
      const dx = +nx * +$(`#${CSS.escape(id)}-xd`, el).value, dy = +ny * +$(`#${CSS.escape(id)}-yd`, el).value;
      if (dx === it.a[0] && dy === it.a[1]) return show(GOOD);
      if (Math.abs(dx) === Math.abs(it.a[0]) && Math.abs(dy) === Math.abs(it.a[1])) return show({ s: 'part', m: 'Les nombres de carreaux sont justes, mais vérifie les sens (droite ou gauche, haut ou bas).' });
      return show(BAD);
    }
    if (it.t === 'pow') {
      const b = $('.pbase input', powexpr).value.trim(), ex = $('.pexp input', powexpr);
      if (!b) return show({ s: 'part', m: 'Écris d’abord la base dans la case.' });
      if (ex && !ex.value.trim()) return show({ s: 'part', m: 'Écris l’exposant dans la petite case.' });
      const r = CHECK.pow(it, ex ? `${b}^(${ex.value.trim()})` : b);
      if (!ex && r.s !== 'good' && !isNaN(Number(b)) && Number(b) === it.a[0]) return show({ s: 'part', m: 'Il manque l’exposant : clique sur « Exposant » pour l’écrire.' });
      return show(r);
    }
    if (it.t === 'vec') {
      const sl = vecexpr.querySelector('.vecslot'), v = sl.querySelector('input').value;
      if (!v) return show({ s: 'part', m: 'Tape les lettres du vecteur dans la case.' });
      if (v !== '0' && v.length === 1) return show({ s: 'part', m: 'Un vecteur se nomme avec deux points : son origine puis son extrémité.' });
      const r = CHECK.vec(it, v);
      if (!sl.classList.contains('on')) return show(r.s === 'good' ? { s: 'part', m: 'Les bonnes lettres, mais il manque la flèche : un vecteur s’écrit avec une flèche. Clique sur « Flèche ».' } : r);
      return show(r);
    }
    const raw = input.value;
    if (!raw.trim()) return show({ s: 'part', m: 'Écris d’abord ta réponse.' });
    show(CHECK[it.t](it, raw));
  });
  const ib = $('[data-ill]', el);
  if (ib) ib.addEventListener('click', () => { const b = $('.illbox', el); b.hidden = !b.hidden; ib.textContent = b.hidden ? 'Avec l’illustration' : 'Masquer l’illustration'; if (!b.hidden) typeset(b); });
  const sq = $('[data-sq]', el);
  if (sq) sq.addEventListener('click', () => { const b = $('.sqbox', el); b.hidden = !b.hidden; sq.textContent = b.hidden ? 'Table des carrés' : 'Masquer la table'; });
  $('[data-cor]', el).addEventListener('click', e => {
    const c = $('.cor', el); c.hidden = !c.hidden;
    e.target.textContent = c.hidden ? 'Voir la correction détaillée' : 'Masquer la correction';
    if (!c.hidden) typeset(c);
  });
}

// ---------- Ordre d'affichage ----------
const ORDRE = ['frac-simpl', 'frac-ops', 'puiss', 'rac-base', 'rac-simpl', 'rac-den', 'frac-pb', 'sci'];
THEMES.sort((a, b) => {
  const ia = ORDRE.indexOf(a.id), ib = ORDRE.indexOf(b.id);
  return ia >= 0 && ib >= 0 ? ia - ib : 0;
});

// ---------- Pages ----------
const app = $('#app'), backBtn = $('#back');
const STAR = { 1: '<span style="color:var(--star-green)">★</span><span style="color:#C6CED6">☆☆</span>', 2: '<span style="color:var(--star-blue)">★★</span><span style="color:#C6CED6">☆</span>' };
// Un thème peut être découpé en parties (onglets) : chaque partie a son rappel, ses exemples et ses exercices.
const views = th => th.parts ? th.parts.map(p => Object.assign(p, { vid: `${th.id}-${p.id}` })) : [Object.assign(th, { vid: th.id })];
function itemIds(th) { const ids = []; views(th).forEach(v => v.exos.forEach((ex, i) => ex.groups.forEach((g, j) => g.items.forEach((it, k) => ids.push(`${v.vid}-${i}-${j}-${k}`))))); return ids; }
const currentPart = {};

const DOM_KEY = 'remed-ds1-2b-domaines';
let openDoms = [];
try { openDoms = JSON.parse(localStorage.getItem(DOM_KEY)) || []; } catch (e) { openDoms = []; }
function renderHome() {
  backBtn.hidden = true;
  const domains = [...new Set(THEMES.map(t => t.dom))];
  app.innerHTML = `
  <div class="hero">
    <span class="eyebrow">Après le devoir surveillé 1</span>
    <h1>Reprendre les notions, une à une</h1>
    <p>Choisis un thème. Chaque thème suit les mêmes étapes.</p>
  </div>
  <ol class="howto">
    <li>Je lis le rappel de cours.</li>
    <li>Je suis l’exemple étape par étape en entier. Je le refais sur mon cahier.</li>
    <li>Je fais les exercices sur mon cahier, puis je vérifie ma réponse.</li>
    <li>J’ouvre la correction détaillée si je me suis trompé·e.</li>
  </ol>
  ${domains.map(d => {
    const list = THEMES.filter(t => t.dom === d), ids = list.flatMap(itemIds), n = ids.filter(i => done[i]).length;
    return `<details class="domain" data-dom="${d}"${openDoms.includes(d) ? ' open' : ''}><summary><span class="dn">${d}</span><span class="dm">${list.length} thèmes · ${n} / ${ids.length} réussis</span></summary><div class="cards">${list.map(t => {
    const ids = itemIds(t), n = ids.filter(i => done[i]).length;
    return `<button type="button" class="card" data-go="${t.id}"><span class="txt"><span class="t">${t.titre}</span><span class="d">${t.resume}</span></span>
      <span class="p"><span class="bar"><i style="width:${ids.length ? 100 * n / ids.length : 0}%"></i></span>${n} / ${ids.length}</span><span class="go" aria-hidden="true">→</span></button>`;
  }).join('')}</div></details>`; }).join('')}`;
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  app.querySelectorAll('details.domain').forEach(dt => dt.addEventListener('toggle', () => {
    openDoms = [...app.querySelectorAll('details.domain[open]')].map(x => x.dataset.dom);
    try { localStorage.setItem(DOM_KEY, JSON.stringify(openDoms)); } catch (e) {}
  }));
  typeset(app);
  window.scrollTo(0, 0);
}

function exoBody(v, ex, a, fresh) {
  return `${ex.consigne ? `<div class="consigne">${ex.consigne}</div>` : ''}${ex.fig ? `<div class="gridfig">${drawGrid(FIGS[ex.fig])}</div>` : ''}
      ${ex.groups.map((g, b) => `<div class="qgroup">${g.q ? `<div class="qc">${g.n ? `<span class="num">${g.n}</span>` : ''}<span>${g.q}</span></div>` : ''}
        ${g.items.map((it, c) => itemHTML(it, `${v.vid}-${a}-${b}-${c}`, fresh)).join('')}</div>`).join('')}`;
}
function wireExo(v, a, box) {
  v.exos[a].groups.forEach((g, b) => g.items.forEach((it, c) => {
    const id = `${v.vid}-${a}-${b}-${c}`; wireItem(box.querySelector(`.item[data-id="${id}"]`), it, id);
  }));
}

// Rappel, exemples pas à pas et exercices d'une partie (ou du thème entier)
function viewHTML(v) {
  let exoN = 0;
  return `
  <nav class="toc"><a href="#" data-jump="rappel">Rappel</a><a href="#" data-jump="exemple">Exemple pas à pas</a><a href="#" data-jump="exercices">Exercices</a></nav>
  <section class="block" id="rappel"><h2>Rappel de cours</h2>
    <div class="rappel">${v.rappel.map(b => `<div><h3>${b.t}</h3>${b.h}</div>`).join('')}<div class="att"><h3>Attention !</h3>${v.attention}</div></div>
    ${v.aide ? `<div class="aide">${v.aide}</div>` : ''}
    ${v.illus ? racIllustration() : ''}
  </section>
  <section class="block" id="exemple"><h2>${v.exemples.length > 1 ? 'Exemples corrigés' : 'Exemple corrigé'} <small>étape par étape</small></h2>
    ${v.exemples.map((ex, k) => `<div class="exemple" data-ex="${k}"><h3>${ex.titre}</h3>${ex.intro ? `<p class="intro">${ex.intro}</p>` : ''}
      <ol class="steps"></ol>
      <div class="step-ctrl"><button type="button" class="btn solid" data-next>Étape suivante</button><button type="button" class="btn ghost" data-all>Tout afficher</button><button type="button" class="btn ghost" data-reset hidden>Recommencer</button></div>
      <div class="concl" hidden>${ex.concl || ''}${ex.piege ? `<div class="piege"><b>Erreur à éviter :</b> ${ex.piege}</div>` : ''}</div></div>`).join('')}
  </section>
  <section class="block" id="exercices"><h2>Exercices</h2>
    ${v.exos.map((ex, a) => `<div class="exo" data-exo="${a}"><div class="exo-h"><span class="pill">Exercice ${++exoN}</span><span class="stars">${STAR[ex.stars]}</span>${ex.gen ? '<button type="button" class="btn ghost regen" data-regen>↻ Nouvel énoncé</button>' : ''}<span class="comp">${ex.comp}</span></div>
      <div class="exo-b">${exoBody(v, ex, a)}</div></div>`).join('')}
  </section>`;
}
function wireView(v, root) {
  root.querySelectorAll('.exemple').forEach(box => {
    const ex = v.exemples[+box.dataset.ex], ol = $('.steps', box), concl = $('.concl', box);
    const bNext = $('[data-next]', box), bAll = $('[data-all]', box), bReset = $('[data-reset]', box);
    let k = 0;
    const add = () => {
      const st = ex.steps[k++], li = document.createElement('li'); li.className = 'step';
      li.innerHTML = `<span class="n">${k}</span><div>${st.svg ? `<div class="fig">${st.svg}</div>` : ''}${st.fig ? `<div class="fig">${drawGrid(FIGS[st.fig.base], st.fig, st.fig.u || 30)}</div>` : ''}${st.m ? `<div class="m">\\[${v.vid.startsWith('frac-') ? simpNotation(st.m).s : st.m}\\]</div>` : ''}${st.h ? `<div>${st.h}</div>` : ''}${st.x ? `<div class="x">${st.x}</div>` : ''}</div>`;
      ol.appendChild(li); typeset(li);
    };
    const sync = () => { const end = k >= ex.steps.length; bNext.hidden = end; bAll.hidden = end; bReset.hidden = !end; concl.hidden = !end; if (end) typeset(concl); };
    bNext.addEventListener('click', () => { add(); sync(); });
    bAll.addEventListener('click', () => { while (k < ex.steps.length) add(); sync(); });
    bReset.addEventListener('click', () => { ol.innerHTML = ''; k = 0; add(); sync(); });
    add(); sync();
  });
  v.exos.forEach((ex, a) => {
    const box = root.querySelector(`.exo[data-exo="${a}"]`);
    wireExo(v, a, box);
    const rb = $('[data-regen]', box);
    if (rb) rb.addEventListener('click', () => {
      const fresh = GEN[v.exos[a].gen]();
      if (!fresh) return;
      v.exos[a] = Object.assign({}, v.exos[a], fresh);
      const body = $('.exo-b', box);
      body.innerHTML = exoBody(v, v.exos[a], a, true);
      wireExo(v, a, box);
      typeset(body);
    });
  });
  root.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); root.querySelector('#' + a.dataset.jump).scrollIntoView({ behavior: 'smooth' }); }));
  typeset(root);
}

function renderTheme(th) {
  backBtn.hidden = false;
  const i = THEMES.indexOf(th), prev = THEMES[i - 1], next = THEMES[i + 1], vs = views(th);
  app.innerHTML = `
  <div class="theme-head">
    <span class="eyebrow">${th.dom}</span>
    <h1>${th.titre}</h1>
    <p>${th.resume}</p>
    ${th.parts ? `<div class="tabs" role="tablist">${th.parts.map(p => `<button type="button" role="tab" class="tab" data-part="${p.id}">${p.label}</button>`).join('')}</div>` : ''}
  </div>
  <div id="view"></div>
  <nav class="navtheme">${prev ? `<button type="button" class="btn ghost" data-go="${prev.id}">← ${prev.titre}</button>` : '<span></span>'}${next ? `<button type="button" class="btn ghost" data-go="${next.id}">${next.titre} →</button>` : ''}</nav>`;
  const box = $('#view');
  const show = pid => {
    const v = th.parts ? vs.find(p => p.id === pid) || vs[0] : vs[0];
    if (th.parts) {
      currentPart[th.id] = v.id;
      app.querySelectorAll('[data-part]').forEach(b => { const on = b.dataset.part === v.id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    }
    box.innerHTML = viewHTML(v);
    wireView(v, box);
  };
  app.querySelectorAll('[data-part]').forEach(b => b.addEventListener('click', () => { show(b.dataset.part); }));
  show(currentPart[th.id]);
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  typeset($('.theme-head', app)); typeset($('.navtheme', app));
  window.scrollTo(0, 0);
}

function route() {
  const id = location.hash.replace('#', '');
  const th = THEMES.find(t => t.id === id);
  th ? renderTheme(th) : renderHome();
}
backBtn.addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);
route();

</script>

</body>
</html>
