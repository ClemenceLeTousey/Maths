<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper:#f2f3ee; --surface:#ffffff; --ink:#20232b; --ink-soft:#565a66; --muted:#8b8f99;
    --accent:#2455b8; --accent-soft:#e4ecfb; --red:#b8342b; --line:#dce1ea; --rule-strong:#b9c2d1;
    --shadow:rgba(32,35,43,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:#121319; --surface:#1b1e26; --ink:#f1f2f6; --ink-soft:#c3c7d1; --muted:#8b909c;
      --accent:#7ea3ee; --accent-soft:#223252; --red:#e17a70; --line:#2b2f3a; --rule-strong:#3b4150;
      --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#121319; --surface:#1b1e26; --ink:#f1f2f6; --ink-soft:#c3c7d1; --muted:#8b909c;
    --accent:#7ea3ee; --accent-soft:#223252; --red:#e17a70; --line:#2b2f3a; --rule-strong:#3b4150;
    --shadow:rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--paper);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px;
    color: var(--ink); font-family: "Public Sans", system-ui, sans-serif;
  }
  form {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 1px 3px var(--shadow), 0 10px 30px -18px var(--shadow); padding: 26px 26px 22px;
  }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--ink-soft); font-size: 0.95rem; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 8px;
    border: 1.5px solid var(--rule-strong); background: var(--paper); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--surface);
  }
  .err { min-height: 1.3em; margin: 10px 0 0; color: var(--red); font-size: 0.9rem; }
</style>

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(pwd) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
    return new TextDecoder().decode(plain);
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    let html;
    try { html = await unlock(document.getElementById("pwd").value); }
    catch (x) { err.textContent = "Mot de passe incorrect."; return; }
    document.open(); document.write(html); document.close();
  });
</script>
