<style>
  :root {
    color-scheme: light;
    --paper:        #f2f3ee;
    --surface:      #ffffff;
    --ink:          #20232b;
    --ink-soft:     #565a66;
    --muted:        #8b8f99;
    --accent:       #2455b8;
    --accent-soft:  #e4ecfb;
    --orange:       #b5511f;
    --orange-soft:  #f7e6dc;
    --aqua:         #12805c;
    --aqua-soft:    #dcf1e9;
    --red:          #b8342b;
    --red-soft:     #fbeae8;
    --line:         #dce1ea;
    --rule-strong:  #b9c2d1;
    --shadow:       rgba(32, 35, 43, 0.10);
    /* couleurs de "palier" (QCM / question simple / automatisme final) */
    --qcm:      #2455b8;
    --question: #b5511f;
    --final:    #9c2b3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper:#121319; --surface:#1b1e26; --ink:#f1f2f6; --ink-soft:#c3c7d1; --muted:#8b909c;
      --accent:#7ea3ee; --accent-soft:#223252; --orange:#e08a5c; --orange-soft:#3a2a1e;
      --aqua:#4fc79a; --aqua-soft:#1c3229; --red:#e17a70; --red-soft:#3a2222;
      --line:#2b2f3a; --rule-strong:#3b4150; --shadow:rgba(0,0,0,0.35);
      --qcm:#7ea3ee; --question:#e08a5c; --final:#e17a70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:#121319; --surface:#1b1e26; --ink:#f1f2f6; --ink-soft:#c3c7d1; --muted:#8b909c;
    --accent:#7ea3ee; --accent-soft:#223252; --orange:#e08a5c; --orange-soft:#3a2a1e;
    --aqua:#4fc79a; --aqua-soft:#1c3229; --red:#e17a70; --red-soft:#3a2222;
    --line:#2b2f3a; --rule-strong:#3b4150; --shadow:rgba(0,0,0,0.35);
    --qcm:#7ea3ee; --question:#e08a5c; --final:#e17a70;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 120px;
  }

  h1, .display { font-family: "Fraunces", Georgia, serif; text-wrap: balance; }

  .site-header { width: 100%; max-width: 820px; margin-bottom: 22px; }
  .brand-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .brand-row h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 1.15rem + 1.4vw, 2.1rem); font-weight: 600; color: var(--ink); }
  .brand-row .subtitle { margin: 0; color: var(--ink-soft); font-size: 0.98rem; }

  .back-link {
    align-self: center;
    font-family: "Public Sans", sans-serif; font-size: 0.78rem; font-weight: 600;
    color: var(--ink); text-decoration: none;
    border: 1.5px solid var(--rule-strong); border-radius: 999px;
    padding: 7px 12px; white-space: nowrap;
  }
  .back-link:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .pages { width: 100%; max-width: 820px; }

  .page {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 1px 3px var(--shadow), 0 10px 30px -18px var(--shadow);
    padding: 34px 40px 34px 56px;
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }
  .page::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 34px; width: 1px;
    background: var(--red); opacity: 0.55;
  }

  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.76rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 6px 11px; border-radius: 999px;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .badge.obj-nombres { background: var(--accent-soft); color: var(--accent); }
  .badge.obj-nombres .dot { background: var(--accent); }
  .badge.obj-geometrie { background: var(--aqua-soft); color: var(--aqua); }
  .badge.obj-geometrie .dot { background: var(--aqua); }
  .badge.obj-complement { background: var(--orange-soft); color: var(--orange); }
  .badge.obj-complement .dot { background: var(--orange); }

  .page-meta { text-align: right; font-family: "Space Mono", monospace; color: var(--muted); }
  .page-meta .count { font-size: 1.05rem; color: var(--ink-soft); }
  .page-meta .jour { font-size: 0.72rem; margin-top: 4px; }

  .aim {
    margin: 16px 0 22px;
    padding: 10px 14px;
    border-left: 3px solid var(--rule-strong);
    color: var(--ink-soft);
    font-size: 0.92rem;
    font-style: italic;
    background: color-mix(in srgb, var(--surface) 60%, var(--paper));
  }
  .aim strong { font-style: normal; color: var(--ink); font-weight: 600; }

  .question {
    font-size: clamp(1.25rem, 1.05rem + 0.7vw, 1.55rem);
    font-weight: 500; line-height: 1.4; margin: 0 0 22px; color: var(--ink);
  }

  .teacher-note {
    margin: -10px 0 20px; padding: 8px 13px;
    border: 1.5px dashed var(--red); border-radius: 8px;
    color: var(--red); font-size: 0.82rem; background: var(--red-soft);
  }
  .teacher-note:empty { display: none; }
  .teacher-note strong { font-weight: 700; }

  .diagram { display: flex; justify-content: center; margin: 0 0 22px; flex-wrap: wrap; gap: 20px; }
  .diagram:empty { display: none; }
  .diagram svg { max-width: 100%; height: auto; }
  .diagram-point circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
  .diagram-point text { font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; fill: var(--ink); text-anchor: middle; }
  .diagram-grid line { stroke: var(--line); stroke-width: 1; }
  .diagram-vector line { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 5; }
  .diagram-vector polygon { fill: var(--accent); }
  .diagram-label { font-family: "Public Sans", sans-serif; font-size: 12px; fill: var(--ink-soft); }

  .reveal-only { opacity: 0; transition: opacity .3s; }
  .diagram.revealed .reveal-only { opacity: 1; }
  .diagram-point.correct-fill { fill: var(--aqua-soft); }
  .diagram-solved-line { stroke: var(--aqua); }
  .diagram-solved-arrow { fill: var(--aqua); }

  .code-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .code-col { flex: 1 1 220px; max-width: 320px; }
  .code-col .code-label {
    font-family: "Space Mono", monospace; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 6px;
  }
  .code {
    font-family: "Space Mono", monospace; font-size: 0.9rem; line-height: 1.6;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 15px; white-space: pre; color: var(--ink); overflow-x: auto;
  }
  .opt .code { background: transparent; border: none; padding: 0; font-size: 0.85rem; }

  .console-panel {
    background: #1e1e2e; border-radius: 8px; padding: 12px 16px;
    font-family: "Space Mono", monospace; font-size: 0.9rem; line-height: 1.8;
    color: #d8dce6; min-height: 90px;
  }
  .console-panel .prompt { color: #6fcf97; }
  .console-panel .result-svg { display: block; margin-top: 4px; }

  .ink-blot-svg {
    transition: opacity .35s ease, transform .35s ease;
  }
  .diagram.revealed .ink-blot-svg { opacity: 0; transform: scale(1.2); }

  .scratchblocks-holder {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 90px;
  }

  .stage-panel {
    background: linear-gradient(180deg, #eef1f7, #e2e6ef);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 54px 10px 14px; display: flex; align-items: flex-start; justify-content: center;
    min-height: 150px;
  }
  .tux-wrap { position: relative; display: inline-block; }
  .tux-img { width: 78px; height: auto; object-fit: contain; display: block; }
  .speech-bubble-svg { position: absolute; width: 128px; height: auto; left: 30px; top: -46px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
  .opt {
    border: 1.5px solid var(--rule-strong); border-radius: 8px; padding: 13px 16px;
    font-size: 1.1rem; cursor: pointer; background: var(--surface);
    transition: background .15s, border-color .15s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt .letter {
    display: inline-block; width: 24px; height: 24px; border-radius: 50%;
    background: var(--ink); color: var(--surface); text-align: center; line-height: 24px;
    font-family: "Space Mono", monospace; font-size: .82rem; margin-right: 9px; font-weight: 700;
  }
  .opt.correct { border-color: var(--aqua); background: var(--aqua-soft); }
  .opt.wrong { border-color: var(--red); background: var(--red-soft); opacity: .7; }

  .answer-zone { margin-top: auto; padding-top: 14px; }
  .answer-zone .label {
    font-family: "Space Mono", monospace; font-size: 0.78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .answer-line { height: 1px; background: var(--rule-strong); margin-bottom: 18px; }

  .answer-box {
    display: none; margin-top: 4px; padding: 14px 18px; border-radius: 8px;
    background: var(--orange-soft); border-left: 4px solid var(--orange);
  }
  .answer-box.shown { display: block; }
  .answer-box .content { font-size: 1.1rem; color: var(--ink); }

  .reveal-btn {
    align-self: flex-start; margin-top: 14px;
    font-family: "Public Sans", sans-serif; font-size: 0.85rem; font-weight: 600;
    border-radius: 999px; padding: 9px 18px; cursor: pointer;
    border: 1.5px solid var(--rule-strong); background: var(--surface); color: var(--ink);
  }
  .reveal-btn:hover { box-shadow: 0 2px 8px var(--shadow); }

  .worksheet-nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    pointer-events: none;
  }
  .worksheet-nav .inner {
    pointer-events: auto; display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 10px 8px 16px; box-shadow: 0 6px 20px var(--shadow);
  }
  .nav-dots { display: flex; gap: 6px; }
  .nav-dots button { width: 8px; height: 8px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: var(--line); }
  .nav-dots button.current { background: var(--accent); width: 18px; border-radius: 5px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px; border: none; background: none; cursor: pointer;
    font-family: "Public Sans", sans-serif; font-weight: 600; font-size: 0.85rem;
    color: var(--ink); padding: 7px 10px; border-radius: 999px;
  }
  .nav-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; background: none; color: var(--ink); }
  .nav-pos { font-family: "Space Mono", monospace; font-size: 0.78rem; color: var(--muted); min-width: 40px; text-align: center; }

  @media (max-width: 560px) {
    .page { padding: 26px 22px 26px 42px; }
    .page::before { left: 22px; }
    .options { grid-template-columns: 1fr; }
  }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .theme-toggle {
    flex: none; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--rule-strong); border-radius: 999px; background: var(--surface); color: var(--ink);
    font-size: 1.05rem; cursor: pointer; line-height: 1; padding: 0; text-decoration: none;
  }
  .theme-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }

  .katex .mord:not(.mathnormal):not(.mathit):not(.mathbf):not(.mathcal):not(.mathtt) {
    font-family: "Public Sans", system-ui, sans-serif;
  }
</style>
</head>

<script>
const QUESTIONS = [
  {
    theme: "obj-complement",
    objectif: "Algo · Lire un programme",
    aim: "Lire un petit programme (Python ou Scratch) et prévoir ce qu'il affiche, en suivant l'ordre des instructions.",

      <div class="code-row" style="margin-bottom:16px;">

b = 8
print(a + b)</pre>

mettre [a] à (6)
mettre [b] à (8)
dire (a + b)</pre>

                <rect x="6" y="4" width="118" height="46" rx="15" fill="#fff" stroke="#2a2016" stroke-width="2.5"/>

      { letter:"B", text:"$48$", correct:false },

  {

      <g class="diagram-point"><circle cx="220" cy="220" r="5"/><text x="220" y="204">A<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text></g>

      { letter:"D", text:"Le point A<sub>4</sub>", correct:false }
    ],
    explanation: "Le vecteur $\\overrightarrow{\\text{MN}}$ correspond à un déplacement de 3 carreaux vers la droite et 1 carreau vers le haut. Seul A<sub>3</sub> combine exactement ce déplacement depuis A : les trois autres points ne correspondent ni à la même direction, ni à la même longueur que $\\overrightarrow{\\text{MN}}$."
  },
  {
    theme: "obj-complement",
    objectif: "Algo · Lire un programme",
    aim: "Prévoir le résultat affiché par un programme utilisant une soustraction.",
    question: "Que va afficher ce programme ?",
    diagram: `<div class="code-row" style="max-width:520px;">
      <div class="code-col">
        <div class="code-label">Script Python</div>
        <pre class="code">a = 8
b = 6
print(a - b)</pre>
      </div>
      <div class="code-col">
        <div class="code-label">Console</div>
        <div class="console-panel">
          <div class="prompt">&gt;&gt;&gt; Script exécuté</div>
          <svg class="result-svg" viewBox="0 0 100 44" width="100" height="44" role="img" aria-label="Résultat affiché par la console">
            <text x="4" y="30" font-family="Space Mono, monospace" font-weight="700" font-size="22" fill="#ffffff">2</text>
            <path class="ink-blot-svg" d="M4,26 C0,12 20,0 40,8 C58,-2 88,10 84,26 C94,36 72,48 54,44 C36,50 2,44 4,26 Z" fill="#3f6be0"/>
            <circle class="ink-blot-svg" cx="90" cy="36" r="4" fill="#3f6be0"/>
          </svg>
        </div>
      </div>
    </div>`,
    explanation: "Le programme affiche $a-b=8-6=2$."
  },
  {
    theme: "obj-complement",
    objectif: "Translations",
    aim: "Comprendre qu'une translation déplace tous les points de la même façon (même direction, même sens, même longueur).",
    question: "Une translation transforme le point A en point B : ce déplacement correspond à 3 carreaux vers la droite et 2 carreaux vers le haut. On applique cette même translation à un point C. Dans quelle direction et de combien de carreaux C se déplace-t-il ?",
    teacherNote: "à retravailler : reformuler encore le vocabulaire si besoin, et envisager de faire tracer directement le schéma par les élèves sur le quadrillage prévu au verso (tableau de consignation des réponses), une fois celui-ci créé.",
    explanation: "Une translation déplace tous les points d'une figure de la même façon : C se déplace donc lui aussi de 3 carreaux vers la droite et 2 carreaux vers le haut, exactement comme A."
  },
  {
    objectif: "A1 · Comparer deux nombres",
    aim: "Comparer deux fractions positives en étudiant le signe de leur différence, comme automatisme final de la semaine sur ce type de comparaison.",
    question: "Comparer $A=\\dfrac{4}{5}$ et $B=\\dfrac{9}{7}$ en étudiant le signe de leur différence.",
    explanation: "$A-B=\\dfrac{4}{5}-\\dfrac{9}{7}=\\dfrac{28}{35}-\\dfrac{45}{35}=-\\dfrac{17}{35}$. Comme $-\\dfrac{17}{35}<0$, on a $A<B$."
  },
  {
    objectif: "A2 · Fractions",
    aim: "Comparer deux fractions en choisissant soi-même la méthode la plus efficace (comparaison à 1, réduction au même dénominateur, ou différence).",
    question: "Comparer $\\dfrac{6}{5}$ et $\\dfrac{5}{6}$.",
    explanation: "Trois méthodes possibles.<br>1. Comparaison à $1$ : $\\dfrac{6}{5}>1$ (numérateur $>$ dénominateur) et $\\dfrac{5}{6}<1$ (numérateur $<$ dénominateur), donc $\\dfrac{6}{5}>\\dfrac{5}{6}$.<br>2. Même dénominateur : $\\dfrac{6}{5}=\\dfrac{36}{30}$ et $\\dfrac{5}{6}=\\dfrac{25}{30}$ ; comme $36>25$, on a $\\dfrac{6}{5}>\\dfrac{5}{6}$.<br>3. Différence : $\\dfrac{6}{5}-\\dfrac{5}{6}=\\dfrac{36}{30}-\\dfrac{25}{30}=\\dfrac{11}{30}>0$, donc $\\dfrac{6}{5}>\\dfrac{5}{6}$."
  }
];

let current = 0;
let revealed = false;

const objectifBadge = document.getElementById("objectif-badge");
const objectifText = document.getElementById("objectif-text");
const aimText = document.getElementById("aim-text");
const qtext = document.getElementById("qtext");
const teacherNoteEl = document.getElementById("teacher-note");
const diagramEl = document.getElementById("diagram");
const optionsEl = document.getElementById("options");
const answerBox = document.getElementById("answer-box");
const answerContent = document.getElementById("answer-content");
const revealBtn = document.getElementById("reveal-btn");
const qnumDisplay = document.getElementById("qnum-display");
const navPos = document.getElementById("nav-pos");
const dotsWrap = document.getElementById("nav-dots");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");

QUESTIONS.forEach((_, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "Aller à la question " + (i + 1));
  b.addEventListener("click", () => { current = i; render(); });
  dotsWrap.appendChild(b);
});

function render(){
  revealed = false;
  const q = QUESTIONS[current];

  objectifText.textContent = q.objectif;
  objectifBadge.className = "badge " + (q.theme || "obj-nombres");
  aimText.textContent = q.aim;
  qtext.innerHTML = q.question;
  teacherNoteEl.innerHTML = q.teacherNote ? "<strong>Note (prof) :</strong> " + q.teacherNote : "";
  diagramEl.innerHTML = q.diagram || "";
  diagramEl.classList.remove("revealed");
  if (window.scratchblocks) {
    scratchblocks.renderMatching("#diagram pre.scratchblocks", { style: "scratch3", languages: ["fr"] });
  }

  optionsEl.innerHTML = "";
  if (q.options){
    q.options.forEach(opt => {
      const div = document.createElement("div");
      div.className = "opt";
      div.innerHTML = "<span class='letter'>" + opt.letter + "</span>" + opt.text;
      div.dataset.correct = opt.correct;
      div.addEventListener("click", reveal);
      optionsEl.appendChild(div);
    });
  }

  answerBox.classList.remove("shown");
  answerContent.innerHTML = q.explanation;
  revealBtn.style.display = "inline-block";
  revealBtn.textContent = "Voir la réponse";

  qnumDisplay.textContent = (current + 1) + " / " + QUESTIONS.length;
  navPos.textContent = (current + 1) + " / " + QUESTIONS.length;
  Array.prototype.slice.call(dotsWrap.children).forEach((d, i) => d.classList.toggle("current", i === current));
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === QUESTIONS.length - 1;

  renderMath();
}

function reveal(){
  if (revealed) return;
  revealed = true;
  answerBox.classList.add("shown");
  diagramEl.classList.add("revealed");
  const opts = optionsEl.querySelectorAll(".opt");
  opts.forEach(o => {
    if (o.dataset.correct === "true") o.classList.add("correct");
    else if (opts.length) o.classList.add("wrong");
  });
}

function renderMath(){
  renderMathInElement(document.getElementById("page"), {
    delimiters: [
      {left:"$$", right:"$$", display:true},
      {left:"$", right:"$", display:false}
    ]
  });
}

function goTo(i){
  current = Math.max(0, Math.min(QUESTIONS.length - 1, i));
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

revealBtn.addEventListener("click", reveal);
btnPrev.addEventListener("click", () => goTo(current - 1));
btnNext.addEventListener("click", () => goTo(current + 1));

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goTo(current + 1);
  else if (e.key === "ArrowLeft") goTo(current - 1);
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); }
});

render();
</script>

<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    function current() {
      var attr = document.documentElement.getAttribute("data-theme");
      if (attr === "light" || attr === "dark") return attr;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function updateIcon() { btn.textContent = current() === "dark" ? "☀️" : "🌙"; }
    updateIcon();
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("automatismes-theme", next); } catch (e) {}
      updateIcon();
    });
  })();
</script>
</body>
