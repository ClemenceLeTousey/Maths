<style>

* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* sinon display:grid (rappel, correction) l’emporte sur hidden */
html, body { margin: 0; background: var(--bg); color: var(--ink); }

.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }

.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }

.exnav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }

.pill.lesson { background: var(--calc); }

.comp { margin-left: auto; font-family: var(--f-cursive); color: var(--sky); font-size: 15px; }
.exo-b { padding: 12px 16px 16px; display: grid; gap: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--calc); background: var(--paper); color: var(--calc); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 15px; font-weight: 500; }

.rappel { background: var(--calc-soft); border-left: 3px solid var(--calc); padding: 14px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

h2.part { font-size: 19px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--calc); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.step .m { overflow-x: auto; min-width: 0; }
.step .m mjx-container[display="true"] { margin: 2px 0 !important; text-align: left !important; }
.step .x { color: var(--muted); font-size: 15px; }
.step .h { min-width: 0; overflow-x: auto; }

.step-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }

svg .arc { stroke: var(--red); fill: none; stroke-width: 2; }
svg .arch { fill: var(--red); }
svg .step-t { fill: var(--red); font: 600 13px var(--f-body); }
svg .big { stroke: var(--calc); fill: none; stroke-width: 2.5; }
svg .bigh { fill: var(--calc); }
svg .bigt { fill: var(--calc); font: 600 16px var(--f-body); }
svg .cnt { fill: var(--muted); font: 12px var(--f-body); }

.foot { margin-top: 18px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  body { font-size: 16px; }
  .comp { margin-left: 0; }
  .item .row .btn { margin-left: 0; }
}

/* Ajouts : listes déroulantes, repères (graphiques) */
.intro .fig, .part-block .fig { overflow-x: auto; margin-top: 6px; }
.ans select { font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.ans select.good { border-color: var(--green); background: var(--green-soft); }
.ans select.bad { border-color: var(--red); background: var(--red-soft); }
.plotbox { display: grid; gap: 6px; }
.plotbox .fig { overflow-x: auto; }
.plotbox svg { cursor: crosshair; touch-action: manipulation; }
.plotbox .hint { font-size: 14px; color: var(--muted); }
svg .g-grid { stroke: #DCE3EB; stroke-width: 1; }
svg .g-ax { stroke: var(--ink); stroke-width: 1.4; }
svg .g-t { fill: var(--muted); font: 12px var(--f-body); }
svg .g-n { fill: var(--ink); font: italic 15px var(--f-body); }
svg .mk-o { stroke: var(--calc); stroke-width: 2.2; fill: #fff; }
svg .mk-x { stroke: var(--red); stroke-width: 2.6; stroke-linecap: round; }
svg .mk-p { fill: var(--calc); }
svg .mk-good { fill: var(--green); }
svg .mk-bad { fill: var(--red); }
svg .mk-ghost { fill: none; stroke: var(--green); stroke-width: 2; stroke-dasharray: 3 3; }
svg .g-arrow { stroke: var(--obj); stroke-width: 2; fill: none; }
svg .g-arrowt { fill: var(--obj); font: 600 13px var(--f-body); }
svg .g-line { stroke: var(--calc); stroke-width: 1.2; stroke-dasharray: 6 5; opacity: .6; }
</style>

<script>
window.MathJax = {

<script>
<script>
'use strict';
const R = String.raw;

/* =====================================================================
   Outils
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const round2 = x => Math.round(x * 100) / 100;
// Nombre en TeX (virgule décimale) ; entre parenthèses s'il est négatif ; avec son signe
const tn = x => { x = round2(x); if (Object.is(x, -0)) x = 0; return (x < 0 ? '-' : '') + String(Math.abs(x)).replace('.', '{,}'); };
const tp = x => (round2(x) < 0 ? '(' + tn(x) + ')' : tn(x));
const tpl = x => (round2(x) < 0 ? '-' + tn(-x) : '+' + tn(x));
// « 25n », « -3n », « n », « -n » (coefficient seul, sans signe + devant)
const kn = r => { r = round2(r); return r === 1 ? 'n' : r === -1 ? '-n' : tn(r) + 'n'; };
// « + 25n », « − 3n », « + n »
const coefN = r => { const a = Math.abs(round2(r)); return (round2(r) < 0 ? '-' : '+') + (a === 1 ? '' : tn(a)) + 'n'; };
// Nombre en texte (pour les schémas SVG)
const fmt = x => { x = round2(x); if (Object.is(x, -0)) x = 0; return (x < 0 ? '−' : '') + String(Math.abs(x)).replace('.', ','); };
function parse(s) {
  s = String(s).trim().replace(/\s/g, '').replace(',', '.').replace(/[−–]/g, '-');
  if (s === '' || !/^[-+]?\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}
const SENS = ['croissante', 'décroissante', 'constante'];
const sensOf = r => (r > 0 ? 'croissante' : r < 0 ? 'décroissante' : 'constante');
const signeTxt = r => (r > 0 ? 'positive' : r < 0 ? 'négative' : 'nulle');
const sensConcl = (s, r) => r === 0
  ? R`\(${s}\) est constante car sa raison est nulle.`
  : R`\(${s}\) est ${sensOf(r)} car sa raison \(${tn(r)}\) est ${signeTxt(r)}.`;

/* Schéma de flèches (comme dans la page « Formule explicite ») : de s(p) à s(q). */
function chain(s, p, n, r, start, opts) {
  opts = opts || {};
  const k = n - p, step = 74, L = 44, W = L * 2 + k * step, H = start === null ? 150 : 172;
  const yLab = 80, yVal = 104, yBig = start === null ? 96 : 118;
  const X = i => L + i * step;
  let g = '';
  for (let i = 0; i <= k; i++) {
    g += '<text class="lab" x="' + X(i) + '" y="' + yLab + '" text-anchor="middle"><tspan font-style="italic">' + s + '</tspan>(' + (p + i) + ')</text>';
    if (start !== null) g += '<text class="val" x="' + X(i) + '" y="' + yVal + '" text-anchor="middle">' + fmt(start + i * r) + '</text>';
  }
  const rTxt = opts.rlabel ? opts.rlabel : (r < 0 ? fmt(r) : '+' + fmt(r));
  for (let i = 0; i < k; i++) {
    const a = X(i) + 12, b = X(i + 1) - 12, mid = (a + b) / 2;
    g += '<path class="arc" d="M' + a + ' 62 Q' + mid + ' 26 ' + b + ' 62"/>';
    g += '<path class="arch" d="M' + b + ' 63 l-8 -4 l3 9 z"/>';
    g += '<text class="step-t" x="' + mid + '" y="34" text-anchor="middle">' + rTxt + '</text>';
  }
  if (opts.big !== false) {
    const x0 = X(0), x1 = X(k), depth = yBig + 34;
    g += '<path class="big" d="M' + x0 + ' ' + yBig + ' Q' + ((x0 + x1) / 2) + ' ' + (depth + 18) + ' ' + x1 + ' ' + yBig + '"/>';
    g += '<path class="bigh" d="M' + x1 + ' ' + yBig + ' l-12 4 l8 7 z"/>';
    g += '<text class="bigt" x="' + ((x0 + x1) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + (opts.big || '') + '</text>';
  }
  const h = opts.big === false ? 112 : H;
  return '<svg viewBox="0 0 ' + W + ' ' + h + '" width="' + W + '" role="img" aria-label="Schéma de flèches">' + g + '</svg>';
}

/* =====================================================================
   Repère : rangs n en abscisse, termes en ordonnée, quadrillage d'unité 1.
   o = { xmax, ymin, ymax, ylab, series: [{ pts: [[x, y], …], mark: 'o' | 'x' | 'p' }], extra(G) }
   ===================================================================== */
function geom(o) {
  const N = o.xmax, y0 = o.ymin, y1 = o.ymax, ux = o.ux || 52;
  const uy = o.uy || Math.max(16, Math.min(26, 290 / (y1 - y0)));
  const L = 40, T = 22, W = L + N * ux + 44, H = T + (y1 - y0) * uy + 30;
  return { N, y0, y1, ux, uy, L, T, W, H, X: x => L + x * ux, Y: y => T + (y1 - y) * uy };
}
const mark = (G, x, y, m) => {
  const cx = G.X(x), cy = G.Y(y);
  if (m === 'x') return '<path class="mk-x" d="M' + (cx - 5) + ' ' + (cy - 5) + ' l10 10 M' + (cx - 5) + ' ' + (cy + 5) + ' l10 -10"/>';
  if (m === 'o') return '<circle class="mk-o" cx="' + cx + '" cy="' + cy + '" r="5"/>';
  if (m === 'ghost') return '<circle class="mk-ghost" cx="' + cx + '" cy="' + cy + '" r="8"/>';
  return '<circle class="mk-' + (m === 'p' ? 'p' : m) + '" cx="' + cx + '" cy="' + cy + '" r="5.5"/>';
};
function axes(G, o) {
  let g = '';
  const ls = o.ylstep || (G.y1 - G.y0 > 14 ? 2 : 1);
  for (let x = 0; x <= G.N; x++) {
    g += '<line class="g-grid" x1="' + G.X(x) + '" y1="' + G.Y(G.y1) + '" x2="' + G.X(x) + '" y2="' + G.Y(G.y0) + '"/>';
  }
  for (let y = G.y0; y <= G.y1; y++) {
    g += '<line class="g-grid" x1="' + G.X(0) + '" y1="' + G.Y(y) + '" x2="' + G.X(G.N) + '" y2="' + G.Y(y) + '"/>';
    if ((y - G.y0) % ls === 0 || y === 0) g += '<text class="g-t" x="' + (G.L - 7) + '" y="' + (G.Y(y) + 4) + '" text-anchor="end">' + fmt(y) + '</text>';
  }
  const yAx = G.y0 <= 0 && G.y1 >= 0 ? 0 : G.y0;
  for (let x = 0; x <= G.N; x++) g += '<text class="g-t" x="' + G.X(x) + '" y="' + (G.Y(yAx) + 16) + '" text-anchor="middle">' + x + '</text>';
  const xe = G.X(G.N) + 22, yb = G.Y(yAx);
  g += '<line class="g-ax" x1="' + G.X(0) + '" y1="' + yb + '" x2="' + xe + '" y2="' + yb + '"/><path d="M' + (xe + 2) + ' ' + yb + ' l-8 -4 v8 z" fill="currentColor"/>';
  g += '<text class="g-n" x="' + (xe + 6) + '" y="' + (yb + 16) + '">n</text>';
  const yt = G.Y(G.y1) - 14;
  g += '<line class="g-ax" x1="' + G.X(0) + '" y1="' + G.Y(G.y0) + '" x2="' + G.X(0) + '" y2="' + yt + '"/><path d="M' + G.X(0) + ' ' + (yt - 2) + ' l-4 8 h8 z" fill="currentColor"/>';
  if (o.ylab) g += '<text class="g-n" x="' + (G.X(0) + 8) + '" y="' + (yt + 6) + '">' + o.ylab + '</text>';
  return g;
}
function graph(o) {
  const G = geom(o);
  let g = axes(G, o);
  if (o.extra) g += o.extra(G);
  (o.series || []).forEach(sr => sr.pts.forEach(([x, y]) => { g += mark(G, x, y, sr.mark); }));
  return '<svg viewBox="0 0 ' + G.W + ' ' + G.H + '" width="' + G.W + '" style="color:var(--ink)" role="img" aria-label="Repère">' + g + '</svg>';
}
// Flèche « on monte / on descend de r » entre deux points consécutifs
const stepArrow = (x, y, r) => G => {
  const a = G.X(x), b = G.X(x + 1), ya = G.Y(y), yb = G.Y(y + r);
  return '<path class="g-arrow" d="M' + a + ' ' + ya + ' H' + b + ' V' + (yb + (r > 0 ? 7 : -7)) + '"/>' +
    '<path d="M' + b + ' ' + yb + ' l-4 ' + (r > 0 ? 8 : -8) + ' h8 z" fill="var(--obj)"/>' +
    '<text class="g-arrowt" x="' + (b + 6) + '" y="' + ((ya + yb) / 2 + 4) + '">' + (r > 0 ? '+' : '') + fmt(r) + '</text>';
};
const pts = (u0, r, N) => Array.from({ length: N + 1 }, (_, n) => [n, round2(u0 + n * r)]);

/* =====================================================================
   Questions types
   Une question : { l, q, answers: [{label, value, unit} | {label, choices, value}], plot, steps: [{x, e, h, svg}], res, piege }
   ===================================================================== */
const given = (s, u0, r) => R`La suite \(${s}\) est arithmétique de premier terme \(${s}(0)=${tn(u0)}\) et de raison \(r=${tn(r)}\).`;
const sensAns = (s, r) => ({ label: R`\(${s}\) est`, choices: SENS, value: sensOf(r) });

// Exercice 1 : tableau de valeurs
function tableItem(l, s, u0, r, N) {
  const vals = pts(u0, r, N);
  return {
    l, q: R`Calculer les termes \(${s}(1)\) à \(${s}(${N})\).`,
    answers: vals.slice(1).map(([n, v]) => ({ label: R`\(${s}(${n})=\)`, value: v })),
    steps: [
      { x: R`\(${s}\) est arithmétique de raison \(${tn(r)}\) : on passe d'un terme au suivant en ajoutant \(${tn(r)}\).` },
      { svg: chain(s, 0, N, r, u0, { big: false }) },
      { e: R`${s}(1)=${s}(0)${tpl(r)}=${tn(u0)}${tpl(r)}=${tn(u0 + r)}`, x: 'Par exemple, pour le premier calcul.' }
    ],
    res: vals.slice(1).map(([n, v]) => R`${s}(${n})=${tn(v)}`).join(R`\quad `), piege: null
  };
}
// Exercice 1 : placer les points
function plotItem(l, s, u0, r, N, ymax) {
  const P = pts(u0, r, N);
  return {
    l, q: R`Représenter graphiquement les termes \(${s}(0)\) à \(${s}(${N})\) dans le repère.`,
    answers: [],
    plot: { xmax: N, ymin: 0, ymax, ylab: s + '(n)', expected: P },
    steps: [
      { x: R`Chaque terme donne un point : en abscisse le rang \(n\), en ordonnée le terme \(${s}(n)\).` },
      { h: 'Points à placer : ' + P.map(([n, v]) => R`\((${n}\,;${tn(v)})\)`).join(', ') + '.' },
      { svg: graph({ xmax: N, ymin: 0, ymax, ylab: s + '(n)', series: [{ pts: P, mark: 'p' }] }),
        x: R`Les points sont alignés : c'est normal, la suite est arithmétique (croissance linéaire).` }
    ],
    res: R`\text{points alignés}`,
    piege: R`on ne relie pas les points : une suite n'est définie que pour des rangs entiers.`
  };
}

/* =====================================================================
   Étapes de la page
   ===================================================================== */
const S1 = '<span style="color:var(--star-green)">★</span><span style="color:#C5CCD3">☆☆</span>';

const $ = (s, el = document) => el.querySelector(s);
const app = $('#app'), nav = $('#exnav');
function typeset(el) {
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    MathJax.startup.promise.then(() => MathJax.typesetPromise([el])).catch(() => {});
  }
}

function stepHTML(st, k) {
  let inner = '';
  if (st.svg) inner += `<div class="fig">${st.svg}</div>`;
  if (st.e) inner += `<div class="m">\\[${st.e}\\]</div>`;
  if (st.h) inner += `<div class="h">${st.h}</div>`;
  if (st.x) inner += `<div class="x">${st.x}</div>`;
  return `<span class="n">${k}</span><div>${inner}</div>`;
}
const stepsBlock = (concl, piege) => `<ol class="steps"></ol>
  <div class="step-ctrl"><button type="button" class="btn solid sm" data-next>Étape suivante</button><button type="button" class="btn ghost sm" data-all>Tout afficher</button><button type="button" class="btn ghost sm" data-reset hidden>Recommencer</button></div>
  <div class="end" hidden><div class="concl">${concl}</div>${piege ? `<div class="piege">${piege}</div>` : ''}</div>`;

function wireSteps(root, steps) {
  const ol = $('.steps', root), end = $('.end', root);
  const bN = $('[data-next]', root), bA = $('[data-all]', root), bR = $('[data-reset]', root);
  let k = 0;
  const add = () => { const li = document.createElement('li'); li.className = 'step'; li.innerHTML = stepHTML(steps[k], k + 1); k++; ol.appendChild(li); typeset(li); };
  const sync = () => { const fin = k >= steps.length; bN.hidden = fin; bA.hidden = fin; bR.hidden = !fin; end.hidden = !fin; if (fin) typeset(end); };
  bN.addEventListener('click', () => { add(); sync(); });
  bA.addEventListener('click', () => { while (k < steps.length) add(); sync(); });
  bR.addEventListener('click', () => { ol.innerHTML = ''; k = 0; add(); sync(); });
  return () => { if (k === 0) { add(); sync(); } };
}

function fieldHTML(a, id) {
  const ctl = a.choices
    ? `<select id="${id}"><option value="">…</option>${a.choices.map(c => `<option>${c}</option>`).join('')}</select>`
    : `<input type="text" id="${id}" inputmode="decimal" autocomplete="off" spellcheck="false">`;
  return `<label class="ans" for="${id}"><span>${a.label}</span>${ctl}${a.unit ? `<span>${a.unit}</span>` : ''}</label>`;
}
function itemHTML(it, id) {
  const plot = it.plot ? `<div class="plotbox"><div class="fig" data-plot></div><p class="hint">Clique sur le quadrillage pour placer un point ; clique à nouveau dessus pour l'enlever.</p></div>` : '';
  return `<div class="item" data-id="${id}">
    <div class="row"><span class="q">${it.l ? `<b>${it.l}</b> ` : ''}${it.q}</span><button type="button" class="btn sm" data-open>Correction détaillée</button></div>
    ${plot}
    <div class="ansrow">${it.answers.map((a, i) => fieldHTML(a, `${id}-${i}`)).join('')}
      ${it.plot ? '<button type="button" class="btn ghost sm" data-clear>Effacer</button>' : ''}
      <button type="button" class="btn solid sm" data-check>Vérifier</button><span class="fb" aria-live="polite"></span></div>
    <div class="corr" hidden>${stepsBlock(`Résultat : \\(${it.res}\\)`, it.piege ? `<b>Erreur à éviter :</b> ${it.piege}` : '')}</div>
  </div>`;
}

// Repère cliquable : placed[n] = ordonnée choisie pour le rang n
function wirePlot(el, P) {
  const box = $('[data-plot]', el), G = geom(P), placed = {};
  let marks = null;
  const draw = status => {
    let g = '';
    Object.keys(placed).forEach(n => {
      const cls = status ? (status[n] ? 'good' : 'bad') : 'p';
      g += mark(G, Number(n), placed[n], cls);
    });
    if (status && status.ghost) status.ghost.forEach(([n, v]) => { g += mark(G, n, v, 'ghost'); });
    marks.innerHTML = g;
  };
  box.innerHTML = `<svg viewBox="0 0 ${G.W} ${G.H}" width="${G.W}" style="color:var(--ink)" role="img" aria-label="Repère à compléter">${axes(G, P)}<g data-marks></g><rect x="0" y="0" width="${G.W}" height="${G.H}" fill="transparent"/></svg>`;
  const svg = $('svg', box);
  marks = $('[data-marks]', svg);
  svg.addEventListener('click', e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const n = Math.round((p.x - G.L) / G.ux), y = Math.round(G.y1 - (p.y - G.T) / G.uy);
    if (n < 0 || n > G.N || y < G.y0 || y > G.y1) return;
    if (placed[n] === y) delete placed[n]; else placed[n] = y;
    draw(null);
  });
  return {
    clear: () => { Object.keys(placed).forEach(k => delete placed[k]); draw(null); },
    check: () => {
      const status = {}; let good = 0;
      P.expected.forEach(([n, v]) => { if (placed[n] === v) { status[n] = true; good++; } });
      Object.keys(placed).forEach(n => { if (!status[n]) status[n] = false; });
      const all = good === P.expected.length;
      draw(status);
      return { all, good, total: P.expected.length };
    }
  };
}

function wireItem(el, it) {
  const corr = $('.corr', el), start = wireSteps(corr, it.steps), fb = $('.fb', el);
  const plot = it.plot ? wirePlot(el, it.plot) : null;
  $('[data-open]', el).addEventListener('click', e => {
    const open = corr.hidden;
    corr.hidden = !open; el.classList.toggle('open', open);
    e.currentTarget.textContent = open ? 'Masquer la correction' : 'Correction détaillée';
    if (open) start();
  });
  if (plot) $('[data-clear]', el).addEventListener('click', () => { plot.clear(); fb.textContent = ''; });
  const check = () => {
    let good = 0, total = it.answers.length, msg = null;
    it.answers.forEach((a, i) => {
      const inp = $(`#${el.dataset.id}-${i}`, el);
      const ok = a.choices ? inp.value === a.value
        : (v => !Number.isNaN(v) && Math.abs(round2(v) - round2(a.value)) < 0.006)(parse(inp.value));
      inp.classList.toggle('good', ok); inp.classList.toggle('bad', !ok); if (ok) good++;
    });
    if (plot) {
      const res = plot.check(); good += res.good; total += res.total;
      if (!res.all) msg = `✗ ${res.good} point${res.good > 1 ? 's' : ''} juste${res.good > 1 ? 's' : ''} sur ${res.total} : les points rouges sont mal placés.`;
    }
    const all = good === total;
    fb.textContent = all ? '✓ Juste !' : (msg || '✗ Pas encore : relis le rappel, ou ouvre la correction détaillée.');
    fb.className = 'fb ' + (all ? 'good' : 'bad');
  };
  $('[data-check]', el).addEventListener('click', check);
  el.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
}

function renderParts(box, page) {
  const parts = page.build();
  box.innerHTML = parts.map((p, pi) => `<div class="part-block">
      ${p.title || p.intro ? `<div class="intro">${p.title ? `<b>${p.title}</b> ` : ''}${p.intro || ''}</div>` : ''}
      <div class="items">${p.items.map((it, ii) => itemHTML(it, `${page.id}p${pi}i${ii}`)).join('')}</div></div>`).join('');
  parts.forEach((p, pi) => p.items.forEach((it, ii) => wireItem($(`[data-id="${page.id}p${pi}i${ii}"]`, box), it)));
  typeset(box);
}

function render(id) {
  const i = Math.max(0, PAGES.findIndex(p => p.id === id)), page = PAGES[i];
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === page.id));
  let head = `<span class="pill${page.kind === 'exo' ? '' : ' lesson'}">${page.pill}</span>`;
  if (page.stars) head += `<span class="stars">${page.stars}</span>`;
  if (page.comp) head += `<span class="comp">${page.comp}</span>`;
  let body = '';
  if (page.kind === 'lesson') body = page.html();
  if (page.kind === 'example') body = `<h2 class="part">${page.title}</h2><div class="intro">${page.intro}</div><p class="q"><b>${page.question}</b></p>
      <div class="corr">${stepsBlock(page.concl, page.piege)}</div>`;
  if (page.kind === 'exo') body = `<p class="consigne">${page.consigne}</p>
      <div class="tools"><button type="button" class="btn" data-rappel>Rappel</button><button type="button" class="btn green" data-train>↻ Nouvelles valeurs pour s’entraîner</button></div>
      <div class="rappel" hidden>${RAPPEL_EXO.map(b => `<div><h3>${b.t}</h3>${b.h}</div>`).join('')}<div class="att"><h3>Attention !</h3>${ATT_EXO}</div></div>
      <h2 class="part">À toi de jouer <small>cherche sur ton cahier, réponds, puis ouvre la correction détaillée</small></h2>
      <div class="parts"></div>`;
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  app.innerHTML = `
    <p class="obj"><b>Objectif ${page.obj[0]} :</b> ${page.obj[1]}</p>
    <article class="exo"><div class="exo-h">${head}</div><div class="exo-b">${body}</div></article>
    <nav class="foot">${prev ? `<button type="button" class="btn ghost" data-go="${prev.id}">← ${prev.nav}</button>` : '<span></span>'}${next ? `<button type="button" class="btn solid" data-go="${next.id}">${next.nav} →</button>` : ''}</nav>`;
  if (page.kind === 'example') wireSteps($('.corr', app), page.steps)();
  if (page.kind === 'exo') {
    const parts = $('.parts', app);
    renderParts(parts, page);
    const rap = $('.rappel', app), bRap = $('[data-rappel]', app);
    bRap.addEventListener('click', () => { rap.hidden = !rap.hidden; bRap.classList.toggle('on', !rap.hidden); if (!rap.hidden) typeset(rap); });
    $('[data-train]', app).addEventListener('click', () => { renderParts(parts, page); parts.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  }
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  typeset(app);
  window.scrollTo(0, 0);
}

nav.innerHTML = PAGES.map((p, i) => (p.kind === 'exo' && PAGES[i - 1].kind !== 'exo' ? '<span class="sep"></span>' : '') +
  `<button type="button" data-id="${p.id}">${p.nav}</button>`).join('');
nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.id; }));
const route = () => render(location.hash.slice(1));
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
