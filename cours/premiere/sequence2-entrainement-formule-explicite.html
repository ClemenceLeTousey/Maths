<style>
/* Même habillage que les corrigés de Seconde : une colonne de lecture, thème clair fixe (projection en classe). */
:root {
  color-scheme: light;
  --bg: #F5F7FA;
  --paper: #FFFFFF;
  --ink: #1D2733;
  --muted: #5B6878;
  --line: #DCE3EB;
  --calc: #1C7ED6;        /* bleu « Rappel » des feuilles LaTeX */
  --calc-soft: #EAF3FC;
  --sky: #339AF0;         /* pastille d'exercice */
  --obj: #F76707;         /* objectifs */
  --green: #2F9E44;
  --green-soft: #EBF7EE;
  --star-green: #40C057;
  --star-blue: #228BE6;
  --star-red: #FA5252;
  --red: #E03131;
  --red-soft: #FDEEEE;
  --f-body: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
  --f-cursive: "Playwrite FR Moderne", "Segoe Script", "Apple Chancery", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* sinon display:grid (rappel, correction) l’emporte sur hidden */
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }
main.wrap { padding-bottom: 64px; }
b, strong { font-weight: 500; }
h1, h2, h3 { font-weight: 500; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; }
a { color: var(--calc); }
:focus-visible { outline: 2px solid var(--calc); outline-offset: 2px; }

/* En-tête collant : titre + boutons des étapes */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.brand b { color: var(--ink); font-size: 17px; }
.brand a { margin-left: auto; font-size: 14px; text-decoration: none; }
.exnav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.exnav button { flex: none; border: 1px solid var(--sky); background: var(--paper); color: var(--sky); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-weight: 500; font-size: 15px; }
.exnav button:hover { background: var(--calc-soft); }
.exnav button.on { background: var(--sky); color: #fff; }
.exnav .sep { flex: none; width: 1px; background: var(--line); margin: 2px 4px; }

/* Carte */
.obj { margin: 24px 0 6px; color: var(--obj); font-size: 18px; }
.obj b { font-weight: 600; }
.exo { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.exo-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pill { background: var(--sky); color: #fff; border-radius: 4px; padding: 1px 10px; font-weight: 500; }
.pill.lesson { background: var(--calc); }
.stars { letter-spacing: 1px; }
.comp { margin-left: auto; font-family: var(--f-cursive); color: var(--sky); font-size: 15px; }
.exo-b { padding: 12px 16px 16px; display: grid; gap: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--calc); background: var(--paper); color: var(--calc); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 15px; font-weight: 500; }
.btn:hover { background: var(--calc-soft); }
.btn.solid { background: var(--calc); color: #fff; }
.btn.solid:hover { background: #1971C2; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.green { border-color: var(--green); color: var(--green); }
.btn.green:hover { background: var(--green-soft); }
.btn.on { background: var(--calc); color: #fff; }
.btn.sm { font-size: 14px; padding: 3px 10px; }

.rappel { background: var(--calc-soft); border-left: 3px solid var(--calc); padding: 14px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.rappel > div { min-width: 0; overflow-x: auto; }
.rappel h3 { font-size: 16px; color: var(--calc); margin-bottom: 4px; }
.rappel p { margin: 0 0 6px; }
.rappel .att h3 { color: var(--red); }
.rappel.one { grid-template-columns: minmax(0, 1fr); }
.formula { text-align: center; font-size: 19px; padding: 6px 0; }

h2.part { font-size: 19px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
h2.part small { font-size: 14px; color: var(--muted); font-weight: 400; }
.intro { min-width: 0; overflow-x: auto; }
.parts { display: grid; gap: 18px; }
.part-block { display: grid; gap: 10px; }
.items { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.item.open { border-color: var(--calc); }
.item .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.item .q { min-width: 0; overflow-x: auto; font-size: 18px; }
.item .row .btn { margin-left: auto; }
.ansrow { display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; }
.ans { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ans input { font: inherit; width: 7.5rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.ans input.good { border-color: var(--green); background: var(--green-soft); }
.ans input.bad { border-color: var(--red); background: var(--red-soft); }
.fb { font-size: 15px; }
.fb.good { color: var(--green); }
.fb.bad { color: var(--red); }

.corr { display: grid; gap: 8px; }
.steps { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line); }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--calc); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.step .m { overflow-x: auto; min-width: 0; }
.step .m mjx-container[display="true"] { margin: 2px 0 !important; text-align: left !important; }
.step .x { color: var(--muted); font-size: 15px; }
.step .h { min-width: 0; overflow-x: auto; }
.step .fig { overflow-x: auto; margin: 2px 0 6px; }
.step-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.end { display: grid; gap: 8px; }
.concl { background: var(--green-soft); border-left: 3px solid var(--green); padding: 6px 12px; overflow-x: auto; }
.piege { background: var(--red-soft); border-left: 3px solid var(--red); padding: 6px 12px; font-size: 15px; }
.piege b { color: var(--red); }
.piege ul { margin: 4px 0 0; padding-left: 1.2em; }

/* Schéma de flèches */
.fig svg, .chain svg { display: block; max-width: none; }
.chain { overflow-x: auto; }
svg .lab { fill: var(--ink); font: 16px var(--f-body); }
svg .val { fill: var(--calc); font: 600 15px var(--f-body); }
svg .arc { stroke: var(--red); fill: none; stroke-width: 2; }
svg .arch { fill: var(--red); }
svg .step-t { fill: var(--red); font: 600 13px var(--f-body); }
svg .big { stroke: var(--calc); fill: none; stroke-width: 2.5; }
svg .bigh { fill: var(--calc); }
svg .bigt { fill: var(--calc); font: 600 16px var(--f-body); }
svg .cnt { fill: var(--muted); font: 12px var(--f-body); }

.foot { margin-top: 18px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
@media (max-width: 560px) {
  body { font-size: 16px; }
  .comp { margin-left: 0; }
  .item .row .btn { margin-left: 0; }
}
</style>

<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Suites arithmétiques — Formule explicite</b><span>Séquence 2 · Croissances linéaires</span><a href="../../index.html">Retour au site</a></div>
    <nav class="exnav" id="exnav" aria-label="Étapes"></nav>
  </div>

<main class="wrap" id="app"></main>

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.min.js"></script>
<script>
'use strict';
const R = String.raw;

/* =====================================================================
   Outils
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const round2 = x => Math.round(x * 100) / 100;
// Nombre en TeX (virgule décimale) ; entre parenthèses s'il est négatif ; avec son signe
const tn = x => { x = round2(x); if (Object.is(x, -0)) x = 0; return (x < 0 ? '-' : '') + String(Math.abs(x)).replace('.', '{,}'); };
const tp = x => (round2(x) < 0 ? '(' + tn(x) + ')' : tn(x));
const tpl = x => (round2(x) < 0 ? '-' + tn(-x) : '+' + tn(x));
// « + 25n », « − 3n », « + n »
const coefN = r => { const a = Math.abs(round2(r)); return (round2(r) < 0 ? '-' : '+') + (a === 1 ? '' : tn(a)) + 'n'; };
// Nombre en texte (pour les schémas SVG)
const fmt = x => { x = round2(x); if (Object.is(x, -0)) x = 0; return (x < 0 ? '−' : '') + String(Math.abs(x)).replace('.', ','); };
function parse(s) {
  s = String(s).trim().replace(/\s/g, '').replace(',', '.').replace(/[−–]/g, '-').replace(/(€|cm|L)$/, '');
  if (s === '' || !/^[-+]?\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}
const intR = () => { let r = 0; while (r === 0) r = ri(-6, 9); return r; };
const randR = () => (Math.random() < 0.8 ? intR() : pick([0.5, 1.5, -0.5, 2.5, -1.5]));
const letters = ['u', 'v', 'w'];
const twoLetters = () => { const a = pick(letters); return [a, pick(letters.filter(l => l !== a))]; };

// « On se décale de n rangs : on ajoute n fois r » (ou on retire, si r est négatif)
const shiftX = (n, r) => R`On se décale de \(${n}\) rangs : ` + (round2(r) < 0
  ? R`on retire \(${n}\) fois \(${tn(-r)}\), ou on ajoute \(${n}\) fois \(${tn(r)}\).`
  : R`on ajoute \(${n}\) fois \(${tn(r)}\).`);

/* Schéma : de s(p) à s(n), une flèche par rang, puis une grande flèche « + n × r ».
   start = valeur de s(p) (null : pas de valeurs) ; symbolic : u(0), u(1), u(2), …, u(n−1), u(n). */
function chain(s, p, n, r, start, opts) {
  opts = opts || {};
  const k = n - p, step = 74, L = 44, W = L * 2 + k * step, H = start === null ? 150 : 172;
  const yLab = 80, yVal = 104, yBig = start === null ? 96 : 118;
  const X = i => L + i * step;
  let g = '';
  for (let i = 0; i <= k; i++) {
    const idx = opts.symbolic ? (i === 0 ? '0' : i === k ? 'n' : i === k - 1 ? 'n−1' : (i <= 2 ? String(i) : '')) : String(p + i);
    if (opts.symbolic && idx === '') { g += '<text class="lab" x="' + X(i) + '" y="' + yLab + '" text-anchor="middle">…</text>'; continue; }
    const idxSvg = idx === 'n' || idx === 'n−1' ? '<tspan font-style="italic">n</tspan>' + (idx === 'n−1' ? '−1' : '') : idx;
    g += '<text class="lab" x="' + X(i) + '" y="' + yLab + '" text-anchor="middle"><tspan font-style="italic">' + s + '</tspan>(' + idxSvg + ')</text>';
    if (start !== null) g += '<text class="val" x="' + X(i) + '" y="' + yVal + '" text-anchor="middle">' + fmt(start + i * r) + '</text>';
  }
  const rTxt = opts.rlabel ? opts.rlabel : opts.symbolic ? '+r' : (r < 0 ? fmt(r) : '+' + fmt(r));
  for (let i = 0; i < k; i++) {
    if (opts.symbolic && i === 3) continue;
    const a = X(i) + 12, b = X(i + 1) - 12, mid = (a + b) / 2;
    g += '<path class="arc" d="M' + a + ' 62 Q' + mid + ' 26 ' + b + ' 62"/>';
    g += '<path class="arch" d="M' + b + ' 63 l-8 -4 l3 9 z"/>';
    g += '<text class="step-t" x="' + mid + '" y="34" text-anchor="middle">' + rTxt + '</text>';
    if (!opts.symbolic && k > 3) g += '<text class="cnt" x="' + mid + '" y="16" text-anchor="middle">' + (i + 1) + '</text>';
  }
  const x0 = X(0), x1 = X(k), depth = yBig + 34;
  g += '<path class="big" d="M' + x0 + ' ' + yBig + ' Q' + ((x0 + x1) / 2) + ' ' + (depth + 18) + ' ' + x1 + ' ' + yBig + '"/>';
  g += '<path class="bigh" d="M' + x1 + ' ' + yBig + ' l-12 4 l8 7 z"/>';
  const big = opts.big ? opts.big : opts.symbolic ? '+ n × r' : '+ ' + k + ' × ' + (r < 0 ? '(' + fmt(r) + ')' : fmt(r));
  g += '<text class="bigt" x="' + ((x0 + x1) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + big + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Schéma : ' + k + ' flèches, chacune ajoute la raison">' + g + '</svg>';
}

/* =====================================================================
   Questions types
   Une question : { l, q, answers: [{label, value, unit}], steps: [{x, e, svg}], res, piege }
   ===================================================================== */
const given = (s, u0, r) => R`La suite \(${s}\) est arithmétique de premier terme \(${s}(0)=${tn(u0)}\) et de raison \(r=${tn(r)}\).`;
const PIEGE_NEG = R`la raison est négative : on écrit les parenthèses, \(n\times(-3)\), et on ne multiplie que la raison.`;

function termItem(l, s, u0, r, n) {
  const ans = u0 + n * r, steps = [
    { x: R`On part de \(${s}(0)=${tn(u0)}\) et on cherche \(${s}(${n})\) : on se décale de \(${n}\) rangs dans la liste.` }
  ];
  if (n <= 12) steps.push({ svg: chain(s, 0, n, r, u0), x: shiftX(n, r) });
  steps.push(
    { e: R`${s}(${n})=${s}(0)+${n}\times r`, x: R`On a ajouté \(${n}\) fois la raison : c'est la formule explicite.` },
    { e: R`${s}(${n})=${tn(u0)}+${n}\times ${tp(r)}`, x: 'On remplace par les valeurs.' },
    { e: R`${s}(${n})=${tn(u0)}${tpl(n * r)}=${tn(ans)}`, x: 'On calcule.' }
  );
  return { l, q: R`Calculer \(${s}(${n})\).`, answers: [{ label: R`\(${s}(${n})=\)`, value: ans }], steps, res: R`${s}(${n})=${tn(ans)}`, piege: r < 0 ? PIEGE_NEG : null };
}

function exprItem(l, s, u0, r) {
  return {
    l, q: R`Exprimer \(${s}(n)\) en fonction de \(n\).`,
    answers: [{ label: R`\(${s}(n)=\)`, value: u0 }, { label: R`\(+\)`, value: r, unit: R`\(\times n\)` }],
    steps: [
      { svg: chain(s, 0, 5, 0, null, { symbolic: true, rlabel: (r < 0 ? fmt(r) : '+' + fmt(r)), big: '+ n × ' + (r < 0 ? '(' + fmt(r) + ')' : fmt(r)) }),
        x: R`De \(${s}(0)\) à \(${s}(n)\), on se décale de \(n\) rangs : on ajoute \(n\) fois la raison.` },
      { e: R`${s}(n)=${s}(0)+n\times r`, x: 'On écrit la formule explicite.' },
      { e: R`${s}(n)=${tn(u0)}+n\times ${tp(r)}`, x: 'On remplace par les valeurs.' },
      { e: R`${s}(n)=${tn(u0)}${coefN(r)}`, x: R`On simplifie l'écriture : le nombre seul est \(${s}(0)\), le nombre devant \(n\) est la raison.` }
    ],
    res: R`${s}(n)=${tn(u0)}${coefN(r)}`,
    piege: r < 0 ? R`la raison est négative : dans la 2<sup>e</sup> case, tape le signe moins (par exemple \(-3\)).` : null
  };
}

function termFromExprItem(l, s, u0, r, N) {
  const ans = u0 + N * r;
  return {
    l, q: R`En déduire \(${s}(${N})\).`, answers: [{ label: R`\(${s}(${N})=\)`, value: ans }],
    steps: [
      { e: R`${s}(n)=${tn(u0)}${coefN(r)}`, x: 'On reprend l’expression de la question précédente.' },
      { e: R`${s}(${N})=${tn(u0)}+${tp(r)}\times ${N}`, x: R`On remplace \(n\) par \(${N}\).` },
      { e: R`${s}(${N})=${tn(u0)}${tpl(N * r)}=${tn(ans)}`, x: 'On calcule.' }
    ],
    res: R`${s}(${N})=${tn(ans)}`, piege: null
  };
}

// Problèmes concrets
const contexts = [
  () => { const s0 = ri(5, 20) * 10, d = pick([10, 15, 20, 25, 30]), n = ri(4, 10);
    return { s: 's', u0: s0, r: d, n, unit: '€', intro: R`Lina a ${s0} € dans sa tirelire. Chaque mois, elle y ajoute ${d} €. On note \(s(n)\) la somme, en euros, après \(n\) mois.`,
      q: R`Quelle somme aura-t-elle après ${n} mois ?`, r0: R`Au départ, \(s(0)=${s0}\). Chaque mois on ajoute ${d} € : \(s\) est arithmétique de raison \(r=${d}\).` }; },
  () => { const [h0, d] = pick([[18, 1.5], [20, 2], [24, 2], [30, 2.5], [25, 2]]), n = ri(3, Math.min(10, Math.round(h0 / d) - 1));
    return { s: 'h', u0: h0, r: -d, n, unit: 'cm', intro: R`Une bougie mesure ${h0} cm. Elle perd \(${tn(d)}\) cm par heure. On note \(h(n)\) sa hauteur, en cm, après \(n\) heures.`,
      q: R`Quelle est sa hauteur après ${n} heures ?`, r0: R`Au départ, \(h(0)=${h0}\). Chaque heure on retire \(${tn(d)}\) : \(h\) est arithmétique de raison \(r=${tn(-d)}\) (elle diminue).` }; },
  () => { const a0 = ri(20, 150), g = ri(5, 30), n = ri(4, 10);
    return { s: 'a', u0: a0, r: g, n, unit: 'abonnés', intro: R`Une chaîne vidéo a ${a0} abonnés. Elle gagne ${g} abonnés par semaine. On note \(a(n)\) le nombre d'abonnés après \(n\) semaines.`,
      q: R`Combien d'abonnés aura-t-elle après ${n} semaines ?`, r0: R`Au départ, \(a(0)=${a0}\). Chaque semaine on ajoute ${g} : \(a\) est arithmétique de raison \(r=${g}\).` }; },
  () => { const l = pick([20, 25, 40, 50]), n = ri(4, 10), V0 = l * ri(n + 2, 30);
    return { s: 'c', u0: V0, r: -l, n, unit: 'L', intro: R`Une cuve contient ${V0} L d'eau. On en utilise ${l} L par jour pour arroser. On note \(c(n)\) le volume, en litres, après \(n\) jours.`,
      q: R`Quel volume reste-t-il après ${n} jours ?`, r0: R`Au départ, \(c(0)=${V0}\). Chaque jour on retire ${l} : \(c\) est arithmétique de raison \(r=${-l}\) (elle diminue).` }; }
];

/* =====================================================================
   Étapes de la page
   ===================================================================== */
const S1 = '<span style="color:var(--star-green)">★</span><span style="color:#C5CCD3">☆☆</span>';
const S2 = '<span style="color:var(--star-blue)">★★</span><span style="color:#C5CCD3">☆</span>';
const OBJ1 = [1, 'Calculer un terme d’une suite arithmétique'];
const OBJ2 = [2, R`Exprimer \(u(n)\) en fonction de \(n\)`];
const OBJ3 = [3, 'Utiliser une suite arithmétique dans une situation concrète'];

const RAPPEL_EXO = [
  { t: 'Formule explicite', h: R`<p class="formula">\(u(n)=u(0)+n\times r\)</p><p>On part de \(u(0)\) et on se décale de \(n\) rangs : on ajoute \(n\) fois la raison \(r\).</p>` },
  { t: 'Exemple', h: R`<p>\(u(0)=150\) et \(r=25\) :</p><p>\(u(5)=150+5\times 25=275\)</p><p>\(u(n)=150+25n\)</p>` }
];
const ATT_EXO = R`<p>Raison négative : on met des parenthèses, \(18+10\times(-1{,}5)=18-15=3\).</p><p>On ne multiplie que la raison, pas le premier terme.</p>`;

const PAGES = [
  { id: 'rappel', nav: 'Rappel', obj: OBJ1, pill: 'Rappel', kind: 'lesson',
    html: () => R`<div class="rappel one"><div>
        <h3>Suite arithmétique</h3>
        <p>Dans une suite arithmétique de raison \(r\), on passe d'un terme au suivant en ajoutant toujours \(r\).<br><em>Chaque flèche matérialise l'ajout de \(r\).</em></p>
        <div class="chain">${chain('u', 0, 3, 0, null, { rlabel: '+r', big: '+ 3 × r' })}</div>
        <p>Pour calculer un terme éloigné, on compte le nombre de fois où l'on a ajouté la raison \(r\), c'est-à-dire le nombre de rangs dont on se décale dans la liste.</p>
      </div></div>` },

  { id: 'exemple1', nav: 'Exemple 1', obj: OBJ1, pill: 'Exemple 1', kind: 'example',
    title: R`Calculer \(u(5)\) : on répète 5 fois \(+r\)`,
    intro: R`Karim a 150 € sur son livret. Chaque mois, il ajoute 25 €. On note \(u(n)\) la somme, en euros, après \(n\) mois.`,
    question: 'Combien Karim aura-t-il après 5 mois ?',
    steps: [

  { id: 'exemple2', nav: 'Exemple 2', obj: OBJ1, pill: 'Exemple 2', kind: 'example',

    piege: R`<b>À retenir :</b><ul>

      <li>Raison négative : on met des parenthèses, \(10\times(-1{,}5)=-15\).</li>

  { id: 'generalisation', nav: 'Généralisation', obj: OBJ2, pill: 'Généralisation', kind: 'example',

      { svg: chain('u', 0, 5, 0, null, { symbolic: true, rlabel: '+25', big: '+ n × 25' }), x: R`Après \(n\) mois, on se décale de \(n\) rangs : on ajoute \(n\) fois 25.` },
      { e: R`u(n)=u(0)+n\times r=150+n\times 25`, x: 'On écrit la formule explicite et on remplace.' },
      { e: R`u(n)=150+25n`, x: R`On simplifie l'écriture.` },
      { e: R`h(n)=18+n\times(-1{,}5)=18-1{,}5n`, x: 'De même pour la bougie de l’exemple 2.' },
      { e: R`u(24)=150+25\times 24=750`, x: 'Avec cette formule, on calcule n’importe quel terme d’un seul coup : Karim au bout de 2 ans (24 mois).' }
    ],

      \[u(n)=u(0)+n\times r\]
      Le nombre seul est le premier terme \(u(0)\) ; le nombre devant \(n\), avec son signe, est la raison \(r\).` },

      while (B.n === A.n) B.n = ri(3, 10);

    build: () => {

    build: () => {

      it.q = c.q;
      it.answers[0].unit = c.unit;
      it.steps[0] = { x: c.r0 };

    build: () => {
      const s = pick(letters), u0 = ri(-5, 40), r = randR(), N = pick([15, 20, 25, 30, 50, 100]);
      return [{ intro: given(s, u0, r), items: [exprItem('1.', s, u0, r), termFromExprItem('2.', s, u0, r, N)] }];

/* =====================================================================
   Affichage
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app'), nav = $('#exnav');
function typeset(el) {
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    MathJax.startup.promise.then(() => MathJax.typesetPromise([el])).catch(() => {});
  }
}

function stepHTML(st, k) {
  let inner = '';
  if (st.svg) inner += `<div class="fig">${st.svg}</div>`;
  if (st.e) inner += `<div class="m">\\[${st.e}\\]</div>`;
  if (st.h) inner += `<div class="h">${st.h}</div>`;
  if (st.x) inner += `<div class="x">${st.x}</div>`;
  return `<span class="n">${k}</span><div>${inner}</div>`;
}
const stepsBlock = (concl, piege) => `<ol class="steps"></ol>
  <div class="step-ctrl"><button type="button" class="btn solid sm" data-next>Étape suivante</button><button type="button" class="btn ghost sm" data-all>Tout afficher</button><button type="button" class="btn ghost sm" data-reset hidden>Recommencer</button></div>
  <div class="end" hidden><div class="concl">${concl}</div>${piege ? `<div class="piege">${piege}</div>` : ''}</div>`;

// Déroulé étape par étape dans root (qui contient stepsBlock) ; renvoie start()
function wireSteps(root, steps) {
  const ol = $('.steps', root), end = $('.end', root);
  const bN = $('[data-next]', root), bA = $('[data-all]', root), bR = $('[data-reset]', root);
  let k = 0;
  const add = () => { const li = document.createElement('li'); li.className = 'step'; li.innerHTML = stepHTML(steps[k], k + 1); k++; ol.appendChild(li); typeset(li); };
  const sync = () => { const fin = k >= steps.length; bN.hidden = fin; bA.hidden = fin; bR.hidden = !fin; end.hidden = !fin; if (fin) typeset(end); };
  bN.addEventListener('click', () => { add(); sync(); });
  bA.addEventListener('click', () => { while (k < steps.length) add(); sync(); });
  bR.addEventListener('click', () => { ol.innerHTML = ''; k = 0; add(); sync(); });
  return () => { if (k === 0) { add(); sync(); } };
}

function itemHTML(it, id) {
  return `<div class="item" data-id="${id}">
    <div class="row"><span class="q">${it.l ? `<b>${it.l}</b> ` : ''}${it.q}</span><button type="button" class="btn sm" data-open>Correction détaillée</button></div>
    <div class="ansrow">${it.answers.map((a, i) => `<label class="ans" for="${id}-${i}"><span>${a.label}</span><input type="text" id="${id}-${i}" inputmode="decimal" autocomplete="off" spellcheck="false">${a.unit ? `<span>${a.unit}</span>` : ''}</label>`).join('')}
      <button type="button" class="btn solid sm" data-check>Vérifier</button><span class="fb" aria-live="polite"></span></div>
    <div class="corr" hidden>${stepsBlock(`Résultat : \\(${it.res}\\)`, it.piege ? `<b>Erreur à éviter :</b> ${it.piege}` : '')}</div>
  </div>`;
}
function wireItem(el, it) {
  const corr = $('.corr', el), start = wireSteps(corr, it.steps), fb = $('.fb', el);
  $('[data-open]', el).addEventListener('click', e => {
    const open = corr.hidden;
    corr.hidden = !open; el.classList.toggle('open', open);
    e.currentTarget.textContent = open ? 'Masquer la correction' : 'Correction détaillée';
    if (open) start();
  });
  const check = () => {
    let good = 0;
    it.answers.forEach((a, i) => {
      const inp = $(`#${el.dataset.id}-${i}`, el), v = parse(inp.value);
      const ok = !Number.isNaN(v) && Math.abs(round2(v) - round2(a.value)) < 0.006;
      inp.classList.toggle('good', ok); inp.classList.toggle('bad', !ok); if (ok) good++;
    });
    const all = good === it.answers.length;
    fb.textContent = all ? '✓ Juste !' : '✗ Pas encore : compte bien les rangs, ou ouvre la correction détaillée.';
    fb.className = 'fb ' + (all ? 'good' : 'bad');
  };
  $('[data-check]', el).addEventListener('click', check);
  el.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }));
}

function renderParts(box, page) {
  const parts = page.build();
  box.innerHTML = parts.map((p, pi) => `<div class="part-block">
      ${p.title || p.intro ? `<p class="intro">${p.title ? `<b>${p.title}</b> ` : ''}${p.intro || ''}</p>` : ''}
      <div class="items">${p.items.map((it, ii) => itemHTML(it, `${page.id}p${pi}i${ii}`)).join('')}</div></div>`).join('');
  parts.forEach((p, pi) => p.items.forEach((it, ii) => wireItem($(`[data-id="${page.id}p${pi}i${ii}"]`, box), it)));
  typeset(box);
}

function render(id) {
  const i = Math.max(0, PAGES.findIndex(p => p.id === id)), page = PAGES[i];
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === page.id));
  let head = `<span class="pill${page.kind === 'exo' ? '' : ' lesson'}">${page.pill}</span>`;
  if (page.stars) head += `<span class="stars">${page.stars}</span>`;
  if (page.comp) head += `<span class="comp">${page.comp}</span>`;
  let body = '';
  if (page.kind === 'lesson') body = page.html();
  if (page.kind === 'example') body = `<h2 class="part">${page.title}</h2><p class="intro">${page.intro}</p><p class="q"><b>${page.question}</b></p>
      <div class="corr">${stepsBlock(page.concl, page.piege)}</div>`;
  if (page.kind === 'exo') body = `<p class="consigne">${page.consigne}</p>
      <div class="tools"><button type="button" class="btn" data-rappel>Rappel</button><button type="button" class="btn green" data-train>↻ Nouvelles valeurs pour s’entraîner</button></div>
      <div class="rappel" hidden>${RAPPEL_EXO.map(b => `<div><h3>${b.t}</h3>${b.h}</div>`).join('')}<div class="att"><h3>Attention !</h3>${ATT_EXO}</div></div>
      <h2 class="part">À toi de jouer <small>cherche sur ton cahier, tape ta réponse, puis ouvre la correction détaillée</small></h2>
      <div class="parts"></div>`;
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  app.innerHTML = `
    <p class="obj"><b>Objectif ${page.obj[0]} :</b> ${page.obj[1]}</p>
    <article class="exo"><div class="exo-h">${head}</div><div class="exo-b">${body}</div></article>
    <nav class="foot">${prev ? `<button type="button" class="btn ghost" data-go="${prev.id}">← ${prev.nav}</button>` : '<span></span>'}${next ? `<button type="button" class="btn solid" data-go="${next.id}">${next.nav} →</button>` : ''}</nav>`;
  if (page.kind === 'example') wireSteps($('.corr', app), page.steps)();
  if (page.kind === 'exo') {
    const parts = $('.parts', app);
    renderParts(parts, page);
    const rap = $('.rappel', app), bRap = $('[data-rappel]', app);
    bRap.addEventListener('click', () => { rap.hidden = !rap.hidden; bRap.classList.toggle('on', !rap.hidden); if (!rap.hidden) typeset(rap); });
    $('[data-train]', app).addEventListener('click', () => { renderParts(parts, page); parts.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  }
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  typeset(app);
  window.scrollTo(0, 0);
}

nav.innerHTML = PAGES.map((p, i) => (p.kind === 'exo' && PAGES[i - 1].kind !== 'exo' ? '<span class="sep"></span>' : '') +
  `<button type="button" data-id="${p.id}">${p.nav}</button>`).join('');
nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.id; }));
const route = () => render(location.hash.slice(1));
window.addEventListener('hashchange', route);
route();
</script>
</body>
