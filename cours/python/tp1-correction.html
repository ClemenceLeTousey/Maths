<style>
/* Même habillage que les corrigés interactifs des feuilles d'exercices ; encadrés Script / Console
   aux couleurs du TP LaTeX (algoCode…). Python tourne vraiment dans la page (Pyodide, dans un worker). */
:root {
  color-scheme: light;
  --bg: #F5F7FA;
  --paper: #FFFFFF;
  --ink: #1D2733;
  --muted: #5B6878;
  --line: #DCE3EB;
  --calc: #1C7ED6;
  --calc-soft: #EAF3FC;
  --sky: #339AF0;
  --obj: #F76707;
  --green: #2F9E44;
  --green-soft: #EBF7EE;
  --star-green: #40C057;
  --star-blue: #228BE6;
  --star-red: #FA5252;
  --red: #E03131;
  --red-soft: #FDEEEE;
  --amber-soft: #FFF8E6;
  --code-bg: #282923;
  --code-gutter: #2F3129;
  --code-text: #DEE3EB;
  --code-kw: #E06C75;
  --code-op: #C678DD;
  --code-str: #98C379;
  --code-com: #A0A8B3;
  --code-no: #8C94A3;
  --code-num: #E5C07B;
  --code-tab: #2B6CA0;
  --code-cur: #3E4A2E;
  --f-body: "Source Sans 3", "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
  --f-cursive: "Playwrite FR Moderne", "Segoe Script", "Apple Chancery", cursive;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; }
main.wrap { padding-bottom: 64px; }
b, strong { font-weight: 600; }
h1, h2, h3 { font-weight: 500; text-wrap: balance; margin: 0; }
button { font: inherit; }
a { color: var(--calc); }
:focus-visible { outline: 2px solid var(--calc); outline-offset: 2px; }
code, .py { font-family: var(--f-mono); font-size: 0.86em; background: #EEF1F5; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: pre-wrap; }

/* En-tête collant */
.top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: grid; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.brand b { color: var(--ink); font-size: 17px; font-weight: 500; }
.brand a { margin-left: auto; font-size: 14px; text-decoration: none; }
.exnav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.exnav button { flex: none; border: 1px solid var(--sky); background: var(--paper); color: var(--sky); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-weight: 500; font-size: 15px; }
.exnav button:hover { background: var(--calc-soft); }
.exnav button.on { background: var(--sky); color: #fff; }

/* Exercice */
.obj { margin: 24px 0 6px; color: var(--obj); font-size: 18px; }
.obj b { font-weight: 600; }
.exo { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.exo-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pill { background: var(--sky); color: #fff; border-radius: 4px; padding: 1px 10px; font-weight: 500; }
.stars { letter-spacing: 1px; }
.titre-ex { font-weight: 600; }
.comp { margin-left: auto; font-family: var(--f-cursive); color: var(--sky); font-size: 15px; }
.exo-b { padding: 12px 16px 16px; display: grid; gap: 14px; min-width: 0; }
.consigne { margin: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--calc); background: var(--paper); color: var(--calc); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 15px; font-weight: 500; }
.btn:hover { background: var(--calc-soft); }
.btn.solid { background: var(--calc); color: #fff; }
.btn.solid:hover { background: #1971C2; }
.btn.ghost { border-color: var(--line); color: var(--ink); }
.btn.green { border-color: var(--green); color: var(--green); }
.btn.green:hover { background: var(--green-soft); }
.btn.on { background: var(--calc); color: #fff; }
.btn.sm { font-size: 14px; padding: 3px 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.run { border-color: var(--code-tab); background: var(--code-tab); color: #fff; }
.btn.run:hover { background: #245c88; }

.rappel { background: var(--calc-soft); border-left: 3px solid var(--calc); padding: 14px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.rappel > div { min-width: 0; overflow-x: auto; }
.rappel h3 { font-size: 16px; color: var(--calc); margin-bottom: 4px; }
.rappel p, .rappel ul { margin: 0 0 6px; }
.rappel ul { padding-left: 20px; }
.rappel .att h3 { color: var(--red); }

h2.part { font-size: 19px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
h2.part small { font-size: 14px; color: var(--muted); font-weight: 400; }
.items { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.item.open { border-color: var(--calc); }
.item .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.item .q { min-width: 0; overflow-x: auto; flex: 1 1 300px; }
.item .q > b:first-child { margin-right: 4px; }
.item .row .btn { margin-left: auto; }
.res { display: inline-block; border: 1px solid var(--green); background: var(--green-soft); border-radius: 4px; padding: 0 8px; overflow-x: auto; max-width: 100%; }
.item .resline { display: none; }
.showres .sheet .item .resline, .item.raw .resline { display: block; }

/* Encadrés Script et Console (comme dans le TP) */
.code { position: relative; background: var(--code-bg); border-radius: 6px; margin-top: 12px; min-width: 0; max-width: 100%; }
/* mode sombre de barre.js (page inversée) : les encadrés de code restent sombres */
html.barre-inverse .code { filter: invert(1) hue-rotate(180deg); }
.code .tab { position: absolute; top: -11px; left: 10px; background: var(--code-tab); color: #fff; font-size: 12px; font-weight: 500; border-radius: 3px; padding: 0 8px; line-height: 20px; }
.code pre { margin: 0; padding: 12px 12px 10px 0; overflow-x: auto; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.55; color: var(--code-text); }
.code pre .l { display: block; padding-left: 44px; position: relative; min-height: 1.55em; }
.code pre .l::before { content: attr(data-n); position: absolute; left: 0; width: 32px; text-align: right; color: var(--code-no); }
.code pre .l.cur { background: var(--code-cur); box-shadow: inset 3px 0 0 #8CE99A; }
.code pre .l.done { opacity: .55; }
.code.console pre .l { padding-left: 12px; }
.code.console pre .l::before { content: none; }
.k { color: var(--code-kw); }
.o { color: var(--code-op); }
.s { color: var(--code-str); }
.c { color: var(--code-com); font-style: italic; }
.nb { color: var(--code-num); }
.out { color: #FFFFFF; }
.err { color: #FF8787; }
.fix { color: #8CE99A; font-weight: 600; }
.code textarea { display: block; width: 100%; min-height: 120px; resize: vertical; border: none; outline: none; background: transparent; color: var(--code-text); font-family: var(--f-mono); font-size: 14.5px; line-height: 1.55; padding: 14px 12px 10px; tab-size: 4; white-space: pre; overflow-x: auto; }
.code textarea:focus { box-shadow: inset 0 0 0 2px var(--code-tab); border-radius: 6px; }
.codes { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.codes > * { flex: 1 1 260px; min-width: 0; }
.runbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.pystat { color: var(--muted); font-size: 14px; }
.tests { display: grid; gap: 4px; margin-top: 6px; font-size: 15px; }
.tests div { border-radius: 4px; padding: 3px 10px; overflow-x: auto; }
.tests .ok { background: var(--green-soft); border-left: 3px solid var(--green); }
.tests .ko { background: var(--red-soft); border-left: 3px solid var(--red); }

/* Exécution pas à pas */
.trace { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 640px) { .trace { grid-template-columns: 1fr; } }
.vars { border-collapse: collapse; margin-top: 12px; font-family: var(--f-mono); font-size: 14.5px; }
.vars th, .vars td { border: 1px solid var(--line); padding: 3px 12px; text-align: center; min-width: 52px; }
.vars th { background: var(--bg); font-weight: 600; }
.vars td.chg { background: #FFF3BF; font-weight: 600; }
.vars td.vide { color: var(--muted); }
.vars caption { caption-side: top; text-align: left; font-family: var(--f-body); font-size: 14px; color: var(--muted); padding-bottom: 2px; }

/* Blocs Scratch (simplifiés) */
.scr { display: inline-grid; gap: 2px; font-size: 14px; font-weight: 600; color: #fff; margin: 4px 0; }
.scr > div { border-radius: 4px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.scr .def { background: #FF6680; border-radius: 12px 12px 4px 4px; padding-top: 8px; }
.scr .var { background: #FF8C1A; margin-left: 10px; }
.scr .look { background: #9966FF; margin-left: 10px; }
.scr i { font-style: normal; background: #fff; color: #333; border-radius: 10px; padding: 0 8px; font-weight: 500; }
.scr i.op { background: #59C059; color: #fff; border-radius: 10px; }
.scr i.par { background: #FF4D6A; color: #fff; }
.scr i.v { background: #FFAB19; color: #fff; }

/* Réponse de l'élève */
.aide { margin: 0; font-size: 15px; color: var(--muted); }
.answer { display: grid; gap: 6px; min-width: 0; }
.ab { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; min-width: 0; }
.ab label { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 260px; }
.ab label > span { white-space: nowrap; }
.answer input[type="text"] { font: inherit; font-family: var(--f-mono); font-size: 15px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); min-width: 0; width: 100%; }
.answer input[type="text"]:focus { outline: none; border-color: var(--calc); box-shadow: 0 0 0 2px var(--calc-soft); }
.ans-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fb { border-radius: 4px; padding: 6px 12px; font-size: 15px; overflow-x: auto; }
.fb.ok { background: var(--green-soft); border-left: 3px solid var(--green); }
.fb.warn { background: var(--amber-soft); border-left: 3px solid #F59F00; }
.fb.ko { background: var(--red-soft); border-left: 3px solid var(--red); }
.train .item.good { border-color: var(--green); }

.tab-rep { border-collapse: collapse; font-size: 15px; }
.tab-rep th, .tab-rep td { border: 1px solid var(--line); padding: 4px 12px; text-align: center; }
.tab-rep th { background: var(--bg); font-weight: 500; }
.scroll { overflow-x: auto; max-width: 100%; }

.steps { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line); }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--calc); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.step > div { min-width: 0; }
.step .m { overflow-x: auto; min-width: 0; }
.step .m mjx-container[display="true"] { margin: 2px 0 !important; text-align: left !important; }
.step .x { color: var(--muted); font-size: 15px; margin-top: 2px; }
.step .x em { font-style: normal; color: var(--ink); }
.chain { font-family: var(--f-mono); font-size: 15px; overflow-x: auto; }
.chain .hl { background: #FFF3BF; border-radius: 3px; padding: 0 2px; }
.step-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.concl { background: var(--green-soft); border-left: 3px solid var(--green); padding: 6px 12px; overflow-x: auto; }
.piege { background: var(--red-soft); border-left: 3px solid var(--red); padding: 6px 12px; font-size: 15px; }
.piege b { color: var(--red); }

.train { border-top: 2px dashed var(--line); padding-top: 14px; display: grid; gap: 12px; min-width: 0; }
.train h2 { color: var(--green); }
.train .item { border-color: #CFE8D5; background: #FBFEFB; }
.train .item.open { border-color: var(--green); }

.foot { margin-top: 18px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
@media (max-width: 560px) {
  body { font-size: 16px; }
  .comp { margin-left: 0; }
  .item .row .btn { margin-left: 0; }
}

<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fr = x => String(x).replace('.', ',');          // écriture française d'un nombre
const S1 = '<span style="color:var(--star-green)">★</span><span style="color:#C5CCD3">☆☆</span>';
const S2 = '<span style="color:var(--star-blue)">★★</span><span style="color:#C5CCD3">☆</span>';
const S3 = '<span style="color:var(--star-red)">★★★</span>';

/* =====================================================================
   1. Mini-Python : nombres typés (int / float) comme en Python
   Valeur = { v: nombre, f: vrai si float }.
   ===================================================================== */
const I = v => ({ v, f: false }), F = v => ({ v, f: true });
function repr(x) {
  if (!x.f) return String(x.v);
  if (Number.isInteger(x.v) && Math.abs(x.v) < 1e16) return x.v.toFixed(1);
  return String(x.v);
}
function opPy(o, a, b) {
  if (o === '+') return { v: a.v + b.v, f: a.f || b.f };
  if (o === '-') return { v: a.v - b.v, f: a.f || b.f };
  if (o === '*') return { v: a.v * b.v, f: a.f || b.f };
  if (o === '/') { if (b.v === 0) throw new Error('ZeroDivisionError: division by zero'); return F(a.v / b.v); }
  if (o === '**') {
    if (!a.f && !b.f && b.v >= 0) return I(a.v ** b.v);
    return F(a.v ** b.v);
  }
  throw new Error('opération inconnue');
}
// Analyse syntaxique : expr = terme (± terme)* ; terme = unaire (*,/ unaire)* ; unaire = -unaire | puiss ; puiss = atome (** unaire)?
function tokens(s) {
  const t = [], re = /\s*(\d+\.\d*|\.\d+|\d+|[A-Za-z_]\w*|\*\*|[-+*/(),])/y;
  let m; re.lastIndex = 0;
  while (re.lastIndex < s.length) {
    if (/^\s*$/.test(s.slice(re.lastIndex))) break;
    m = re.exec(s); if (!m) throw new Error('écriture non reconnue');
    t.push(m[1]);
  }
  return t;
}
function parse(s) {
  const t = tokens(s); let i = 0;
  const peek = () => t[i], eat = x => { if (t[i] !== x) throw new Error(`« ${x} » attendu`); i++; };
  function expr() { let n = term(); while (peek() === '+' || peek() === '-') { const op = t[i++]; n = { t: 'bin', op, a: n, b: term() }; } return n; }
  function term() { let n = unary(); while (peek() === '*' || peek() === '/') { const op = t[i++]; n = { t: 'bin', op, a: n, b: unary() }; } return n; }
  function unary() { if (peek() === '-') { i++; return { t: 'neg', a: unary() }; } return power(); }
  function power() { const n = atom(); if (peek() === '**') { i++; return { t: 'bin', op: '**', a: n, b: unary() }; } return n; }
  function atom() {
    const x = t[i++];
    if (x === undefined) throw new Error('expression incomplète');
    if (x === '(') { const e = expr(); eat(')'); return { t: 'par', e }; }
    if (/^[\d.]/.test(x)) return { t: 'num', x: x.includes('.') ? F(parseFloat(x)) : I(parseInt(x, 10)) };
    if (/^[A-Za-z_]/.test(x)) return { t: 'var', n: x };
    throw new Error(`« ${x} » inattendu`);
  }
  const n = expr();
  if (i < t.length) throw new Error(`« ${t[i]} » inattendu`);
  return n;
}
function ev(n, env = {}) {
  switch (n.t) {
    case 'num': return n.x;
    case 'var': if (!(n.n in env)) throw new Error(`NameError: name '${n.n}' is not defined`); return env[n.n];
    case 'par': return ev(n.e, env);
    case 'neg': { const a = ev(n.a, env); return { v: -a.v, f: a.f }; }
    case 'bin': return opPy(n.op, ev(n.a, env), ev(n.b, env));
  }
}
const evalPy = (s, env) => ev(parse(s), env);
// Réécriture (les parenthèses d'origine sont conservées)
function pr(n, sub) {
  switch (n.t) {
    case 'num': return repr(n.x);
    case 'var': if (sub && n.n in sub) { const r = repr(sub[n.n]); return r.startsWith('-') ? `(${r})` : r; } return n.n;
    case 'par': return '(' + pr(n.e, sub) + ')';
    case 'neg': return '-' + pr(n.a, sub);
    case 'bin': return pr(n.a, sub) + ' ' + n.op + ' ' + pr(n.b, sub);
  }
}
const OPN = { '+': 'l’addition', '-': 'la soustraction', '*': 'la multiplication', '/': 'la division', '**': 'la puissance' };
/* Une étape de calcul, dans l'ordre où Python le fait (de gauche à droite, priorités respectées).
   Renvoie [nouvel arbre, infos] ou null si l'expression est déjà un nombre. */
function red(n, inPar) {
  if (n.t === 'num') return null;
  if (n.t === 'par') {
    const r = red(n.e, true); if (!r) return [n.e, { unpar: true }];
    return [r[0].t === 'num' ? r[0] : { t: 'par', e: r[0] }, r[1]];
  }
  if (n.t === 'neg') {
    const r = red(n.a, inPar); if (r) return [{ t: 'neg', a: r[0] }, r[1]];
    return [{ t: 'num', x: { v: -n.a.x.v, f: n.a.x.f } }, { neg: true }];
  }
  let r = red(n.a, inPar); if (r) return [{ ...n, a: r[0] }, r[1]];
  r = red(n.b, inPar); if (r) return [{ ...n, b: r[0] }, r[1]];
  const x = opPy(n.op, n.a.x, n.b.x);
  return [{ t: 'num', x, mark: true }, { op: n.op, a: n.a.x, b: n.b.x, x, inPar, src: pr(n) }];
}
function hasLowOp(n) {
  if (!n || n.t === 'num' || n.t === 'var') return false;
  if (n.t === 'par') return false;
  if (n.t === 'neg') return hasLowOp(n.a);
  return n.op === '+' || n.op === '-' || hasLowOp(n.a) || hasLowOp(n.b);
}
function prMark(n) {
  switch (n.t) {
    case 'num': return n.mark ? `<span class="hl">${repr(n.x)}</span>` : repr(n.x);
    case 'var': return n.n;
    case 'par': return '(' + prMark(n.e) + ')';
    case 'neg': return '-' + prMark(n.a);
    case 'bin': return prMark(n.a) + ' ' + esc(n.op) + ' ' + prMark(n.b);
  }
}
const unmark = n => n.t === 'num' ? { t: 'num', x: n.x } : n.t === 'par' ? { t: 'par', e: unmark(n.e) } : n.t === 'neg' ? { t: 'neg', a: unmark(n.a) } : n.t === 'bin' ? { ...n, a: unmark(n.a), b: unmark(n.b) } : n;
// Étapes de calcul d'une expression (pour « Correction détaillée »)
function calcSteps(src) {
  let n = parse(src); const steps = [];
  const top0 = n;
  for (let k = 0; k < 20; k++) {
    const r = red(n); if (!r) break;
    const [m, inf] = r;
    if (inf.unpar || inf.neg) { n = unmark(m); continue; }
    const why = [];
    if (inf.inPar) why.push('les parenthèses sont calculées en premier');
    else if (inf.op === '**' && (n.t === 'bin' && n.op !== '**')) why.push('la puissance <code>**</code> est prioritaire');
    else if ((inf.op === '*' || inf.op === '/') && hasLowOp(n)) why.push('<code>*</code> et <code>/</code> passent avant <code>+</code> et <code>-</code>');
    if (inf.op === '/') why.push('une division <code>/</code> donne toujours un nombre à virgule (un <em>float</em>), même quand elle « tombe juste »');
    else if (inf.x.f && (inf.a.f || inf.b.f)) why.push('un des deux nombres est un float (il s’écrit avec un point), donc le résultat aussi');
    steps.push({ h: `<div class="chain">${prMark(m)}</div>`, x: `On calcule ${OPN[inf.op]} <code>${esc(inf.src)}</code> = <code>${repr(inf.x)}</code>${why.length ? ' : ' + why.join(' ; ') : ''}.` });
    n = unmark(m);
  }
  return { steps, res: repr(ev(top0)) };
}

/* =====================================================================
   2. Exécution « à la main » d'un petit script (affectations, print)
   ===================================================================== */
function splitTop(s) {      // découpe « a, b » en dehors des parenthèses
  const out = []; let d = 0, cur = '';
  for (const ch of s) { if (ch === '(') d++; if (ch === ')') d--; if (ch === ',' && !d) { out.push(cur); cur = ''; } else cur += ch; }
  out.push(cur); return out.map(x => x.trim());
}
function traceScript(src) {
  const lines = src.split('\n'), env = {}, order = [], out = [], steps = [];
  lines.forEach((raw, i) => {
    const l = raw.replace(/#.*$/, '').trim();
    if (!l) return;
    let m;
    if ((m = l.match(/^print\((.*)\)$/))) {
      const ast = parse(m[1]), x = ev(ast, env);
      out.push(repr(x));
      const subst = ast.t === 'var' ? '' : ` : avec les valeurs actuelles, <code>${esc(pr(ast, env))}</code> = <code>${repr(x)}</code>`;
      steps.push({ line: i, env: { ...env }, order: order.slice(), chg: [], out: out.slice(), x: `<code>${esc(l)}</code> affiche la valeur de <code>${esc(m[1])}</code>${subst}. La console affiche <b>${repr(x)}</b>.` });
      return;
    }
    if ((m = l.match(/^([A-Za-z_][\w\s,]*?)\s*=\s*(.+)$/))) {
      const tg = splitTop(m[1]), vs = splitTop(m[2]);
      const asts = vs.map(parse), vals = asts.map(a => ev(a, env));   // tout est calculé AVANT de ranger
      const old = { ...env };
      tg.forEach((n, k) => { if (!(n in env)) order.push(n); env[n] = vals[k]; });
      const parts = tg.map((n, k) => {
        const a = asts[k], calc = a.t === 'num' ? '' : (a.t === 'var' ? `la valeur de <code>${a.n}</code>, c’est-à-dire ` : `<code>${esc(pr(a, old))}</code> = `);
        const lost = n in old && old[n].v !== vals[k].v ? ` (l’ancienne valeur ${repr(old[n])} est effacée)` : '';
        return `<code>${n}</code> prend ${calc}<b>${repr(vals[k])}</b>${lost}`;
      });
      let x = parts.join(' et ') + '.';
      if (tg.length > 1) x = 'Affectation simultanée : Python calcule d’abord toutes les valeurs à droite du <code>=</code>, puis les range. ' + x;
      else if (asts[0].t !== 'num' && asts[0].t !== 'var' && JSON.stringify(asts[0]).includes(`"n":"${tg[0]}"`)) x = `On calcule d’abord le membre de droite avec l’<em>ancienne</em> valeur de <code>${tg[0]}</code>, puis on range le résultat. ` + x;
      steps.push({ line: i, env: { ...env }, order: order.slice(), chg: tg, out: out.slice(), x });
      return;
    }
    throw new Error('ligne non reconnue : ' + l);
  });
  return { steps, out };
}

/* =====================================================================
   3. Coloration et encadrés Script / Console
   ===================================================================== */
const KW = new Set(['def', 'return', 'print', 'if', 'else', 'elif', 'for', 'while', 'in', 'range', 'import', 'from', 'and', 'or', 'not', 'True', 'False', 'None']);
function hl(line) {
  let h = '', m; const re = /(#.*$)|('[^']*'|"[^"]*")|([A-Za-z_]\w*)|(\d+\.?\d*)|(\*\*|[-+*/=<>%:])|(\s+)|(.)/g;
  while ((m = re.exec(line))) {
    if (m[1]) h += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) h += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) h += KW.has(m[3]) ? `<span class="k">${m[3]}</span>` : m[3];
    else if (m[4]) h += m[4];

// Script : opts.cur = ligne courante, opts.marks = {n° de ligne: classe}
function scriptHTML(src, opts = {}) {

}
// Console : lignes « >>> ... » colorées, sorties en blanc
function consoleHTML(lines, tab = 'Console') {

    if (l.startsWith('>>>')) return `<span class="l"><span class="o">&gt;&gt;&gt;</span> ${hl(l.slice(4))}</span>`;

}

/* =====================================================================
   4. Le vrai Python (Pyodide dans un worker, chargé au premier clic)
   ===================================================================== */
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/';
const PY_AIDE = String.raw`
import sys, io, traceback
def __fmt(e):
    if isinstance(e, SyntaxError):
        return ''.join(traceback.format_exception_only(type(e), e)).rstrip()
    tb = [f for f in traceback.extract_tb(e.__traceback__) if f.filename.startswith('<')]
    t = 'Traceback (most recent call last):\n' + ''.join(traceback.format_list(tb)) + ''.join(traceback.format_exception_only(type(e), e))
    return t.rstrip()
def __run(src, cmds):
    ns = {'__name__': '__main__'}
    vieux = sys.stdout
    buf = io.StringIO(); sys.stdout = buf
    res = {'out': '', 'err': None, 'cmds': []}
    try:
        try:
            exec(compile(src, '<script>', 'exec'), ns)
        except BaseException as e:
            res['err'] = __fmt(e)
        res['out'] = buf.getvalue()
        for c in cmds:
            buf = io.StringIO(); sys.stdout = buf
            r = {'cmd': c, 'val': None, 'err': None}
            try:
                try:
                    code = compile(c, '<console>', 'eval')
                    v = eval(code, ns)
                    if v is not None:
                        r['val'] = repr(v)
                except SyntaxError:
                    exec(compile(c, '<console>', 'exec'), ns)
            except BaseException as e:
                r['err'] = __fmt(e)
            r['out'] = buf.getvalue()
            res['cmds'].append(r)
    finally:
        sys.stdout = vieux
    return res
`;
const WORKER_SRC = `importScripts(${JSON.stringify(PYODIDE + 'pyodide.js')});
var pret = loadPyodide({ indexURL: ${JSON.stringify(PYODIDE)} }).then(function (p) { p.runPython(${JSON.stringify(PY_AIDE)}); postMessage({ type: 'pret' }); return p; },
  function (e) { postMessage({ type: 'echec', t: String(e) }); });
onmessage = async function (e) {
  var p = await pret;
  p.globals.set('__src', e.data.src); p.globals.set('__cmds', p.toPy(e.data.cmds));
  var r = p.runPython('__run(__src, __cmds)');

const Py = (() => {

    const t = setTimeout(() => { if (!loaded && onState) onState('Chargement de Python… (quelques secondes la première fois)'); }, 150);
    try { await ready; } finally { loaded = true; clearTimeout(t); }
    if (onState) onState('');
    const id = ++n;
    return new Promise((ok, ko) => {
      const lim = setTimeout(() => { wait.delete(id); w.terminate(); w = null; ko(new Error('Le programme met trop de temps (boucle sans fin ?). Python a été relancé.')); }, 6000);
      wait.set(id, r => { clearTimeout(lim); ok(r); });

// Résultat de Py.run → lignes de console
function consoleLines(r) {

    if (c.out) c.out.replace(/\n$/, '').split('\n').forEach(x => L.push(x));
    if (c.val !== null && c.val !== undefined) L.push(c.val);
    if (c.err) c.err.split('\n').forEach(x => L.push('!' + x));

// Comparaison de deux affichages Python : 'ok' | 'presque' | 'ko'

/* Fonctions à écrire (exercices 4 à 7) : tests calculés par le mini-Python */
function fnTests(expr, params, valeurs) {
  return valeurs.map(vs => {
    const env = {}; params.forEach((p, k) => { env[p] = typeof vs[k] === 'number' && !Number.isInteger(vs[k]) ? F(vs[k]) : I(vs[k]); });
    return [`${expr.nom}(${vs.join(', ')})`, repr(evalPy(expr.corps, env))];
  });
}
const numPy = x => (Number.isInteger(x) ? I(x) : F(x));
function valPy(corps, params, vs) {
  const env = {}; params.forEach((p, k) => { env[p] = numPy(vs[k]); });
  return repr(evalPy(corps, env));
}
// Question « f(…) renvoie ? »
function itCall(l, nom, corps, params, vs, ans, extra = {}) {
  const call = `${nom}(${vs.join(', ')})`, w = valPy(corps, params, vs);
  const env = {}; params.forEach((p, k) => { env[p] = numPy(vs[k]); });
  const sub = pr(parse(corps), env);
  const st = calcSteps(sub);
  return { l, q: `${pyc(call)} renvoie ?`, res: pyc(w),
    steps: [{ h: `<div class="chain">${esc(call)} → ${esc(corps)} avec ${params.map((p, k) => `${p} = ${vs[k]}`).join(', ')}</div>`, x: 'On remplace chaque paramètre par la valeur donnée dans l’appel.' },
      { h: `<div class="chain">${esc(sub)}</div>`, x: 'L’expression à calculer.' }].concat(st.steps),
    ans: ans ? { fields: [{ lab: 'renvoie', want: w, kind: 'py' }] } : null, ...extra };
}

/* ----------------------- Exercice 8 : programme mystère ----------------------- */
function mystereTex(a, b, c) {
  const p = (v) => (v < 0 ? `-${fr(-v)}` : `+${fr(v)}`);
  return `(x${p(a)})^2-(x${p(b)})^2-${c === 1 ? '' : fr(c)}x`;
}
function mystereSteps(a, b, c) {
  const p = v => (v < 0 ? `-${fr(-v)}` : `+${fr(v)}`);
  const sq = v => `x^2${p(2 * v).replace(/^\+/, '+')}x${p(v * v)}`;
  return [
    { m: `(x${p(a)})^2=x^2+2\\times x\\times ${a < 0 ? `(${fr(a)})` : fr(a)}+${a < 0 ? `(${fr(a)})` : fr(a)}^2=${sq(a)}`, x: 'Identité remarquable \\((a+b)^2=a^2+2ab+b^2\\) (ou double distributivité).' },
    { m: `(x${p(b)})^2=${sq(b)}`, x: 'Même calcul pour la deuxième parenthèse.' },
    { m: `(x${p(a)})^2-(x${p(b)})^2-${fr(c)}x=${sq(a)}-(${sq(b)})-${fr(c)}x`, x: 'On remplace, en gardant des parenthèses : le signe \\(-\\) s’applique à tout le carré.' },
    { m: `=x^2${p(2 * a)}x${p(a * a)}-x^2${p(-2 * b)}x${p(-b * b)}-${fr(c)}x`, x: 'Le signe \\(-\\) devant la parenthèse change le signe de chaque terme.' },
    { m: `=${fr(a * a - b * b)}`, x: `Les \\(x^2\\) s’éliminent, les \\(x\\) aussi : \\(${fr(2 * a)}-${2 * b < 0 ? `(${fr(2 * b)})` : fr(2 * b)}-${fr(c)}=0\\). Il reste \\(${fr(a * a)}-${b * b < 0 ? `(${fr(b * b)})` : fr(b * b)}=${fr(a * a - b * b)}\\).` },
  ];
}

    <article class="exo">
      <div class="exo-h"><span class="pill">Exercice ${ex.n}</span><span class="stars">${ex.stars}</span><span class="titre-ex">${ex.titre}</span><span class="comp">${ex.comp}</span></div>
      <div class="exo-b">
        <p class="consigne">${ex.consigne}</p>
        <div class="tools">
          <button type="button" class="btn" data-rappel>Rappel</button>
          <button type="button" class="btn ghost" data-res>Réponses seules</button>
          <button type="button" class="btn green" data-train>↻ Nouvelles valeurs pour s’entraîner</button>
        </div>
        <div class="rappel" hidden>${ex.rappel.map(b => `<div><h3>${b.t}</h3>${b.h}</div>`).join('')}<div class="att"><h3>Règles d’or</h3>${ATT}</div></div>
        <div class="sheet"><h2 class="part">Corrigé du TP <small>« Correction détaillée » pour suivre étape par étape, « ▶ » pour exécuter le vrai Python</small></h2>${itemsBlock(set, 's', ex)}</div>
        <div class="train" hidden></div>
      </div>
    </article>
    <nav class="foot">${ex.n > 1 ? `<button type="button" class="btn ghost" data-go="${ex.n - 1}">← Exercice ${ex.n - 1}</button>` : '<span></span>'}${ex.n < EX.length ? `<button type="button" class="btn ghost" data-go="${ex.n + 1}">Exercice ${ex.n + 1} →</button>` : ''}</nav>`;
  wireBlock($('.sheet', app), set, 's');
  const rap = $('.rappel', app), bRap = $('[data-rappel]', app);
  bRap.addEventListener('click', () => { rap.hidden = !rap.hidden; bRap.classList.toggle('on', !rap.hidden); if (!rap.hidden) typeset(rap); });
  const bRes = $('[data-res]', app), body = $('.exo-b', app);
  bRes.addEventListener('click', () => { body.classList.toggle('showres'); bRes.classList.toggle('on'); });
  const tr = $('.train', app);
  $('[data-train]', app).addEventListener('click', () => {
    const fresh = ex.build(true), pre = `t${++train}`;
    tr.hidden = false;
    tr.innerHTML = `<h2 class="part">Entraînement : nouvelles valeurs <small>cherche d’abord sur ton cahier, écris ta réponse, puis vérifie</small></h2>
      <p class="aide">Écris ce que Python affiche, exactement comme lui : un point pour les nombres à virgule, et <code>.0</code> quand c’est un <em>float</em> (par exemple <code>7.0</code>). Le bouton « ▶ » vérifie dans le vrai Python.</p>${itemsBlock(fresh, pre, ex, true)}`;
    wireBlock(tr, fresh, pre);
    typeset(tr);
    tr.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = 'ex' + b.dataset.go; }));
  typeset(app);
  window.scrollTo(0, 0);
}
nav.innerHTML = EX.map(e => `<button type="button" data-n="${e.n}">Exercice ${e.n}</button>`).join('');
nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = 'ex' + b.dataset.n; }));
const route = () => render(+(location.hash.match(/^#ex(\d+)$/) || [])[1] || 1);
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
