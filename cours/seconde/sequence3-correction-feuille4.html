<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], packages: { '[+]': ['color'] } },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.min.js"></script>
<script>
'use strict';
const R = String.raw;

/* =====================================================================
   Outils de calcul littéral
   Un terme est un couple [coefficient, degré] ; une expression écrite
   est une liste de termes dans l'ordre d'écriture.
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const distinct = (n, a, b) => { const s = new Set(); while (s.size < n) s.add(ri(a, b)); return [...s]; };

// Couleurs (modèle rgb de MathJax) : une couleur par « famille » de termes
const RGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => (v / 255).toFixed(3)).join(','); };
const col = (hex, s) => `{\\color[rgb]{${RGB(hex)}}{${s}}}`;
const FAM = { 3: '#0C8599', 2: '#7048E8', 1: '#1C7ED6', 0: '#D9480F' };
const KC = '#C2255C';          // facteur distribué ou facteur commun
const AC = '#0C8599', BC = '#D9480F';   // a et b dans les identités remarquables
const famName = (d, v) => d === 0 ? 'des nombres' : d === 1 ? `des \\(${v}\\)` : `des \\(${v}^{${d}}\\)`;

// Terme sans son signe : 3x, x², 12…
function body(c, d, v = 'x') {
  const a = Math.abs(c);
  if (d === 0) return String(a);
  return (a === 1 ? '' : a) + (d === 1 ? v : `${v}^{${d}}`);
}
const mono = (c, d, v = 'x') => (c < 0 ? '-' : '') + body(c, d, v);
// Facteur dans un produit : parenthèses si négatif (sauf en tête d'écriture)
const fac = (c, d, v = 'x', lead = false) => (c < 0 && !lead ? `(${mono(c, d, v)})` : mono(c, d, v));
// Suite de termes : 3x^2-x+5 ; colorFn(t) renvoie une couleur ou null
function seq(terms, v = 'x', colorFn = null) {
  if (!terms.length) return '0';
  return terms.map(([c, d], i) => {
    const sign = c < 0 ? '-' : (i ? '+' : '');
    const b = body(c, d, v), k = colorFn && colorFn([c, d], i);
    return sign + (k ? col(k, b) : b);
  }).join('');
}
// Polynôme réduit (termes ordonnés par degrés décroissants)
function reduce(terms) {
  const p = {};
  terms.forEach(([c, d]) => { p[d] = (p[d] || 0) + c; });
  return Object.keys(p).map(Number).sort((a, b) => b - a).filter(d => p[d] !== 0).map(d => [p[d], d]);
}
const ptex = (terms, v = 'x') => seq(reduce(terms), v);
const mul = ([c1, d1], [c2, d2]) => [c1 * c2, d1 + d2];
const neg = terms => terms.map(([c, d]) => [-c, d]);
const scale = (terms, k) => terms.map(([c, d]) => [c * k, d]);
const same = (a, b) => a.replace(/\s/g, '') === b.replace(/\s/g, '');
const par = (terms, v = 'x') => terms.length > 1 || terms[0][0] < 0 ? `(${seq(terms, v)})` : seq(terms, v);

/* Réduction « famille par famille » : liste d'étapes à partir de termes écrits.
   Renvoie aussi le résultat. Les étapes inutiles sont omises. */
function reduceSteps(terms, v = 'x') {
  const steps = [], fin = reduce(terms);
  const degs = [...new Set(terms.map(t => t[1]))].sort((a, b) => b - a);
  const like = degs.filter(d => terms.filter(t => t[1] === d).length > 1);
  const colorFn = t => FAM[t[1]] || null;
  if (like.length) {
    const grouped = degs.flatMap(d => terms.filter(t => t[1] === d));
    if (!same(seq(grouped, v), seq(terms, v))) {
      steps.push({ m: seq(grouped, v, colorFn), x: `On regroupe les termes de la même famille : ${like.map(d => famName(d, v)).join(', ')}${degs.length > like.length ? ' (les autres termes restent seuls)' : ''}.` });
    }
    // somme des coefficients, famille par famille
    const parts = degs.map((d, i) => {
      const ts = terms.filter(t => t[1] === d);
      if (ts.length === 1) { const [c] = ts[0]; return (c < 0 ? '-' : (i ? '+' : '')) + col(FAM[d], body(c, d, v)); }
      const cs = ts.map(t => t[0]).map((c, j) => (c < 0 ? '-' : (j ? '+' : '')) + Math.abs(c)).join('');
      if (d === 0) return (i ? '+' : '') + col(FAM[d], `(${cs})`);
      return (i ? '+' : '') + col(FAM[d], `(${cs})${d === 1 ? v : `${v}^{${d}}`}`);
    });
    const zero = like.filter(d => terms.filter(t => t[1] === d).reduce((s, t) => s + t[0], 0) === 0);
    steps.push({ m: parts.join(''), x: `On additionne les coefficients de chaque famille${zero.length ? ` ; ici ${zero.map(d => (d === 0 ? 'les nombres' : `les termes en ${famName(d, v).slice(4)}`)).join(' et ')} s’éliminent (la somme fait 0)` : ''}.` });
    steps.push({ m: seq(fin, v), x: 'On écrit le résultat réduit, du plus grand exposant au plus petit.' });
  } else if (!same(seq(fin, v), seq(terms, v))) {
    steps.push({ m: seq(fin, v), x: 'On ordonne : du plus grand exposant au plus petit.' });
  }
  return { steps, fin };
}

/* =====================================================================
   Constructeurs d'items : { l, q, res, steps:[{m|e|h|svg, x}], piege? }
   m : « L = … » ; e : égalité complète ; h : texte ; svg : figure.
   ===================================================================== */

// Exercice 1 : réduire une somme
function itReduce(l, terms, v = 'x') {
  const { steps, fin } = reduceSteps(terms, v);
  return { l, q: seq(terms, v), res: seq(fin, v), steps };
}
// Exercice 1 : produit de deux monômes
function itProd(l, t1, t2, v = 'x') {
  const r = mul(t1, t2);
  return { l, q: `${fac(...t1, v, true)}\\times${fac(...t2, v)}`, res: mono(...r, v), steps: [
    { m: `${col(FAM[0], fac(t1[0], 0, v, true))}\\times${col(FAM[0], fac(t2[0], 0, v))}\\times${col(FAM[1], v)}\\times${col(FAM[1], v)}`, x: 'On multiplie les nombres entre eux et les lettres entre elles.' },
    { m: mono(...r, v), x: `\\(${fac(t1[0], 0, v, true)}\\times${fac(t2[0], 0, v)}=${r[0]}\\) et \\(${v}\\times ${v}=${v}^2\\).` }
  ] };
}

// Exercice 2 : simple distributivité. parts = [{k:[c,d], f:[termes]}]
function partTex(p, i, v) {
  const [c, d] = p.k;
  let k = c === 1 && d === 0 ? '' : c === -1 && d === 0 ? '-' : mono(c, d, v);
  if (i && c > 0) k = '+' + k;
  return `${k}(${seq(p.f, v)})`;
}
function itDist(l, parts, v = 'x') {
  const q = parts.map((p, i) => partTex(p, i, v)).join('');
  const prods = [], dev = [];
  const onlyMinus = parts.length === 1 && parts[0].k[0] === -1 && parts[0].k[1] === 0;
  parts.forEach((p, i) => p.f.forEach((t, j) => {
    const lead = i === 0 && j === 0;
    const kt = col(KC, fac(...p.k, v, lead));
    prods.push((lead ? '' : '+') + `${kt}\\times${fac(...t, v)}`);
    dev.push(mul(p.k, t));
  }));
  const steps = [];
  if (onlyMinus) {
    steps.push({ m: seq(dev, v), x: 'Un signe \\(-\\) devant une parenthèse : on la supprime en changeant le signe de chaque terme (c’est multiplier par \\(-1\\)).' });
  } else {
    steps.push({ m: prods.join(''), x: parts.length > 1 ? 'On distribue chaque facteur (en couleur) à chaque terme de sa parenthèse.' : 'On distribue le facteur (en couleur) à chaque terme de la parenthèse.' });
    steps.push({ m: seq(dev, v), x: 'On calcule chaque produit en appliquant la règle des signes.' });
  }
  const r = reduceSteps(dev, v);
  return { l, q, res: seq(r.fin, v), steps: steps.concat(r.steps) };
}

// Exercice 3 : factoriser par un facteur commun (monôme)
function itFacto(l, terms, v = 'x') {
  const g = terms.reduce((s, t) => gcd(s, t[0]), 0), m = Math.min(...terms.map(t => t[1]));
  const s = terms[0][0] < 0 ? -1 : 1, k = [s * g, m];
  const inner = terms.map(([c, d]) => [c / (s * g), d - m]);
  const kt = mono(...k, v);
  const rew = inner.map((t, i) => {
    const K = col(KC, i ? fac(...k, v) : mono(...k, v));
    if (k[0] > 0 && t[0] < 0) return `-${K}\\times${body(...t, v)}`;
    return (i ? '+' : '') + `${K}\\times${fac(...t, v)}`;
  }).join('');
  const why = [];
  if (g > 1) why.push(`\\(${g}\\) divise ${terms.map(t => `\\(${Math.abs(t[0])}\\)`).join(' et ')}`);
  if (m > 0) why.push(`\\(${m === 1 ? v : `${v}^{${m}}`}\\) est dans chaque terme`);
  if (s < 0) why.push('on met aussi le signe \\(-\\) en facteur pour que la parenthèse commence par un terme positif');
  const res = `${kt === '-1' ? '-' : kt}(${seq(inner, v)})`;
  return { l, q: seq(terms, v), res, steps: [
    { m: rew, x: `Le facteur commun est \\(${kt}\\) : ${why.join(' ; ')}. On écrit chaque terme comme un produit par \\(${kt}\\).` },
    { m: res, x: 'On met le facteur commun devant, et dans la parenthèse ce qui reste de chaque terme.' },
    { h: `<span class="x">Vérification : en redéveloppant \\(${res}\\), on retrouve bien \\(${seq(terms, v)}\\).</span>` }
  ] };
}

// Exercice 3 (plus loin) : facteur commun entre parenthèses.
// A : termes du facteur commun ; parts : [{s:±1, B:termes, form:'AB'|'kA'|'A2'}]
function itFactoBin(l, A, parts, v = 'x') {
  const At = `(${seq(A, v)})`, Ac = col(KC, At);
  const q = parts.map((p, i) => {
    const sg = p.s < 0 ? '-' : (i ? '+' : '');
    if (p.form === 'A2') return `${sg}${At}^2`;
    if (p.form === 'kA') return `${sg}${seq(p.B, v)}${At}`;
    return `${sg}${At}(${seq(p.B, v)})`;
  }).join('');
  const rew = parts.map((p, i) => {
    const sg = p.s < 0 ? '-' : (i ? '+' : '');
    if (p.form === 'A2') return `${sg}${Ac}\\times${At}`;
    if (p.form === 'kA') return `${sg}${Ac}\\times${seq(p.B, v)}`;
    return `${sg}${Ac}\\times(${seq(p.B, v)})`;
  }).join('');
  const Bs = parts.map(p => (p.form === 'A2' ? A : p.B));
  const brack = Bs.map((B, i) => (parts[i].s < 0 ? '-' : (i ? '+' : '')) + (B.length > 1 ? `(${seq(B, v)})` : seq(B, v))).join('');
  const flat = Bs.flatMap((B, i) => (parts[i].s < 0 ? neg(B) : B));
  const red = reduce(flat);
  const steps = [
    { m: rew, x: `Le facteur commun est \\(${At}\\)${parts.some(p => p.form === 'A2') ? ` (on écrit \\(${At}^2=${At}\\times${At}\\))` : ''}.` },
    { m: `${At}\\big[${brack}\\big]`, x: 'On met le facteur commun devant ; dans le crochet, on écrit ce qui reste de chaque terme.' }
  ];
  if (parts.some(p => p.s < 0)) steps.push({ m: `${At}(${seq(flat, v)})`, x: 'On supprime les parenthèses dans le crochet : le signe \\(-\\) change le signe de chaque terme de la parenthèse qui suit.' });
  steps.push({ m: `${At}(${seq(red, v)})`, x: 'On réduit ce qu’il y a dans la seconde parenthèse.' });
  let res = `${At}(${seq(red, v)})`;
  const g = red.reduce((s, t) => gcd(s, t[0]), 0);
  if (g > 1 && red.length > 1) {
    const r2 = scale(red, 1 / g);
    steps.push({ m: `${g}${At}(${seq(r2, v)})`, x: `Pour aller encore plus loin : \\(${g}\\) est un facteur commun dans \\(${seq(red, v)}\\).` });
    res += `=${g}${At}(${seq(r2, v)})`;
  }
  return { l, q, res, steps };
}

// Développement d'un produit de deux parenthèses (renvoie étapes + termes)
const DCOL = ['#7048E8', '#D9480F', '#0C8599'];
function prodDev(F1, F2, v = 'x') {
  const prods = [], dev = [];
  F1.forEach((a, i) => F2.forEach((b, j) => {
    const lead = i === 0 && j === 0;
    prods.push((lead ? '' : '+') + `${col(DCOL[i % 3], fac(...a, v, lead))}\\times${fac(...b, v)}`);
    dev.push(mul(a, b));
  }));
  return { prods: prods.join(''), dev };
}
// Identité remarquable : a, b termes positifs ; kind '+', '-', 'diff'
function idTex(a, b, kind, v = 'x', swap = false) {
  const A = mono(...a, v), B = mono(...b, v);
  if (kind === '+') return `(${A}+${B})^2`;
  if (kind === '-') return `(${A}-${B})^2`;
  return swap ? `(${A}-${B})(${A}+${B})` : `(${A}+${B})(${A}-${B})`;
}
const sqTex = (t, v = 'x') => (t[1] === 0 ? `${t[0]}^2` : t[0] === 1 && t[1] === 1 ? `${v}^2` : `(${mono(...t, v)})^2`);
function idDev(a, b, kind) {
  const a2 = mul(a, a), b2 = mul(b, b), ab = mul([2 * a[0], a[1]], b);
  if (kind === 'diff') return [a2, neg([b2])[0]];
  return [a2, kind === '+' ? ab : neg([ab])[0], b2];
}
const ID_NAME = { '+': '(a+b)^2=a^2+2ab+b^2', '-': '(a-b)^2=a^2-2ab+b^2', diff: '(a+b)(a-b)=a^2-b^2' };
function idSubst(a, b, kind, v = 'x') {
  const A = col(AC, mono(...a, v)), B = col(BC, mono(...b, v));
  const sA = col(AC, sqTex(a, v)), sB = col(BC, sqTex(b, v));
  if (kind === 'diff') return `${sA}-${sB}`;
  return `${sA}${kind === '+' ? '+' : '-'}2\\times${A}\\times${B}+${sB}`;
}
const abText = (a, b, v = 'x') => `\\(a=${col(AC, mono(...a, v))}\\) et \\(b=${col(BC, mono(...b, v))}\\)`;

// Exercice 4 : double distributivité
function itDouble(l, F1, F2, v = 'x') {
  const { prods, dev } = prodDev(F1, F2, v);
  const r = reduceSteps(dev, v);
  return { l, q: `(${seq(F1, v)})(${seq(F2, v)})`, res: seq(r.fin, v), steps: [
    { m: prods, x: 'On multiplie chaque terme de la première parenthèse (en couleur) par chaque terme de la seconde.' },
    { m: seq(dev, v), x: 'On calcule chaque produit (règle des signes ; \\(x\\times x=x^2\\)).' }
  ].concat(r.steps) };
}

// Exercice 7 : développer avec une identité remarquable
function itId(l, a, b, kind, v = 'x', swap = false) {
  const dev = idDev(a, b, kind), fin = reduce(dev);
  const steps = [
    { h: `On reconnaît \\(${ID_NAME[kind]}\\) avec ${abText(a, b, v)}.` },
    { m: idSubst(a, b, kind, v), x: `On remplace \\(a\\) et \\(b\\) dans \\(${ID_NAME[kind].split('=')[1]}\\).` },
    { m: seq(dev, v), x: 'On calcule : attention, le carré porte sur le nombre <em>et</em> sur la lettre.' }
  ];
  if (!same(seq(fin, v), seq(dev, v))) steps.push({ m: seq(fin, v), x: 'On ordonne : du plus grand exposant au plus petit.' });
  return { l, q: idTex(a, b, kind, v, swap), res: seq(fin, v), steps,
    piege: kind !== 'diff' ? `\\(${idTex(a, b, kind, v)}\\neq ${sqTex(a, v)}${kind === '+' ? '+' : '-'}${sqTex(b, v)}\\) : il ne faut pas oublier le double produit.` : null };
}

// Exercices 4 et 7 (plus loin) : somme de produits. parts : [{s, k, type:'prod'|'id', ...}]
function partDev(p) { return p.type === 'prod' ? prodDev(p.F1, p.F2).dev : idDev(p.a, p.b, p.kind); }
function partQ(p, i, v = 'x') {
  const sg = p.s < 0 ? '-' : (i ? '+' : '');
  const k = p.k && p.k !== 1 ? p.k : '';
  return sg + k + (p.type === 'prod' ? `(${seq(p.F1, v)})(${seq(p.F2, v)})` : idTex(p.a, p.b, p.kind, v, p.swap));
}
function itSum(l, parts, v = 'x') {
  const q = parts.map((p, i) => partQ(p, i, v)).join('');
  const devs = parts.map(p => reduce(partDev(p)));
  const notes = parts.map((p, i) => `\\(${partQ(Object.assign({}, p, { s: 1, k: 1 }), 0, v)}=${seq(devs[i], v)}\\)`);
  const keep = p => p.s < 0 || (p.k && p.k !== 1);
  const line = parts.map((p, i) => {
    const sg = p.s < 0 ? '-' : (i ? '+' : '');
    const k = p.k && p.k !== 1 ? p.k : '';
    return keep(p) ? `${sg}${k}(${seq(devs[i], v)})` : sg + seq(devs[i], v);
  }).join('');
  const flat = parts.flatMap((p, i) => scale(devs[i], (p.s < 0 ? -1 : 1) * (p.k || 1)));
  const steps = [{ m: line, x: `On développe chaque morceau séparément, <em>en gardant les parenthèses</em> quand il y a un signe \\(-\\) ou un nombre devant : ${notes.join(' ; ')}.` }];
  if (parts.some(keep)) steps.push({ m: seq(flat, v), x: parts.some(p => p.k && p.k !== 1) ? 'On supprime les parenthèses en distribuant le nombre (avec son signe) à chaque terme.' : 'On supprime les parenthèses précédées d’un signe \\(-\\) : on change le signe de chaque terme.' });
  const r = reduceSteps(flat, v);
  return { l, q, res: seq(r.fin, v), steps: steps.concat(r.steps),
    piege: parts.some(p => p.s < 0) ? 'Les parenthèses sont indispensables : le signe \\(-\\) s’applique à <em>tout</em> le développement, pas seulement au premier terme.' : null };
}

// Exercice 6 : reconnaître (forme développée non demandée)
const FORM6 = { '+': '(a+b)^2', '-': '(a-b)^2', diff: '(a+b)(a-b)' };
function itRecoProd(a, b, kind, swap = false, v = 'x') {
  const why = kind === 'diff' ? 'C’est un produit de deux parenthèses qui contiennent les <em>mêmes</em> termes, l’une avec \\(+\\), l’autre avec \\(-\\).'
    : `C’est le carré d’une ${kind === '+' ? 'somme' : 'différence'}.`;
  return { l: '', q: idTex(a, b, kind, v, swap), res: `\\(${FORM6[kind]}\\) ; \\(a=${mono(...a, v)}\\) ; \\(b=${mono(...b, v)}\\)`, resHTML: true, steps: [
    { h: `${why} On coche \\(${FORM6[kind]}\\).` },
    { h: `${kind === 'diff' ? 'Le terme commun aux deux parenthèses est \\(a\\), celui qui change de signe est \\(b\\)' : 'Le premier terme est \\(a\\), le second est \\(b\\)'} : ${abText(a, b, v)}.` }
  ] };
}

// Exercices 8 et 9 : reconnaître une forme développée. terms : ordre d'écriture
const FORM8 = { '+': 'a^2+2ab+b^2', '-': 'a^2-2ab+b^2', diff: 'a^2-b^2' };
function sqWhy(t, v = 'x') {
  const sq = mul(t, t), s = mono(...sq, v);
  if (t[1] === 0) return `\\(${s}=${t[0]}^2\\)`;
  if (t[0] === 1) return `\\(${s}\\) est le carré de \\(${v}\\)`;
  return `\\(${s}=(${mono(...t, v)})^2\\)`;
}
function recoSteps(terms, a, b, kind, v = 'x') {
  const steps = [];
  if (kind === 'diff') {
    steps.push({ h: `Deux termes séparés par un signe \\(-\\), et ce sont deux carrés : ${sqWhy(a, v)} et ${sqWhy(b, v)}. C’est la forme \\(${FORM8.diff}\\).` });
  } else {
    const ab = mul([2 * a[0], a[1]], b);
    steps.push({ h: `Trois termes, dont deux carrés : ${sqWhy(a, v)} et ${sqWhy(b, v)}.` });
    steps.push({ h: `On vérifie le double produit : \\(2\\times${fac(...a, v)}\\times${fac(...b, v)}=${mono(...ab, v)}\\), et il est précédé du signe \\(${kind}\\). C’est la forme \\(${FORM8[kind]}\\).` });
  }
  return steps;
}
function itReco8(terms, a, b, kind, v = 'x') {
  const steps = recoSteps(terms, a, b, kind, v);
  const swapNote = kind === '+' && a[1] === 0 && b[1] > 0 ? ` (on peut aussi prendre \\(a=${mono(...b, v)}\\) et \\(b=${mono(...a, v)}\\))` : '';
  steps.push({ h: `Donc ${abText(a, b, v)}${swapNote}.` });
  return { l: '', q: seq(terms, v), res: `\\(${FORM8[kind]}\\) ; \\(a=${mono(...a, v)}\\) ; \\(b=${mono(...b, v)}\\)`, resHTML: true, steps };
}
function itFactoId(l, terms, a, b, kind, v = 'x') {
  const steps = recoSteps(terms, a, b, kind, v);
  steps.push({ m: idSubst(a, b, kind, v), x: `On écrit l’expression sous la forme \\(${FORM8[kind]}\\) avec ${abText(a, b, v)}.` });
  const A = mono(...a, v), B = mono(...b, v);
  const res = kind === 'diff' ? `(${A}+${B})(${A}-${B})` : `(${A}${kind}${B})^2`;
  steps.push({ m: res, x: `On applique \\(${FORM8[kind]}=${kind === 'diff' ? '(a+b)(a-b)' : `(a${kind}b)^2`}\\).` });
  let extra = '';
  if (kind === '-' && a[1] === 0 && b[1] > 0) extra = `=(${B}-${A})^2`;
  if (extra) steps.push({ h: `<span class="x">On peut aussi écrire \\(${res}${extra}\\) : un carré ne change pas quand on change le signe de ce qui est entre parenthèses.</span>` });
  return { l, q: seq(terms, v), res: res + extra, steps };
}
// Exercice 9 (plus loin) : A² − B² avec A, B des expressions
function itDiffSq(l, A, B, qTex, Bnum, v = 'x') {
  const At = A.length > 1 ? `(${seq(A, v)})` : seq(A, v), Bt = B.length > 1 ? `(${seq(B, v)})` : seq(B, v);
  const sum = reduce(A.concat(B)), dif = reduce(A.concat(neg(B)));
  const steps = [];
  if (Bnum) steps.push({ m: `${At}^2-${Bt}^2`, x: `\\(${Bnum}=${Bt}^2\\) : on reconnaît \\(a^2-b^2\\) avec \\(a=${col(AC, At)}\\) et \\(b=${col(BC, Bt)}\\).` });
  else steps.push({ h: `On reconnaît \\(a^2-b^2\\) avec \\(a=${col(AC, At)}\\) et \\(b=${col(BC, Bt)}\\).` });
  steps.push({ m: `\\big[${col(AC, At)}+${col(BC, Bt)}\\big]\\big[${col(AC, At)}-${col(BC, Bt)}\\big]`, x: 'On applique \\(a^2-b^2=(a+b)(a-b)\\), en gardant les parenthèses.' });
  steps.push({ m: `(${seq(A.concat(B), v)})(${seq(A.concat(neg(B)), v)})`, x: B.length > 1 ? 'On supprime les parenthèses : le signe \\(-\\) change le signe de chaque terme de \\(b\\).' : 'On supprime les parenthèses.' });
  steps.push({ m: `(${seq(sum, v)})(${seq(dif, v)})`, x: 'On réduit chaque parenthèse.' });
  return { l, q: qTex, res: `(${seq(sum, v)})(${seq(dif, v)})`, steps,
    piege: B.length > 1 ? 'Dans le second facteur, le \\(-\\) porte sur <em>tous</em> les termes de \\(b\\).' : null };
}
function itFactoK(l, k, m, v = 'x') {   // k x² − k m²
  return { l, q: `${k}${v}^2-${k * m * m}`, res: `${k}(${v}+${m})(${v}-${m})`, steps: [
    { m: `${col(KC, k)}(${v}^2-${m * m})`, x: `On commence par le facteur commun \\(${k}\\) : \\(${k * m * m}=${k}\\times${m * m}\\).` },
    { m: `${k}(${col(AC, `${v}^2`)}-${col(BC, `${m}^2`)})`, x: `Dans la parenthèse, on reconnaît \\(a^2-b^2\\) avec \\(a=${col(AC, v)}\\) et \\(b=${col(BC, m)}\\).` },
    { m: `${k}(${v}+${m})(${v}-${m})`, x: 'On applique \\(a^2-b^2=(a+b)(a-b)\\), et on garde le facteur \\(' + k + '\\) devant.' }
  ] };
}

const FC = { A1: '#008080', A4: '#E6FFFF', B1: '#99003D', B4: '#FFF2F2', C1: '#800080', C4: '#F2DAF2', G1: '#00A86B', G4: '#E6FFF2', gris: '#CCCCCC' };
// Texte mathématique simple dans le SVG : x en italique, ^2 en exposant
function st(s) {
  return String(s).replace(/−/g, '-').split(/(\^2|x|-)/).filter(Boolean).map(p =>
    p === '^2' ? '<tspan dy="-6" font-size="70%">2</tspan><tspan dy="6"> </tspan>' : p === 'x' ? '<tspan font-style="italic">x</tspan>' : p === '-' ? ' − ' : p.replace(/\+/g, ' + ')).join('');
}
const U = 22;
function svgWrap(w, h, inner, ox = 40, oy = 30) {

}
function rect(x, y, w, h, fill, stroke, dash) { return `<rect x="${x * U}" y="${y * U}" width="${w * U}" height="${h * U}" fill="${fill}" stroke="${stroke}" stroke-width="2.6"${dash ? ' stroke-dasharray="5 4"' : ''}/>`; }

function cote(x1, y1, x2, y2, s, side) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const lx = side === 'left' ? mx - 0.35 : side === 'right' ? mx + 0.35 : mx;
  const ly = side === 'above' ? my - 0.55 : side === 'below' ? my + 0.6 : my;

  return `<line x1="${x1 * U}" y1="${y1 * U}" x2="${x2 * U}" y2="${y2 * U}" stroke="#1D2733" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>` + txt(lx, ly, s, an);
}
const DEFS = '<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 1 L2 5 L10 9" fill="none" stroke="#1D2733" stroke-width="1.6"/></marker></defs>';

function figDiff(a, b, gray, areas) {

{ n: 3, obj: null, stars: S1, comp: 'Calculer', consigne: 'Factoriser les expressions suivantes en repérant un facteur commun.', more: S2,

  build(f) {

        itFacto('C', [[1, 2], [sg() * ri(2, 9), 1]]),
        (() => { const g = ri(2, 5); return itFacto('D', [[g * d1, 2], [-g * d2, 1]]); })(),

{ n: 8, obj: [5, 'Factoriser avec une identité remarquable'], stars: S2, comp: 'Chercher', consigne: 'Cocher la forme d’identité remarquable reconnue, puis donner les valeurs de \\(a\\) et de \\(b\\) (on ne demande pas de factoriser).',
  rappel: [
    { t: 'Les trois formes développées', h: R`<p>\(a^2+2ab+b^2\) : trois termes, deux carrés et un double produit précédé de \(+\).</p><p>\(a^2-2ab+b^2\) : même chose, double produit précédé de \(-\).</p><p>\(a^2-b^2\) : deux carrés séparés par \(-\).</p>` },
    { t: 'Méthode', h: R`<p>1. On repère les carrés : \(25x^2=(5x)^2\), \(9=3^2\).</p><p>2. On vérifie le double produit : \(2\times5x\times3=30x\).</p>` }
  ],
  att: R`<p>Les termes ne sont pas toujours dans l’ordre : \(49+14x+x^2\) est de la forme \(a^2+2ab+b^2\).</p><p>\(x^2+49\) n’est <b>pas</b> une identité remarquable (il faut un \(-\)).</p>`,
  build(f) {
    if (!f) return { main: [itReco8([[1, 2], [-49, 0]], [1, 1], [7, 0], 'diff'), itReco8([[1, 2], [-12, 1], [36, 0]], [1, 1], [6, 0], '-'),
      itReco8([[25, 2], [-30, 1], [9, 0]], [5, 1], [3, 0], '-'), itReco8([[1, 0], [-16, 2]], [1, 0], [4, 1], 'diff'), itReco8([[49, 0], [14, 1], [1, 2]], [7, 0], [1, 1], '+')] };

      itReco8([[p * p, 2], [2 * p * q, 1], [q * q, 0]], [p, 1], [q, 0], '+'), itReco8([[1, 0], [-r * r, 2]], [1, 0], [r, 1], 'diff'),
      itReco8([[s * s, 0], [-2 * s, 1], [1, 2]], [s, 0], [1, 1], '-')].sort(() => Math.random() - .5) };
  } },

{ n: 9, obj: null, stars: S2, comp: 'Calculer', consigne: 'Factoriser les expressions suivantes à l’aide d’une identité remarquable.', more: S3,

function itemHTML(it, id) {
  const label = it.l ? (/^[A-Z]$/.test(it.l) ? `\\(${it.l}=\\)` : `<b>${it.l}</b>`) : '';
  const q = it.q ? `<span class="q">${label} \\(${it.q}\\)</span>` : `<span class="q">${label}</span>`;
  const res = it.resHTML ? it.res : `\\(${/^[A-Z]$/.test(it.l) ? it.l + '=' : ''}${it.res}\\)`;
  return `<div class="item" data-id="${id}">
    <div class="row">${q}<button type="button" class="btn sm" data-open>Correction détaillée</button></div>
    ${it.fig ? `<div class="qfig">${it.fig}</div>` : ''}
    <div class="resline">Réponse : <span class="res">${res}</span></div>
    <div class="corr" hidden><ol class="steps"></ol>
      <div class="step-ctrl"><button type="button" class="btn solid sm" data-next>Étape suivante</button><button type="button" class="btn ghost sm" data-all>Tout afficher</button><button type="button" class="btn ghost sm" data-reset hidden>Recommencer</button></div>
      <div class="end" hidden><div class="concl">Résultat : ${res}</div>${it.piege ? `<div class="piege" style="margin-top:8px"><b>Erreur à éviter :</b> ${it.piege}</div>` : ''}</div>
    </div></div>`;
}
function stepHTML(it, st, k) {
  const L = /^[A-Z]$/.test(it.l) ? it.l : '';
  let inner = '';
  if (st.svg) inner += `<div class="fig">${st.svg}</div>`;
  if (st.m) inner += `<div class="m">\\[${L ? L + '=' : '='}${st.m}\\]</div>`;
  if (st.e) inner += `<div class="m">\\[${st.e}\\]</div>`;
  if (st.h) inner += `<div class="h">${st.h}</div>`;
  if (st.x) inner += `<div class="x">${st.x}</div>`;
  return `<span class="n">${k}</span><div>${inner}</div>`;
}
function wireItem(el, it) {
  const corr = $('.corr', el), ol = $('.steps', corr), end = $('.end', corr);
  const bN = $('[data-next]', corr), bA = $('[data-all]', corr), bR = $('[data-reset]', corr);
  let k = 0;
  const add = () => { const li = document.createElement('li'); li.className = 'step'; li.innerHTML = stepHTML(it, it.steps[k], k + 1); k++; ol.appendChild(li); typeset(li); };
  const sync = () => { const fin = k >= it.steps.length; bN.hidden = fin; bA.hidden = fin; bR.hidden = !fin; end.hidden = !fin; if (fin) typeset(end); };
  $('[data-open]', el).addEventListener('click', e => {
    const open = corr.hidden;
    corr.hidden = !open; el.classList.toggle('open', open);
    e.currentTarget.textContent = open ? 'Masquer la correction' : 'Correction détaillée';
    if (open && k === 0) { add(); sync(); }
  });
  bN.addEventListener('click', () => { add(); sync(); });
  bA.addEventListener('click', () => { while (k < it.steps.length) add(); sync(); });
  bR.addEventListener('click', () => { ol.innerHTML = ''; k = 0; add(); sync(); });
}
function itemsBlock(set, pre, ex) {
  let h = `<div class="items">${set.main.map((it, i) => itemHTML(it, `${pre}m${i}`)).join('')}</div>`;
  if (set.more) h += `<h2 class="part">Pour aller plus loin <span class="stars">${ex.more}</span></h2><div class="items">${set.more.map((it, i) => itemHTML(it, `${pre}p${i}`)).join('')}</div>`;
  return h;
}
function wireBlock(root, set, pre) {
  set.main.forEach((it, i) => wireItem($(`[data-id="${pre}m${i}"]`, root), it));
  (set.more || []).forEach((it, i) => wireItem($(`[data-id="${pre}p${i}"]`, root), it));
}

const sheet = {};      // valeurs de la feuille, calculées une fois
let train = 0;
function render(n) {
  const ex = EX.find(e => e.n === n) || EX[0];
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n === ex.n));
  const set = sheet[ex.n] || (sheet[ex.n] = ex.build(false));
  const objTitle = ex.obj || EX.slice().reverse().find(e => e.n < ex.n && e.obj).obj;
  app.innerHTML = `
    <p class="obj"><b>Objectif ${objTitle[0]} :</b> ${objTitle[1]}</p>
    <article class="exo">
      <div class="exo-h"><span class="pill">Exercice ${ex.n}</span><span class="stars">${ex.stars}</span><span class="comp">${ex.comp}</span></div>
      <div class="exo-b">
        <p class="consigne">${ex.consigne}</p>
        <div class="tools">
          <button type="button" class="btn" data-rappel>Rappel</button>
          <button type="button" class="btn ghost" data-res>Réponses seules</button>
          <button type="button" class="btn green" data-train>↻ Nouvelles valeurs pour s’entraîner</button>
        </div>
        <div class="rappel" hidden>${ex.rappel.map(b => `<div><h3>${b.t}</h3>${b.h}</div>`).join('')}<div class="att"><h3>Attention !</h3>${ex.att}</div></div>
        <div class="sheet"><h2 class="part">Corrigé de la feuille <small>clique sur « Correction détaillée » pour la suivre étape par étape</small></h2>${itemsBlock(set, 's', ex)}</div>
        <div class="train" hidden></div>
      </div>
    </article>
    <nav class="foot">${ex.n > 1 ? `<button type="button" class="btn ghost" data-go="${ex.n - 1}">← Exercice ${ex.n - 1}</button>` : '<span></span>'}${ex.n < EX.length ? `<button type="button" class="btn ghost" data-go="${ex.n + 1}">Exercice ${ex.n + 1} →</button>` : ''}</nav>`;
  wireBlock($('.sheet', app), set, 's');
  const rap = $('.rappel', app), bRap = $('[data-rappel]', app);
  bRap.addEventListener('click', () => { rap.hidden = !rap.hidden; bRap.classList.toggle('on', !rap.hidden); if (!rap.hidden) typeset(rap); });
  const bRes = $('[data-res]', app), body = $('.exo-b', app);
  bRes.addEventListener('click', () => { body.classList.toggle('showres'); bRes.classList.toggle('on'); });
  const tr = $('.train', app);
  $('[data-train]', app).addEventListener('click', () => {
    const fresh = ex.build(true), pre = `t${++train}`;
    tr.hidden = false;
    tr.innerHTML = `<h2 class="part">Entraînement : nouvelles valeurs <small>cherche sur ton cahier, puis ouvre la correction</small></h2>${itemsBlock(fresh, pre, ex)}`;
    wireBlock(tr, fresh, pre);
    typeset(tr);
    tr.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = 'ex' + b.dataset.go; }));
  typeset(app);
  window.scrollTo(0, 0);
}
nav.innerHTML = EX.map(e => `<button type="button" data-n="${e.n}">Exercice ${e.n}</button>`).join('');
nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = 'ex' + b.dataset.n; }));
const route = () => render(+(location.hash.match(/^#ex(\d+)$/) || [])[1] || 1);
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
