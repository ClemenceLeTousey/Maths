<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feuille 4 · Exercice 6 bis — Corrigé dynamique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<style>
  :root {
    color-scheme: light;
    --paper:      #f4f5f1;
    --surface:    #ffffff;
    --ink:        #20232b;
    --ink-soft:   #565a66;
    --muted:      #8b8f99;
    --line:       #dce1ea;
    --rule:       #b9c2d1;
    --statblue:   #1C7ED6;
    --skyblue:    #339AF0;
    --blue-soft:  #e6f1fc;
    --orange:     #E8590C;   /* valeur du rang n */
    --orange-soft:#fff4e6;
    --green:      #2F9E44;   /* opération de récurrence */
    --green-soft: #ebfbee;
    --purple:     #AE3EC9;
    --shadow:     rgba(32, 35, 43, 0.10);
  }

  * { box-sizing: border-box; }
  html { font-size: 19px; }

  body {
    margin: 0;
    background: var(--paper);          /* fond clair fixe : projection en salle */
    color: var(--ink);
    font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    line-height: 1.45;
    min-height: 100vh;
    padding-bottom: 96px;
  }

  /* ---------- en-tête collant : les quatre suites + question ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 6px 18px -14px var(--shadow);
    padding: 12px 28px 12px;
  }
  .top-inner { max-width: 1200px; margin: 0 auto; }

  .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .pill {
    display: inline-block; background: var(--skyblue); color: #fff;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em;
    padding: 2px 10px; border-radius: 5px; white-space: nowrap;
  }
  .title-row h1 { margin: 0; font-size: 1.25rem; font-weight: 500; }
  .title-row .meta { margin-left: auto; color: var(--muted); font-size: 0.85rem; }

  .data-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
  .suites { display: flex; flex-wrap: wrap; gap: 8px; }
  .suite {
    border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px;
    background: #fafbf9; transition: all .3s ease; white-space: nowrap; flex: 1 1 auto; max-width: 100%; overflow-x: auto;
  }
  .suite .lab { color: var(--muted); margin-right: 6px; }
  .suite .tag {
    display: block; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted); min-height: 1.1em;
  }
  .suite.hl { border-color: var(--statblue); background: var(--blue-soft); }
  .suite.dim { opacity: 0.35; }
  .suite .tag.exp { color: var(--orange); }
  .suite .tag.rec { color: var(--green); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font: inherit; font-size: 0.8rem; font-weight: 600;
    color: var(--ink-soft); background: transparent;
    border: 1.5px solid var(--rule); border-radius: 999px;
    padding: 4px 11px; cursor: pointer;
  }
  .chip:hover { border-color: var(--statblue); color: var(--statblue); }
  .chip.done { color: var(--statblue); border-color: var(--statblue); background: var(--blue-soft); }
  .chip.active { background: var(--statblue); border-color: var(--statblue); color: #fff; }

  .question {
    margin-top: 10px; border-left: 4px solid var(--statblue); background: var(--blue-soft);
    border-radius: 0 6px 6px 0; padding: 8px 16px 9px;
  }
  .question .qlabel {
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--statblue); margin-bottom: 1px;
  }
  .question .qtext { font-size: 1.12rem; }

  /* ---------- étapes ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 22px 28px 0; }
  .steps { display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
  .step {
    background: var(--surface);
    border: 1px solid var(--line); border-left: 4px solid var(--statblue);
    border-radius: 0 8px 8px 0; padding: 12px 18px; font-size: 1.08rem;
  }
  .step.remark { border-left-color: var(--rule); color: var(--ink-soft); font-size: 1rem; background: #fbfbf9; }
  .step.warn-box { border-left-color: var(--orange); background: var(--orange-soft); }
  .step.fresh { animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .step .lead { color: var(--ink-soft); font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; }
  .step .accent { color: var(--statblue); }
  .step .warn { color: var(--orange); }
  .step .ok { color: var(--green); }
  .step p { margin: 0.25em 0; }
  .katex-display { margin: 0.45em 0 0.3em; }
  .katex { font-size: 1.06em; }
  .badge {
    display: inline-block; padding: 0 10px; border-radius: 4px; font-size: 0.95rem;
  }
  .badge.exp { background: var(--orange-soft); color: var(--orange); }
  .badge.rec { background: var(--green-soft); color: var(--green); }

  /* ---------- chaînes de termes (récurrence) ---------- */
  .chain { display: flex; align-items: center; flex-wrap: wrap; gap: 0; margin: 10px 0 4px; }
  .term {
    border: 1.5px solid var(--rule); border-radius: 8px; padding: 4px 12px; background: #fafbf9;
    white-space: nowrap; opacity: 0; animation: pop .4s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .term.known { border-color: var(--statblue); background: var(--blue-soft); }
  .term.goal { border-color: var(--green); background: var(--green-soft); }
  .term.ghost { border-style: dashed; color: var(--muted); }
  .arrow {
    display: flex; flex-direction: column; align-items: center; padding: 0 6px; min-width: 64px;
    color: var(--green); opacity: 0; animation: pop .4s ease both; font-size: 0.95rem;
  }
  .arrow svg { width: 60px; height: 14px; display: block; }
  .arrow.direct { color: var(--orange); min-width: 140px; }
  .arrow.direct svg { width: 140px; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  .chain-lab { color: var(--ink-soft); font-size: 0.92rem; margin-right: 10px; min-width: 2.2em; }

  /* ---------- tableau des égalités (question 4) ---------- */
  table.pat { border-collapse: collapse; margin: 8px 0 2px; }
  table.pat td { padding: 3px 10px; white-space: nowrap; }
  table.pat td.r { text-align: right; }
  table.pat tr.new td { animation: rise .4s ease both; }
  table.pat tr.sep td { color: var(--muted); }

  /* ---------- barre de commande ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -6px 18px -14px var(--shadow); padding: 10px 28px;
  }
  .bar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 0.95rem; font-weight: 500; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--rule); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  .btn:hover { border-color: var(--statblue); color: var(--statblue); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:disabled:hover { border-color: var(--rule); color: var(--ink); }
  .btn.primary { background: var(--statblue); border-color: var(--statblue); color: #fff; }
  .btn.primary:hover { background: #1a6fc0; color: #fff; }
  .counter { color: var(--ink-soft); font-size: 0.92rem; margin-left: 6px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 0.82rem; }
  .hint kbd {
    font: inherit; font-size: 0.78rem; border: 1px solid var(--rule); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; background: #fafbf9; color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    html { font-size: 17px; }
    .top, main, .bar { padding-left: 16px; padding-right: 16px; }
    .data-row { grid-template-columns: 1fr; }
    .chips { justify-content: flex-start; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <span class="pill">Exercice 6 bis</span>
      <h1>Explicite ou récurrence ?</h1>
      <span class="meta">TST2S · Séquence 2 · Suites numériques · Feuille 4</span>
    </div>

    <div class="data-row">
      <div class="suites" id="suites">
        <div class="suite" data-s="a"><span class="tag"></span><span class="lab">(a)</span>$u(n)=5n-3$</div>
        <div class="suite" data-s="b"><span class="tag"></span><span class="lab">(b)</span>$u(0)=20$ et $u(n+1)=u(n)+6$</div>
        <div class="suite" data-s="c"><span class="tag"></span><span class="lab">(c)</span>$u(n)=3\times 4^n$</div>
        <div class="suite" data-s="d"><span class="tag"></span><span class="lab">(d)</span>$u(0)=1$ et $u(n+1)=5\times u(n)$</div>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="question">
      <div class="qlabel" id="qlabel">Question 1</div>
      <div class="qtext" id="qtext"></div>
    </div>
  </div>
</header>

<main>
  <div class="steps" id="steps"></div>
</main>

<div class="bar">
  <div class="bar-inner">
    <button class="btn" id="btn-prev">◀ Étape précédente</button>
    <button class="btn primary" id="btn-next">Étape suivante ▶</button>
    <span class="counter" id="counter"></span>
    <span class="hint">
      <kbd>Espace</kbd> étape suivante · <kbd>←</kbd> <kbd>→</kbd> changer de question · <kbd>R</kbd> recommencer la question
    </span>
  </div>
</div>

<script>
/* ============ petits outils pour les chaînes de termes ============ */
const ARROW = `<svg viewBox="0 0 60 14"><line x1="2" y1="7" x2="56" y2="7" stroke="currentColor" stroke-width="1.8"/><path d="M50,2 L57,7 L50,12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;
const ARROW_LONG = `<svg viewBox="0 0 140 14"><line x1="2" y1="7" x2="136" y2="7" stroke="currentColor" stroke-width="1.8"/><path d="M130,2 L137,7 L130,12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;
// items : ["T|classe|contenu", "A|étiquette", "D|étiquette"] ; apparition successive
function chain(items, label) {
  let h = `<div class="chain">` + (label ? `<span class="chain-lab">${label}</span>` : "");
  items.forEach((it, i) => {
    const [kind, a, b] = it.split("|");
    const delay = `style="animation-delay:${i * 0.22}s"`;
    if (kind === "T") h += b === undefined ? `<span class="term" ${delay}>${a}</span>` : `<span class="term ${a}" ${delay}>${b}</span>`;
    else if (kind === "A") h += `<span class="arrow" ${delay}><span>${a}</span>${ARROW}</span>`;
    else if (kind === "D") h += `<span class="arrow direct" ${delay}><span>${a}</span>${ARROW_LONG}</span>`;
  });
  return h + `</div>`;
}

/* ============ contenu ============ */
const QUESTIONS = [
  { label: "Question 1",
    html: String.raw`Pour chacune de ces suites, dire si elle est définie de façon explicite ou par récurrence, puis calculer $u(2)$.` },
  { label: "Question 2",
    html: String.raw`Pour laquelle des suites (a) et (b) peut-on calculer directement $u(30)$ ? Le faire.` },
  { label: "Question 3",
    html: String.raw`On reprend la suite (d). Traduire en une phrase en français comment on passe d'un terme au suivant.` },
  { label: "Question 4",
    html: String.raw`La suite $s$ est définie par $s(0)=1$ et $s(n+1)=2\times s(n)-5$. Exprimer $s(21)$ en fonction de $s(20)$, puis $s(n)$ en fonction de $s(n-1)$.` },
];

/* hl : suites mises en avant dans l'en-tête ; tags : étiquettes « explicite / récurrence » affichées */
const STEPS = [
  /* --- Q1 --- */
  { q: 0, hl: [], tags: [],
    html: String.raw`<div class="lead">Comment reconnaître ?</div>
      <p><span class="badge exp">Explicite</span> &nbsp; $u(n)$ est donné <span class="warn">directement en fonction de $n$</span> : on remplace $n$ par sa valeur.</p>
      <p><span class="badge rec">Par récurrence</span> &nbsp; on donne le <span class="ok">premier terme</span> et une relation qui calcule un terme <span class="ok">à partir du précédent</span> : on calcule de proche en proche.</p>` },

  { q: 0, hl: ["a"], tags: ["a"],
    html: String.raw`<div class="lead">Suite (a) : $u(n)=5n-3$</div>
      <p><span class="badge exp">Explicite</span> &nbsp; $u(n)$ s'écrit directement avec $n$.</p>
      <p>On remplace $n$ par $\textcolor{#E8590C}{2}$ :</p>
      $$u(\textcolor{#E8590C}{2})=5\times\textcolor{#E8590C}{2}-3=10-3=7$$` },

  { q: 0, hl: ["b"], tags: ["a","b"],
    html: String.raw`<div class="lead">Suite (b) : $u(0)=20$ et $u(n+1)=u(n)+6$</div>
      <p><span class="badge rec">Par récurrence</span> &nbsp; on a le premier terme $u(0)$, et chaque terme se calcule à partir du précédent.</p>
      <p>Pour obtenir $u(2)$, il faut d'abord $u(1)$ :</p>
      $$u(1)=u(0)+6=20+6=26\qquad u(2)=u(1)+6=26+6=32$$
      ${chain(["T|known|$u(0)=20$", "A|$+6$", "T|$u(1)=26$", "A|$+6$", "T|goal|$u(2)=32$"])}` },

  { q: 0, hl: ["c"], tags: ["a","b","c"],
    html: String.raw`<div class="lead">Suite (c) : $u(n)=3\times 4^n$</div>
      <p><span class="badge exp">Explicite</span> &nbsp; $u(n)$ s'écrit directement avec $n$.</p>
      <p>On remplace $n$ par $\textcolor{#E8590C}{2}$, et on calcule <span class="warn">d'abord la puissance</span> :</p>
      $$u(\textcolor{#E8590C}{2})=3\times 4^{\textcolor{#E8590C}{2}}=3\times16=48$$` },

  { q: 0, hl: [], tags: ["a","b","c"], remark: true, warnbox: true,
    html: String.raw`<span class="warn">Attention :</span> $3\times4^2\neq12^2$. La puissance ne porte que sur le $4$ : on ne multiplie pas $3\times4$ avant d'élever au carré.` },

  { q: 0, hl: ["d"], tags: ["a","b","c","d"],
    html: String.raw`<div class="lead">Suite (d) : $u(0)=1$ et $u(n+1)=5\times u(n)$</div>
      <p><span class="badge rec">Par récurrence</span> &nbsp; on a le premier terme $u(0)$, et chaque terme se calcule à partir du précédent.</p>
      $$u(1)=5\times u(0)=5\times1=5\qquad u(2)=5\times u(1)=5\times5=25$$
      ${chain(["T|known|$u(0)=1$", "A|$\\times5$", "T|$u(1)=5$", "A|$\\times5$", "T|goal|$u(2)=25$"])}` },

  /* --- Q2 --- */
  { q: 1, hl: ["a","b"], tags: ["a","b"], dim: ["c","d"],
    html: String.raw`<div class="lead">Suite (b) : par récurrence</div>
      <p>Pour obtenir $u(30)$, il faut connaître $u(29)$, donc $u(28)$, … : on doit calculer <span class="warn">tous les termes un par un</span>, depuis $u(0)$.</p>
      ${chain(["T|known|$u(0)$", "A|$+6$", "T|$u(1)$", "A|$+6$", "T|$u(2)$", "A|$+6$", "T|ghost|$\\cdots$", "A|$+6$", "T|$u(29)$", "A|$+6$", "T|goal|$u(30)$"])}
      <p>Cela fait $30$ calculs : ce n'est pas un calcul direct.</p>` },

  { q: 1, hl: ["a"], tags: ["a","b"], dim: ["b","c","d"],
    html: String.raw`<div class="lead">Suite (a) : explicite</div>
      <p>On remplace directement $n$ par $\textcolor{#E8590C}{30}$, sans calculer les termes précédents :</p>
      ${chain(["T|known|$n=30$", "D|on remplace $n$", "T|goal|$u(30)$"])}
      $$u(\textcolor{#E8590C}{30})=5\times\textcolor{#E8590C}{30}-3=150-3=147$$` },

  { q: 1, hl: ["a"], tags: ["a","b"], dim: ["b","c","d"],
    html: String.raw`<p>On peut calculer directement $u(30)$ pour la suite <span class="accent">(a)</span>, définie de façon explicite : $u(30)=147$.</p>` },

  /* --- Q3 --- */
  { q: 2, hl: ["d"], tags: ["d"], dim: ["a","b","c"],
    html: String.raw`<div class="lead">On lit la relation de récurrence</div>
      <p>$u(n+1)=5\times u(n)$ : le terme <span class="ok">suivant</span> $u(n+1)$ s'obtient à partir du terme $u(n)$ en le multipliant par $5$.</p>
      ${chain(["T|known|$u(n)$", "A|$\\times5$", "T|goal|$u(n+1)$"])}` },

  { q: 2, hl: ["d"], tags: ["d"], dim: ["a","b","c"],
    html: String.raw`<p class="accent">Pour passer d'un terme au suivant, on multiplie par $5$.</p>` },

  { q: 2, hl: [], tags: ["d"], dim: ["a","b","c"], remark: true,
    html: String.raw`Vérification avec la question 1 : $u(0)=1$, puis $u(1)=5$, puis $u(2)=25$. On multiplie bien par $5$ à chaque fois.` },

  /* --- Q4 --- */
  { q: 3, hl: [], tags: [], dim: ["a","b","c","d"],
    html: String.raw`<div class="lead">On traduit la relation en français</div>
      <p>$s(n+1)=2\times s(n)-5$ signifie :</p>
      <p class="accent" style="text-align:center">un terme $=2\times$ (le terme précédent) $-\,5$</p>` },

  { q: 3, hl: [], tags: [], dim: ["a","b","c","d"],
    html: String.raw`<div class="lead">$s(21)$ en fonction de $s(20)$</div>
      <p>Le terme qui précède $s(21)$ est $s(20)$. On remplace $n$ par $\textcolor{#E8590C}{20}$ dans la relation :</p>
      $$s(\textcolor{#E8590C}{20}+1)=2\times s(\textcolor{#E8590C}{20})-5\qquad\text{donc}\qquad s(21)=2\times s(20)-5$$` },

  { q: 3, hl: [], tags: [], dim: ["a","b","c","d"],
    html: String.raw`<div class="lead">$s(n)$ en fonction de $s(n-1)$</div>
      <p>On repère la régularité : chaque terme s'écrit avec le terme précédent.</p>
      <table class="pat">
        <tr><td class="r">$s(1)$</td><td>$=2\times s(0)-5$</td></tr>
        <tr><td class="r">$s(2)$</td><td>$=2\times s(1)-5$</td></tr>
        <tr class="sep"><td class="r">$\vdots$</td><td></td></tr>
        <tr><td class="r">$s(21)$</td><td>$=2\times s(20)-5$</td></tr>
        <tr class="sep"><td class="r">$\vdots$</td><td></td></tr>
        <tr class="new"><td class="r">$s(\textcolor{#E8590C}{n})$</td><td>$=2\times s(\textcolor{#E8590C}{n-1})-5$</td></tr>
      </table>
      <p>Le terme qui précède $s(n)$ est $s(n-1)$, d'où :</p>
      $$s(n)=2\times s(n-1)-5\quad\text{pour tout entier } n\geqslant1$$` },

  { q: 3, hl: [], tags: [], dim: ["a","b","c","d"], remark: true,
    html: String.raw`Pourquoi $n\geqslant1$ ? Pour $n=0$, on aurait besoin de $s(-1)$, qui n'existe pas : la suite commence au rang $0$.` },
];

/* ============ navigation ============ */
const qlabel = document.getElementById("qlabel");
const qtext = document.getElementById("qtext");
const stepsEl = document.getElementById("steps");
const chipsEl = document.getElementById("chips");
const counter = document.getElementById("counter");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const suiteEls = Array.from(document.querySelectorAll(".suite"));
const KIND = { a: "exp", b: "rec", c: "exp", d: "rec" };

function renderMath(node) {
  if (typeof renderMathInElement !== "function") return;
  renderMathInElement(node, {
    delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
    throwOnError: false,
  });
}

// état : question affichée qc, dernière étape révélée cur
// (cur < firstStepOf(qc) : question posée, aucune étape révélée)
let qc = 0, cur = -1;
const firstStepOf = q => STEPS.findIndex(s => s.q === q);
const currentQ = () => qc;

QUESTIONS.forEach((qq, i) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = qq.label.replace("Question ", "");
  b.title = qq.label;
  b.addEventListener("click", () => goToQuestion(i));
  chipsEl.appendChild(b);
});

function renderSuites(q) {
  // état de l'en-tête : celui de la dernière étape révélée, ou état "question posée"
  const s = cur >= firstStepOf(q) ? STEPS[cur] : null;
  const first = STEPS[firstStepOf(q)];
  const hl = s ? s.hl : [], tags = s ? s.tags : [];
  const dimQ = s ? (s.dim || []) : (first.dim || []);
  suiteEls.forEach(e => {
    const k = e.dataset.s, tag = e.querySelector(".tag");
    e.classList.toggle("hl", hl.includes(k));
    e.classList.toggle("dim", dimQ.includes(k));
    const on = tags.includes(k);
    tag.className = "tag" + (on ? " " + KIND[k] : "");
    tag.textContent = on ? (KIND[k] === "exp" ? "explicite" : "par récurrence") : "";
  });
}

function render() {
  const q = currentQ();
  qlabel.textContent = QUESTIONS[q].label;
  qtext.innerHTML = QUESTIONS[q].html;
  renderMath(qtext);

  Array.from(chipsEl.children).forEach((c, i) => {
    c.classList.toggle("active", i === q);
    c.classList.toggle("done", i < q);
  });

  stepsEl.innerHTML = "";
  let shown = 0, total = STEPS.filter(s => s.q === q).length;
  STEPS.forEach((s, i) => {
    if (s.q !== q || i > cur) return;
    shown++;
    const d = document.createElement("div");
    d.className = "step" + (s.remark ? " remark" : "") + (s.warnbox ? " warn-box" : "") + (i === cur ? " fresh" : "");
    d.innerHTML = s.html;
    if (i !== cur) d.querySelectorAll(".term, .arrow").forEach(n => { n.style.animation = "none"; n.style.opacity = "1"; });
    stepsEl.appendChild(d);
    renderMath(d);
  });

  renderSuites(q);

  counter.textContent = `Étape ${shown} / ${total}`;
  btnPrev.disabled = cur < 0 && qc === 0;
  const last = cur === STEPS.length - 1;
  btnNext.disabled = last;
  btnNext.textContent = (shown === total && !last) ? "Question suivante ▶" : "Étape suivante ▶";

  const fresh = stepsEl.querySelector(".fresh");
  if (fresh) fresh.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function next() {
  if (cur >= STEPS.length - 1) return;
  if (STEPS[cur + 1].q === qc) cur++;
  else qc = STEPS[cur + 1].q;          // on pose la question suivante, sans étape
  render();
}
function prev() {
  if (cur >= firstStepOf(qc)) cur--;
  else if (qc > 0) qc--;               // retour à la question précédente, entièrement révélée
  else return;
  render();
}
function goToQuestion(q) {
  q = Math.max(0, Math.min(QUESTIONS.length - 1, q));
  qc = q;
  cur = firstStepOf(q) - 1;           // question posée, aucune étape révélée
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function nextQuestion() { if (currentQ() < QUESTIONS.length - 1) goToQuestion(currentQ() + 1); }
function prevQuestion() {
  if (cur >= firstStepOf(currentQ())) goToQuestion(currentQ());   // d'abord revenir au début de la question
  else if (currentQ() > 0) goToQuestion(currentQ() - 1);
}

btnPrev.addEventListener("click", prev);
btnNext.addEventListener("click", next);
document.addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "Backspace" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); nextQuestion(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prevQuestion(); }
  else if (e.key === "r" || e.key === "R") { goToQuestion(currentQ()); }
});

renderMath(document.getElementById("suites"));
render();
</script>
</body>
</html>
